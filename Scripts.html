  async function submitPainterQuotation(id) {
    const quotFor = document.getElementById('pq_for')?.value.trim() || '';
    const title = document.getElementById('pq_title')?.value.trim() || quotFor || 'Painter Training';
    const qNo = document.getElementById('pq_no')?.value.trim();
    const date = document.getElementById('pq_date')?.value.trim();
    if (!quotFor && !title) {
      showToast('Please enter the recipient name in QUOTATION FOR.');
      return;
    }
    if (!qNo) {
      showToast('Please enter Quotation No.');
      return;
    }

    const supplier = document.getElementById('pq_supplier')?.value.trim() || '';
    const receivers = document.getElementById('pq_receivers')?.value.trim() || '';
    const place = document.getElementById('pq_place')?.value.trim() || '';
    const time = document.getElementById('pq_time')?.value.trim() || '';
    const adv = parseFloat(document.getElementById('pq_adv')?.value || 0) || 0;

    const items = (window._tempQuotItems || [])
      .filter(it => it && (it.desc && it.desc.trim() !== ''))
      .map((it, idx) => ({
        no: idx + 1,
        desc: it.desc.trim(),
        qty: Number(it.qty || 0),
        price: Number(it.price || 0),
        amount: Number(it.qty || 0) * Number(it.price || 0)
      }));

    const totalAmt = items.reduce((s, it) => s + it.amount, 0);
    const remAmt = totalAmt - adv;

    await gas('savePainterQuotation', {
      QuotationId: id || undefined,
      QuotationNo: qNo,
      Date: date,
      Title: title,
      QuotationFor: quotFor,
      Supplier: supplier,
      Receivers: receivers,
      Place: place,
      Time: time,
      TotalAmount: totalAmt,
      AdvanceAmount: adv,
      RemainingAmount: remAmt,
      ItemsJson: JSON.stringify(items),
      Status: 'Active',
      CreatedBy: state.user.Name
    });

    closeModal();
    showToast('Painter Training Quotation saved!');
    await refreshData();
    _selectedQuotationId = id || state.data.painterQuotations[state.data.painterQuotations.length - 1]?.QuotationId;
    renderPainterTrainingView();
  }

  async function importPainterQuotationExcel(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        if (typeof XLSX === 'undefined') { showToast('XLSX library not loaded.'); return; }
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheetName = wb.SheetNames[0];
        const ws = wb.Sheets[sheetName];

        const title = ws['B3'] ? ws['B3'].v : sheetName;
        const date = ws['E4'] ? ws['E4'].v : (state.data.today || '');
        const qNo = ws['E5'] ? ws['E5'].v : ('PTQ-' + sheetName);
        const supp = ws['B6'] ? ws['B6'].v : '';
        const recv = ws['E6'] ? ws['E6'].v : 'Jade Coatings';
        const placeTime = ws['B14'] ? String(ws['B14'].v || '') : '';

        const SAMPLE_QUOT_DESCS = [
          'welcome drink', 'dinner', 'deserts', 'desserts', 'service charge', 'beer', 'liqure', 'liquor', 'other bills'
        ];
        const rawRows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        const items = [];
        for (let r = 16; r < Math.min(rawRows.length, 24); r++) {
          const row = rawRows[r] || [];
          const no = row[1];
          const desc = row[2];
          const qty = parseFloat(row[3]) || 0;
          const price = parseFloat(row[4]) || 0;
          const amt = parseFloat(row[5]) || (qty * price);
          if (desc && String(desc).trim() && !String(desc).includes('Total Amount')) {
            const rawDesc = String(desc).trim();
            const cleanDesc = SAMPLE_QUOT_DESCS.includes(rawDesc.toLowerCase()) ? '' : rawDesc;
            items.push({
              no: no || items.length + 1,
              desc: cleanDesc,
              qty: qty,
              price: price,
              amount: amt
            });
          }
        }

        const adv = ws['F25'] ? (parseFloat(ws['F25'].v) || 0) : 0;
        const tot = items.reduce((s, it) => s + it.amount, 0);

        const newQ = {
          QuotationNo: String(qNo).trim(),
          Date: String(date).trim(),
          Title: String(title).replace(/QUOTATION FOR /i, '').trim(),
          QuotationFor: String(title).replace(/QUOTATION FOR /i, '').trim(),
          Supplier: String(supp).trim(),
          Receivers: String(recv).trim(),
          Place: placeTime.split('\n')[0] || '',
          Time: placeTime.split('\n')[1] || '',
          TotalAmount: tot,
          AdvanceAmount: adv,
          RemainingAmount: tot - adv,
          ItemsJson: JSON.stringify(items.length ? items : DEFAULT_QUOTATION_ITEMS),
          Status: 'Active',
          CreatedBy: state.user.Name
        };

        await gas('savePainterQuotation', newQ);
        showToast('Quotation imported successfully!');
        await refreshData();
        renderPainterTrainingView();
      } catch (err) {
        showToast('Error importing quotation: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  async function importPainterBillBalanceExcel(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        if (typeof XLSX === 'undefined') { showToast('XLSX library not loaded.'); return; }
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheetName = wb.SheetNames[0];
        const ws = wb.Sheets[sheetName];
        const progName = sheetName.trim();

        const rawRows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        const entries = [];
        // Rows 5..12
        for (let r = 5; r < rawRows.length; r++) {
          const row = rawRows[r] || [];
          const d = String(row[1] || '').trim();
          const desc = String(row[2] || '').trim();
          const w = parseFloat(row[3]) || 0;
          const dep = parseFloat(row[4]) || 0;
          if (desc && !desc.toLowerCase().includes('total')) {
            entries.push({
              ProgramName: progName,
              Date: d || state.data.today,
              Description: desc,
              Withdrawal: w,
              Deposit: dep,
              Balance: dep - w
            });
          }
        }

        if (!entries.length) {
          showToast('No transaction rows found in selected file. Template is ready for entries.');
          _selectedBbProgram = progName;
          renderPainterTrainingView();
          return;
        }

        await gas('importPainterBillBalances', entries, state.user.Name);
        showToast(`Imported ${entries.length} ledger entries!`);
        _selectedBbProgram = progName;
        await refreshData();
        renderPainterTrainingView();
      } catch (err) {
        showToast('Error importing bill balance: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function exportPainterQuotationExcel() {
    const quotations = state.data.painterQuotations || [];
    const activeQ = quotations.find(q => q.QuotationId === _selectedQuotationId) || quotations[0];
    if (!activeQ) { showToast('No quotation to export.'); return; }

    let items = [];
    try { items = JSON.parse(activeQ.ItemsJson || '[]'); } catch (e) {}
    if (!items.length) items = DEFAULT_QUOTATION_ITEMS;
    items = items.filter(it => it && ((it.desc && it.desc.trim() !== '') || it.qty > 0 || it.price > 0));

    const rows = items.map((it, idx) => ({
      'No.': it.no || (idx + 1),
      'Description': it.desc || '',
      'Quantity': it.qty || 0,
      'Price': it.price || 0,
      'Amount': it.amount || ((it.qty || 0) * (it.price || 0))
    }));

    rows.push({ 'No.': '', 'Description': 'Advance Amount', 'Quantity': '', 'Price': '', 'Amount': activeQ.AdvanceAmount || 0 });
    rows.push({ 'No.': '', 'Description': 'Remaining Amount', 'Quantity': '', 'Price': '', 'Amount': activeQ.RemainingAmount || 0 });

      const ws = XLSX.utils.json_to_sheet(rows);

    const balances = state.data.painterBillBalances || [];

        'Withdrawal': w,
        'Deposit': dep,
        'Balance': running
      };

  function renderPettyCashView() {
    const today = state.data.today || new Date().toISOString().slice(0, 10);
    if (!_pcState.date) _pcState.date = today;
    if (!_pcState.month) _pcState.month = today.slice(0, 7);

    const all = state.data.pettyCash || [];
    const isIn = (p) => p.Type === 'In' || p.Type === 'Cash In';
    const isOut = (p) => p.Type === 'Out' || p.Type === 'Cash Out';

    const periodStart = _pcState.mode === 'daily' ? _pcState.date : (_pcState.month + '-01');
    const prevRows = all.filter(p => String(p.Date) < periodStart);
    const prevBalance = prevRows.reduce((s, p) => s + (isIn(p) ? Number(p.Amount || 0) : -Number(p.Amount || 0)), 0);

    const currentRows = all.filter(p =>
      _pcState.mode === 'daily'
        ? String(p.Date) === _pcState.date
        : String(p.Date).startsWith(_pcState.month)
    );

    const inRows = currentRows.filter(isIn);
    const outRows = currentRows.filter(isOut);

    const periodInSum = inRows.reduce((s, p) => s + Number(p.Amount || 0), 0);
    const totalInWithBF = prevBalance + periodInSum;
    const totalOut = outRows.reduce((s, p) => s + Number(p.Amount || 0), 0);
    const balanceCF = totalInWithBF - totalOut;

    const maxLen = Math.max(inRows.length + 1, outRows.length, 5);
    const prevLabel = _pcState.mode === 'daily'
      ? `Balance from previous day`
      : `Balance from previous month`;
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const [yy, mm] = _pcState.month.split('-');
    const monthTitle = `${monthNames[Number(mm) - 1] || mm} ${yy}`;
    const reportTitle = _pcState.mode === 'daily'
      ? `Daily Petty Cash Report - Office - ${_pcState.date.replace(/-/g, '.')}`
      : `Petty Cash Collection Report - Office - ${monthTitle}`;

    let bodyRows = '';
    for (let i = 0; i < maxLen; i++) {

          : `<td>&nbsp;</td><td></td><td></td>`;
      }

      const outItem = outRows[i];
      const outCells = outItem
        ? `<td>${esc(outItem.Date)}</td><td>${esc(outItem.ReceiptNo || outItem.VoucherNo)}</td><td>${esc(outItem.PaidTo)}</td><td>${esc(outItem.Description)} <button class="btn btn-sm btn-secondary no-print" style="padding:1px 5px;font-size:10px;margin-left:4px;" title="Edit Entry" onclick="openPettyCashModal('Out', '${esc(outItem.PcId)}')">✏️</button><button class="btn btn-sm btn-danger no-print" style="padding:1px 5px;font-size:10px;margin-left:2px;" title="Delete Entry" onclick="removePettyCash('${esc(outItem.PcId)}')">🗑️</button></td><td style="text-align:right;">${fmtMoney(outItem.Amount)}</td>`
        : `<td>&nbsp;</td><td></td><td></td><td></td><td></td>`;

        <div class="card"><div class="kpi-label">Balance B/F</div><div class="kpi-val">${fmtMoney(prevBalance)}</div></div>
        <div class="card"><div class="kpi-label">Total In (incl. B/F)</div><div class="kpi-val" style="color:var(--success)">${fmtMoney(totalInWithBF)}</div></div>

      </div>

      <div class="section-header no-print">
        <div class="section-actions">
          ${_pcState.mode === 'daily'
            ? `<input type="date" style="width:auto;" value="${esc(_pcState.date)}" onchange="_pcState.date=this.value; renderPettyCashView()">`
            : `<input type="month" style="width:auto;" value="${esc(_pcState.month)}" onchange="_pcState.month=this.value; renderPettyCashView()">`

          <label class="btn btn-sm btn-secondary" style="cursor:pointer; margin:0;">

          <button class="btn btn-sm btn-secondary" onclick="exportPettyCashExcel()">⬇ Export Excel</button>

            </tr>
            <tr>

  function importPettyCashFormat(file) {
    if (!file || typeof XLSX === 'undefined') return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      const toImport = [];
      rows.forEach(r => {
        // Check In side (Cols B,C,D -> idx 1,2,3) and Out side (Cols E,F,G,H,I -> idx 4,5,6,7,8)
        const inAmt = Number(r[3]);
        if (r[1] && !isNaN(inAmt) && inAmt > 0 && !/date/i.test(String(r[1]))) {
          toImport.push({ Date: String(r[1]).slice(0, 10), Type: 'In', ReceiptNo: String(r[2]), Amount: inAmt, Description: 'Imported In', RecordedBy: state.user.Name });
        }
        const outAmt = Number(r[8]);
        if (r[4] && !isNaN(outAmt) && outAmt > 0 && !/date/i.test(String(r[4]))) {
          toImport.push({ Date: String(r[4]).slice(0, 10), Type: 'Out', ReceiptNo: String(r[5]), PaidTo: String(r[6]), Description: String(r[7]), Amount: outAmt, RecordedBy: state.user.Name });
        }
      });
      if (toImport.length) {
        await gas('importRecords', 'PettyCash', toImport);
        showToast(`Imported ${toImport.length} petty cash entries!`);
        await refreshData();
      } else {
        showToast('No valid In/Out entries found in file.');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function openLeaveModal(leaveId = null) {
    const isEdit = !!leaveId;
    const l = isEdit ? (state.data.leaves || []).find(x => x.LeaveId === leaveId) : null;
    const activeEmps = (state.data.employees || []).filter(e => e.Status !== 'Inactive');
    const selectedEmpId = l ? l.UserId : state.user.UserId;
    const empOptions = activeEmps.length
      ? activeEmps.map(e => `<option value="${esc(e.EmpId)}" data-name="${esc(e.Name)}" ${e.EmpId === selectedEmpId || e.Name === (l ? l.UserName : '') ? 'selected' : ''}>${esc(e.Name)} (${esc(e.Position || e.Designation || 'Staff')})</option>`).join('')
      : `<option value="${esc(state.user.UserId)}" data-name="${esc(state.user.Name)}">${esc(state.user.Name)}</option>`;

    const selectedType = l ? l.Type : 'Annual';
    const typeOpts = ['Annual', 'Casual', 'Sick', 'Duty Leave'].map(t => `<option ${t === selectedType ? 'selected' : ''}>${t}</option>`).join('');
    const statusOpts = ['Pending', 'Approved', 'Rejected'].map(s => `<option ${(l?.Status || 'Pending') === s ? 'selected' : ''}>${s}</option>`).join('');

    openModal(
      isEdit ? 'Edit Leave Request' : 'Request Leave',
      `
        <div class="form-group">
          <label>Employee Name *</label>
          <select id="fLvEmp">
            ${empOptions}
          </select>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Leave Type</label><select id="fLvType">${typeOpts}</select></div>
          <div class="form-group"><label>Days</label><input type="number" min="0.5" step="0.5" id="fLvDays" value="${l ? l.Days : 1}"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Start Date</label><input type="date" id="fLvStart" value="${l ? l.StartDate : state.data.today}"></div>
          <div class="form-group"><label>End Date</label><input type="date" id="fLvEnd" value="${l ? l.EndDate : state.data.today}"></div>
        </div>
        <div class="form-group"><label>Reason</label><textarea id="fLvReason" rows="2" placeholder="Reason for leave request...">${esc(l ? l.Reason : '')}</textarea></div>
        ${isEdit ? `
          <div class="form-group"><label>Status</label><select id="fLvStatus">${statusOpts}</select></div>
          <div class="form-group" style="background:#fef2f2; border:1px solid #fecaca; border-radius:6px; padding:10px 12px; margin-top:12px;">
            <label style="color:#991b1b; font-weight:700; display:block; margin-bottom:4px;">
              🔒 Enter Login PIN / Password to Authorize Edit *
            </label>
            <input type="password" id="fLvPin" placeholder="Enter your Login PIN (${esc(state.user.Name)})" style="max-width:260px; font-size:15px; letter-spacing:2px;" autocomplete="off">
            <div id="fLvPinError" style="color:#b91c1c; font-size:12px; font-weight:600; margin-top:4px;"></div>
          </div>
        ` : ''}
      `,
      `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="submitLeave('${esc(leaveId || '')}')">${isEdit ? 'Save Changes' : 'Submit Request'}</button>`
    );
  }

  async function submitLeave(leaveId) {
    const isEdit = !!leaveId;
    if (isEdit) {
      const pin = document.getElementById('fLvPin')?.value.trim();
      const errEl = document.getElementById('fLvPinError');
      if (!pin) {
        if (errEl) errEl.textContent = 'Please enter your login PIN/Password to authorize edit.';
        showToast('Login PIN required to edit!');
        return;
      }
      try {
        await gas('authenticateUser', state.user.UserId, pin);
      } catch (e) {
        if (errEl) errEl.textContent = 'Incorrect Login PIN / Password. Edit rejected.';
        showToast('Invalid Login PIN! Edit rejected.');
        return;
      }
    }

    const sel = document.getElementById('fLvEmp');
    const empId = sel.value;
    const empName = sel.options[sel.selectedIndex]?.getAttribute('data-name') || sel.options[sel.selectedIndex]?.text || state.user.Name;
    const existingLeave = isEdit ? (state.data.leaves || []).find(x => x.LeaveId === leaveId) : null;
    const statusVal = isEdit && document.getElementById('fLvStatus') ? document.getElementById('fLvStatus').value : (existingLeave?.Status || 'Pending');

    await gas('saveLeaveRequest', {
      LeaveId: leaveId || '',
      UserId: empId,
      UserName: empName,
      Type: document.getElementById('fLvType').value,
      Days: document.getElementById('fLvDays').value,
      StartDate: document.getElementById('fLvStart').value,
      EndDate: document.getElementById('fLvEnd').value,
      Reason: document.getElementById('fLvReason').value,
      Status: statusVal,
      ApprovedBy: (statusVal === 'Approved' || statusVal === 'Rejected') ? (existingLeave?.ApprovedBy || state.user.Name) : ''
    });
    closeModal();
    showToast(isEdit ? 'Leave request updated!' : 'Leave request submitted!');
    await refreshData();
  }

  async function removeLeave(leaveId) {
    verifyPinAndExecute('delete this leave request', async () => {
      await gas('deleteLeaveRequest', leaveId);
      showToast('Leave request deleted.');
      await refreshData();
    });
  }

    await refreshData();
  }

  function readCustomTabTemplate(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        let json = [];
        if (typeof XLSX !== 'undefined') {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          json = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
        }
        if (json.length) {
          const cols = Object.keys(json[0]);
          document.getElementById('fCtCols').value = cols.join(', ');
          if (!document.getElementById('fCtName').value) {
            document.getElementById('fCtName').value = file.name.replace(/\.[^.]+$/, '');
          }
          _ctPendingRows = json;
          showToast(`Detected ${cols.length} columns and ${json.length} rows!`);
        }
      } catch (err) {
        showToast('Error reading file: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function renderCustomTabView(tabId) {
    const tab = (state.data.customTabs || []).find(t => t.TabId === tabId);

    const rows = (state.data.customTabRows || [])
      .filter(r => r.TabId === tabId)
      .map(r => {
        let d = {};
        try { d = JSON.parse(r.DataJson || '{}'); } catch (e) {}
        return { _id: r.RowId, ...d };
      }).reverse();

    // Auto-calculate numeric column totals
    const totals = {};
    cols.forEach((c, idx) => {
      if (idx === 0) { totals[c] = 'TOTAL'; return; }
      const vals = rows.map(r => r[c]).filter(v => v !== '' && v !== null && v !== undefined);
      if (vals.length && vals.every(v => !isNaN(Number(String(v).replace(/,/g, ''))))) {
        const sum = vals.reduce((a, b) => a + Number(String(b).replace(/,/g, '')), 0);
        totals[c] = Number(sum.toFixed(2)).toLocaleString('en-US', { maximumFractionDigits: 2 });
      } else {
        totals[c] = '';
      }
    });

    document.getElementById('mainContent').innerHTML = `
      <div class="section-header no-print">
        <input class="search-input" placeholder="Search ${esc(tab.Name)}..." oninput="filterTable('ctTable', this.value)">
        <div class="section-actions">

          <tbody>

  function importIntoCustomTab(tabId, file) {

      const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: false });

  function exportCustomTabExcel(tabId) {
    if (typeof XLSX === 'undefined') return;
    const tab = (state.data.customTabs || []).find(t => t.TabId === tabId);

    try { cols = JSON.parse(tab.ColumnsJson || '[]'); } catch (e) {}
    const rows = (state.data.customTabRows || []).filter(r => r.TabId === tabId).map(r => {
      try { return JSON.parse(r.DataJson || '{}'); } catch (e) { return {}; }
    });
    const ws = XLSX.utils.json_to_sheet(rows, { header: cols });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, tab.Name.slice(0, 30));
    XLSX.writeFile(wb, `${tab.Name}_${state.data.today}.xlsx`);
  }

  const _reportState = {
    source: 'Invoices',
    uploadedName: '',
    uploadedRows: [],
    selectedCols: [],
    dateFrom: '',
    dateTo: '',
    search: '',
    groupBy: '',
    calcType: 'SUM',
    lastOutputRows: [],
    lastOutputCols: []
  };

  function getReportDataset() {
    if (_reportState.source === 'UploadedFile') {
      return _reportState.uploadedRows || [];
    }
    const map = {
      Invoices: state.data.invoices,
      Transactions: state.data.transactions,
      Inventory: state.data.inventory.map(it => ({
        ...it,
        StockValue: (Number(it.UnitPrice) || 0) * (Number(it.StockQty) || 0)
      })),
      Customers: state.data.customers,
      Attendance: state.data.attendance.map(a => {
        let hrs = '';
        if (a.ClockIn && a.ClockOut) {
          const [h1, m1] = String(a.ClockIn).split(':').map(Number);
          const [h2, m2] = String(a.ClockOut).split(':').map(Number);
          if (!isNaN(h1) && !isNaN(h2)) {
            hrs = (((h2 * 60 + m2) - (h1 * 60 + m1)) / 60).toFixed(2);
          }
        }
        return { ...a, HoursWorked: hrs };
      }),
      Leaves: state.data.leaves,
      Tasks: state.data.tasks
    };
    return map[_reportState.source] || [];
  }

  function renderReportsView() {
    const raw = getReportDataset();
    const allCols = raw.length ? Object.keys(raw[0]) : [];
    if (!_reportState.selectedCols.length || !_reportState.selectedCols.every(c => allCols.includes(c))) {
      _reportState.selectedCols = allCols.slice(0, 8);
    }

    // Filter rows
    const dateCol = allCols.find(c => /date/i.test(c));
    const q = _reportState.search.toLowerCase();
    const filtered = raw.filter(r => {
      if (dateCol && _reportState.dateFrom && String(r[dateCol]) < _reportState.dateFrom) return false;
      if (dateCol && _reportState.dateTo && String(r[dateCol]) > _reportState.dateTo) return false;
      if (q && !Object.values(r).some(v => String(v).toLowerCase().includes(q))) return false;
      return true;
    });

    // Detect numeric columns among selectedCols
    const numCols = _reportState.selectedCols.filter(c => {
      const vals = filtered.map(r => r[c]).filter(v => v !== '' && v !== null && v !== undefined);
      return vals.length > 0 && vals.every(v => !isNaN(Number(String(v).replace(/,/g, ''))));
    });

    // Build output rows (raw or grouped with system calculations)
    let outCols = [..._reportState.selectedCols];
    let outRows = filtered;

    if (_reportState.groupBy && allCols.includes(_reportState.groupBy)) {
      const grpCol = _reportState.groupBy;
      const groups = {};
      filtered.forEach(r => {
        const k = String(r[grpCol] || '(Blank)');
        if (!groups[k]) groups[k] = [];
        groups[k].push(r);
      });

      const calcCols = numCols.filter(c => c !== grpCol);
      outCols = [grpCol, 'Count', ...calcCols.map(c => `${c} (${_reportState.calcType})`)];
      outRows = Object.keys(groups).map(k => {
        const list = groups[k];
        const rowObj = { [grpCol]: k, Count: list.length };
        calcCols.forEach(c => {
          const nums = list.map(x => Number(String(x[c]).replace(/,/g, '')) || 0);
          const sum = nums.reduce((a, b) => a + b, 0);
          let val = sum;
          if (_reportState.calcType === 'AVG') val = nums.length ? sum / nums.length : 0;
          else if (_reportState.calcType === 'MIN') val = nums.length ? Math.min(...nums) : 0;
          else if (_reportState.calcType === 'MAX') val = nums.length ? Math.max(...nums) : 0;
          rowObj[`${c} (${_reportState.calcType})`] = Number(val.toFixed(2));
        });
        return rowObj;
      });
    }

    _reportState.lastOutputCols = outCols;
    _reportState.lastOutputRows = outRows;

    // Grand Totals row
    const totals = {};
    outCols.forEach((c, idx) => {
      if (idx === 0) { totals[c] = 'TOTAL'; return; }
      const vals = outRows.map(r => r[c]).filter(v => v !== '' && v !== null && v !== undefined);
      if (vals.length && vals.every(v => !isNaN(Number(String(v).replace(/,/g, ''))))) {
        const sum = vals.reduce((a, b) => a + Number(String(b).replace(/,/g, '')), 0);
        totals[c] = Number(sum.toFixed(2)).toLocaleString('en-US', { maximumFractionDigits: 2 });
      } else {
        totals[c] = '';
      }
    });

    const savedOpts = state.data.savedReports.map(sr =>
      `<option value="${esc(sr.ReportId)}">${esc(sr.Name)} (${esc(sr.Source)})</option>`
    ).join('');

    document.getElementById('mainContent').innerHTML = `
      <div class="card no-print" style="margin-bottom:16px;">
        <div class="section-header">
          <div>
            <h3>Custom Report Builder</h3>
            <p style="font-size:12px; color:var(--muted);">Create custom reports from Office data or directly from any uploaded Excel / CSV file with automatic calculations.</p>
          </div>
          <div class="section-actions">
            <select id="savedRptSelect" style="width:auto;" onchange="loadSavedReport(this.value)">
              <option value="">-- Load Saved Report --</option>
              ${savedOpts}
            </select>
            <button class="btn btn-sm btn-secondary" onclick="saveCurrentReport()">💾 Save Report</button>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Data Source</label>
            <select onchange="changeReportSource(this.value)">
              ${['Invoices', 'Transactions', 'Inventory', 'Customers', 'Attendance', 'Leaves', 'Tasks'].map(s =>
                `<option value="${s}" ${_reportState.source === s ? 'selected' : ''}>${s}</option>`
              ).join('')}
              <option value="UploadedFile" ${_reportState.source === 'UploadedFile' ? 'selected' : ''}>📄 Uploaded Excel / CSV File ${_reportState.uploadedName ? '(' + esc(_reportState.uploadedName) + ')' : ''}</option>
            </select>
          </div>
          <div class="form-group">
            <label>Or Upload Excel / CSV File for Instant Report</label>
            <input type="file" accept=".xlsx,.xls,.csv" onchange="handleReportFileUpload(this.files[0])">
          </div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; margin-bottom:12px;">
          <div class="form-group" style="margin:0;">
            <label>Date From</label>
            <input type="date" value="${esc(_reportState.dateFrom)}" onchange="_reportState.dateFrom=this.value; renderReportsView()">
          </div>
          <div class="form-group" style="margin:0;">
            <label>Date To</label>
            <input type="date" value="${esc(_reportState.dateTo)}" onchange="_reportState.dateTo=this.value; renderReportsView()">
          </div>
          <div class="form-group" style="margin:0;">
            <label>Search / Filter</label>
            <input placeholder="Keyword..." value="${esc(_reportState.search)}" oninput="_reportState.search=this.value; renderReportsView()">
          </div>
          <div class="form-group" style="margin:0;">
            <label>Group By (Calculations)</label>
            <select onchange="_reportState.groupBy=this.value; renderReportsView()">
              <option value="">-- Detailed Rows (No Grouping) --</option>
              ${allCols.map(c => `<option value="${esc(c)}" ${_reportState.groupBy === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
            </select>
          </div>
          ${_reportState.groupBy ? `
            <div class="form-group" style="margin:0;">
              <label>Calculation</label>
              <select onchange="_reportState.calcType=this.value; renderReportsView()">
                ${['SUM', 'AVG', 'MIN', 'MAX'].map(fn => `<option ${fn === _reportState.calcType ? 'selected' : ''}>${fn}</option>`).join('')}
              </select>
            </div>
          ` : ''}
        </div>

        ${allCols.length ? `
          <div>
            <label style="font-size:12px; font-weight:600; color:var(--muted); display:block; margin-bottom:6px;">Columns to Include:</label>
            <div style="display:flex; flex-wrap:wrap; gap:10px;">
              ${allCols.map(c => `
                <label style="display:inline-flex; align-items:center; gap:5px; font-size:12px; cursor:pointer;">
                  <input type="checkbox" style="width:auto;" ${_reportState.selectedCols.includes(c) ? 'checked' : ''} onchange="toggleReportCol('${esc(c)}', this.checked)">
                  ${esc(c)}
                </label>
              `).join('')}
            </div>
          </div>
        ` : ''}
      </div>

      <div class="card">
        <div class="section-header">
          <div>
            <h3>Report Output (${outRows.length} rows)</h3>
            <div style="font-size:12px; color:var(--muted);">Source: ${esc(_reportState.source === 'UploadedFile' ? _reportState.uploadedName : _reportState.source)}</div>
          </div>
          <div class="section-actions no-print">
            <button class="btn btn-sm btn-secondary" onclick="exportReportCsv()">⬇ Export CSV</button>
            <button class="btn btn-sm btn-secondary" onclick="exportReportExcel()">⬇ Export Excel</button>
            <button class="btn btn-sm btn-secondary" onclick="exportElementPdf('.table-wrap', 'Report_${esc(_reportState.source || 'Output')}', 'landscape')">📄 Download PDF</button>
            <button class="btn btn-sm btn-secondary" onclick="saveCurrentReportToDrive()">☁ Save to Drive</button>
            <button class="btn btn-sm btn-primary" onclick="window.print()">🖨 Print</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>${outCols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
            <tbody>
              ${outRows.map(r => `
                <tr>${outCols.map(c => `<td>${esc(r[c])}</td>`).join('')}</tr>
              `).join('') || '<tr><td colspan="' + (outCols.length || 1) + '" style="color:var(--muted)">No matching records.</td></tr>'}
            </tbody>
            ${outRows.length ? `
              <tfoot>
                <tr style="background:#f1f5f9; font-weight:700;">
                  ${outCols.map(c => `<td>${esc(totals[c])}</td>`).join('')}
                </tr>
              </tfoot>
            ` : ''}
          </table>
        </div>
      </div>
    `;
  }

  function changeReportSource(src) {
    _reportState.source = src;
    _reportState.selectedCols = [];
    _reportState.groupBy = '';
    renderReportsView();
  }

  function toggleReportCol(col, checked) {
    if (checked && !_reportState.selectedCols.includes(col)) {
      _reportState.selectedCols.push(col);
    } else if (!checked) {
      _reportState.selectedCols = _reportState.selectedCols.filter(c => c !== col);
    }
    renderReportsView();
  }

  function handleReportFileUpload(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        if (typeof XLSX !== 'undefined') {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          _reportState.uploadedRows = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
        } else {
          const text = new TextDecoder().decode(e.target.result);
          const lines = text.split(/\r?\n/).filter(l => l.trim());
          const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
          _reportState.uploadedRows = lines.slice(1).map(l => {
            const cols = l.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            const obj = {};
            headers.forEach((h, i) => { obj[h] = cols[i] || ''; });
            return obj;
          });
        }
        _reportState.uploadedName = file.name;
        _reportState.source = 'UploadedFile';
        _reportState.selectedCols = [];
        _reportState.groupBy = '';
        showToast('File loaded for reporting: ' + file.name);
        renderReportsView();
      } catch (err) {
        showToast('Error reading file: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  async function saveCurrentReport() {
    const name = prompt('Enter a name for this custom report:');
    if (!name) return;
    await gas('saveCustomReport', {
      Name: name,
      Source: _reportState.source,
      ConfigJson: JSON.stringify({
        selectedCols: _reportState.selectedCols,
        dateFrom: _reportState.dateFrom,
        dateTo: _reportState.dateTo,
        search: _reportState.search,
        groupBy: _reportState.groupBy,
        calcType: _reportState.calcType
      }),
      CreatedBy: state.user.Name
    });
    showToast('Custom report saved!');
    await refreshData();
  }

  function loadSavedReport(reportId) {
    if (!reportId) return;
    const r = state.data.savedReports.find(x => x.ReportId === reportId);
    if (!r) return;
    try {
      const cfg = JSON.parse(r.ConfigJson || '{}');
      _reportState.source = r.Source || 'Invoices';
      _reportState.selectedCols = cfg.selectedCols || [];
      _reportState.dateFrom = cfg.dateFrom || '';
      _reportState.dateTo = cfg.dateTo || '';
      _reportState.search = cfg.search || '';
      _reportState.groupBy = cfg.groupBy || '';
      _reportState.calcType = cfg.calcType || 'SUM';
      renderReportsView();
    } catch (e) {}
  }

  function buildReportCsv() {
    const cols = _reportState.lastOutputCols;
    const rows = _reportState.lastOutputRows;
    const escCsv = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    return [cols.map(escCsv).join(','), ...rows.map(r => cols.map(c => escCsv(r[c])).join(','))].join('\n');
  }

  function exportReportCsv() {
    const csv = buildReportCsv();
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Report_${_reportState.source}_${state.data.today}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function exportReportExcel() {
    if (typeof XLSX === 'undefined') return exportReportCsv();
    const ws = XLSX.utils.json_to_sheet(_reportState.lastOutputRows, { header: _reportState.lastOutputCols });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Report');
    XLSX.writeFile(wb, `Report_${_reportState.source}_${state.data.today}.xlsx`);
  }

  async function saveCurrentReportToDrive() {
    const filename = `Report_${_reportState.source}_${state.data.today}.csv`;
    const res = await gas('saveReportToDrive', filename, buildReportCsv());
    showToast('Saved to Google Drive: ' + res.name);
  }

  /* ==========================================================================
   * 8. Import Excel / CSV Data
   * ======================================================================== */

  const IMPORT_SCHEMAS = {
    Inventory: ['SKU', 'Name', 'Category', 'UnitPrice', 'StockQty', 'ReorderLevel', 'Unit'],
    Customers: ['Name', 'Company', 'Phone', 'Email', 'Address', 'Notes'],
    Employees: ['Name', 'Address', 'NIC', 'DOB', 'Gender', 'Position', 'Email', 'Phone', 'EmergencyContactName', 'EmergencyContactPhone', 'JoinDate', 'Status'],
    Transactions: ['Date', 'Type', 'Category', 'Description', 'Amount', 'RecordedBy'],
    Invoices: ['InvoiceNo', 'CustomerName', 'Date', 'DueDate', 'Status', 'Subtotal', 'TaxAmount', 'Total', 'Notes'],
    Attendance: ['UserName', 'Date', 'ClockIn', 'ClockOut', 'Status', 'Notes'],
    Tasks: ['Title', 'Project', 'AssigneeName', 'DueDate', 'Priority', 'Status', 'Notes']
  };

  const _importState = {
    table: 'Inventory',
    workbook: null,
    sheetNames: [],
    selectedSheet: '',
    headers: [],
    rawRows: [],
    mapping: {}
  };

  function renderImportView() {
    const tableOpts = Object.keys(IMPORT_SCHEMAS).map(t =>
      `<option value="${t}" ${_importState.table === t ? 'selected' : ''}>${t}</option>`
    ).join('');

    const hasRows = _importState.rawRows.length > 0;
    const fields = IMPORT_SCHEMAS[_importState.table];

    document.getElementById('mainContent').innerHTML = `
      <div class="card" style="margin-bottom:16px;">
        <div class="section-header">
          <div>
            <h3>Import Manual Excel / CSV Files</h3>
            <p style="font-size:12px; color:var(--muted);">Upload your existing .xlsx, .xls, or .csv files, map columns, and import directly into Google Sheets.</p>
          </div>
          <button class="btn btn-sm btn-secondary" onclick="downloadImportTemplate()">⬇ Download Sample CSV</button>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>1. Select Target Module</label>
            <select id="impTable" onchange="changeImportTable(this.value)">${tableOpts}</select>
          </div>
          <div class="form-group">
            <label>2. Choose Excel / CSV File (.xlsx, .xls, .csv)</label>
            <input type="file" id="impFile" accept=".xlsx,.xls,.csv" onchange="handleImportFile(this.files[0])">
          </div>
        </div>

        ${_importState.sheetNames.length > 1 ? `
          <div class="form-group">
            <label>Select Excel Sheet Tab</label>
            <select onchange="loadExcelSheet(this.value)">
              ${_importState.sheetNames.map(s => `<option value="${esc(s)}" ${s === _importState.selectedSheet ? 'selected' : ''}>${esc(s)}</option>`).join('')}
            </select>
          </div>
        ` : ''}
      </div>

      ${hasRows ? `
        <div class="card" style="margin-bottom:16px;">
          <div class="section-header">
            <h3>3. Match Columns (${_importState.rawRows.length} rows detected)</h3>
            <button class="btn btn-primary" onclick="executeImport()">📥 Import ${_importState.rawRows.length} Rows to ${esc(_importState.table)}</button>
          </div>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px;">
            ${fields.map(f => `
              <div class="form-group" style="margin-bottom:0;">
                <label>${esc(f)}</label>
                <select onchange="_importState.mapping['${esc(f)}']=this.value">
                  <option value="">-- Skip / Leave Blank --</option>
                  ${_importState.headers.map(h => `<option value="${esc(h)}" ${_importState.mapping[f] === h ? 'selected' : ''}>${esc(h)}</option>`).join('')}
                </select>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="card">
          <h3 style="margin-bottom:10px;">Preview (First 5 Rows)</h3>
          <div class="table-wrap">
            <table>
              <thead><tr>${_importState.headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
              <tbody>
                ${_importState.rawRows.slice(0, 5).map(r => `
                  <tr>${_importState.headers.map(h => `<td>${esc(r[h])}</td>`).join('')}</tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      ` : ''}
    `;
  }

  function changeImportTable(tbl) {
    _importState.table = tbl;
    autoMapColumns();
    renderImportView();
  }

  function handleImportFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        if (typeof XLSX !== 'undefined') {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
          _importState.workbook = wb;
          _importState.sheetNames = wb.SheetNames;
          loadExcelSheet(wb.SheetNames[0]);
        } else {
          // Offline fallback for CSV only
          const text = new TextDecoder().decode(e.target.result);
          const lines = text.split(/\r?\n/).filter(l => l.trim());
          const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
          const rows = lines.slice(1).map(l => {
            const cols = l.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            const obj = {};
            headers.forEach((h, i) => { obj[h] = cols[i] || ''; });
            return obj;
          });
          _importState.workbook = null;
          _importState.sheetNames = [];
          _importState.headers = headers;
          _importState.rawRows = rows;
          autoMapColumns();
          renderImportView();
        }
      } catch (err) {
        showToast('Could not read file: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function loadExcelSheet(sheetName) {
    _importState.selectedSheet = sheetName;
    const sheet = _importState.workbook.Sheets[sheetName];
    const json = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
    _importState.rawRows = json;
    _importState.headers = json.length ? Object.keys(json[0]) : [];
    autoMapColumns();
    renderImportView();
  }

  function autoMapColumns() {
    const fields = IMPORT_SCHEMAS[_importState.table];
    const map = {};
    fields.forEach(f => {
      const fl = f.toLowerCase();
      const match = _importState.headers.find(h => {
        const hl = h.toLowerCase().replace(/[^a-z0-9]/g, '');
        return hl === fl || hl.includes(fl) || fl.includes(hl);
      });
      map[f] = match || '';
    });
    _importState.mapping = map;
  }

  async function executeImport() {
    const fields = IMPORT_SCHEMAS[_importState.table];
    const mapped = _importState.rawRows.map(r => {
      const obj = {};
      fields.forEach(f => {
        const src = _importState.mapping[f];
        obj[f] = src ? r[src] : '';
      });
      return obj;
    });

    const res = await gas('importRecords', _importState.table, mapped);
    showToast(`Successfully imported ${res.imported} rows into ${_importState.table}!`);
    _importState.rawRows = [];
    _importState.headers = [];
    _importState.sheetNames = [];
    await refreshData();
  }

  function downloadImportTemplate() {
    const fields = IMPORT_SCHEMAS[_importState.table];
    const csv = fields.join(',') + '\n';
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = _importState.table + '_Template.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  /* ==========================================================================
   * Table Search Helper
   * ======================================================================== */

  function filterTable(tableId, query) {
    const q = query.toLowerCase();
    const rows = document.querySelectorAll('#' + tableId + ' tbody tr');
    rows.forEach(tr => {
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  }
</script>
