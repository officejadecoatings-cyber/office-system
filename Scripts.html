<script>
  const state = {
    user: null,
    view: 'dashboard',
    invTab: 'invoices',
    outTab: 'debtors',
    empTab: 'directory',
    attTab: 'attendance',
    data: {
      settings: {},
      users: [],
      customers: [],
      inventory: [],
      invoices: [],
      invoiceItems: [],
      creditors: [],
      pettyCash: [],
      callReports: [],
      projectReports: [],
      painterQuotations: [],
      painterBillBalances: [],
      employees: [],
      customTabs: [],
      customTabRows: [],
      transactions: [],
      attendance: [],
      leaves: [],
      tasks: [],
      savedReports: [],
      companyProfiles: [],
      quotations: [],
      today: ''
    }
  };

  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxbtdlTd49UX0xd9WCu6gDao16cyHWZZld0bd-mx9LA9kYEc-LyqJc0Knuv1KtxuwfOnA/exec';
  const CACHE_KEY_DATA = 'JADE_OFFICE_DATA_CACHE';
  const CACHE_KEY_USER = 'JADE_OFFICE_USER_CACHE';

  /* ==========================================================================
   * Tab Access Control (Role & User-based visibility)
   * - "Rashini Fernando": sees ONLY 3 tabs (Call Report, Project Report, Petty Cash). All other tabs hidden.
   * - "Shihani Nuwanthi": sees Call Report, Project Report, Petty Cash PLUS standard tabs.
   * - Other users (Admin, Staff, etc.): Call Report, Project Report, and Petty Cash are hidden.
   * ======================================================================== */

  function isRashiniFernando() {
    if (!state.user || !state.user.Name) return false;
    const norm = state.user.Name.toLowerCase().replace(/\s+/g, ' ').trim();
    return norm === 'rashini fernando';
  }

  function isShihaniNuwanthi() {
    if (!state.user || !state.user.Name) return false;
    const norm = state.user.Name.toLowerCase().replace(/\s+/g, ' ').trim();
    return norm === 'shihani nuwanthi';
  }

  function isRestrictedReportUser() {
    return isShihaniNuwanthi() || isRashiniFernando();
  }

  function updateRestrictedTabsVisibility() {
    const isRashini = isRashiniFernando();
    const isShihani = isShihaniNuwanthi();
    const canSeeReports = isShihani || isRashini;
    const reportViews = ['callReport', 'projectReport', 'pettyCash'];

    // 1. Configure the 3 report tabs (callReport, projectReport, pettyCash)
    reportViews.forEach(v => {
      const btn = document.querySelector(`.sidebar-nav [data-view="${v}"]`);
      if (btn) {
        btn.style.display = canSeeReports ? '' : 'none';
      }
    });

    // 2. Configure all other sidebar nav items (Dashboard, Invoices, Outstanding, Stock, Customers, Employees, Painter Training, Reports, Import, Settings)
    const otherNavItems = document.querySelectorAll('.sidebar-nav .nav-item:not([data-view="callReport"]):not([data-view="projectReport"]):not([data-view="pettyCash"])');
    otherNavItems.forEach(el => {
      el.style.display = isRashini ? 'none' : '';
    });

    // Dividers and custom sidebar tabs
    const navDividers = document.querySelectorAll('.sidebar-nav .nav-divider');
    navDividers.forEach(el => {
      el.style.display = isRashini ? 'none' : '';
    });
    const customTabsEl = document.getElementById('customSidebarTabs');
    if (customTabsEl) {
      customTabsEl.style.display = isRashini ? 'none' : '';
    }

    // 3. View guarding and active view selection
    if (isRashini) {
      if (!reportViews.includes(state.view)) {
        state.view = 'callReport';
        document.querySelectorAll('.nav-item').forEach(b => {
          b.classList.toggle('active', b.dataset.view === 'callReport');
        });
        renderView();
      }
    } else if (!canSeeReports && reportViews.includes(state.view)) {
      state.view = 'dashboard';
      document.querySelectorAll('.nav-item').forEach(b => {
        b.classList.toggle('active', b.dataset.view === 'dashboard');
      });
      renderView();
    }
  }

  /* ==========================================================================
   * Utilities & GAS Bridge
   * ======================================================================== */

  function gas(fnName, ...args) {
    document.getElementById('loadingBar').classList.remove('hidden');
    return new Promise((resolve, reject) => {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(res => {
            document.getElementById('loadingBar').classList.add('hidden');
            resolve(res);
          })
          .withFailureHandler(err => {
            document.getElementById('loadingBar').classList.add('hidden');
            const msg = err && err.message ? err.message : String(err);
            showToast('Error: ' + msg);
            reject(err);
          })[fnName](...args);
      } else {
        // Fallback for standalone / GitHub Pages / local: call Google Apps Script Web App via fetch POST
        fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: fnName, args: args })
        })
        .then(r => r.json())
        .then(res => {
          document.getElementById('loadingBar').classList.add('hidden');
          if (res && res.ok) {
            resolve(res.result !== undefined ? res.result : res.data);
          } else {
            const err = new Error(res && res.error ? res.error : 'Unknown backend error');
            showToast('Error: ' + err.message);
            reject(err);
          }
        })
        .catch(err => {
          document.getElementById('loadingBar').classList.add('hidden');
          showToast('Network error: ' + err.message);
          reject(err);
        });
      }
    });
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
  }

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtMoney(num) {
    const cur = state.data.settings.Currency || 'LKR';
    const val = Number(num || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return cur + ' ' + val;
  }

  function toggleSidebar(open) {
    document.getElementById('sidebar').classList.toggle('open', open);
  }

  function openModal(title, bodyHtml, footerHtml, large = false) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modalFooter').innerHTML = footerHtml || '';
    document.getElementById('modalBox').classList.toggle('modal-lg', large);
    document.getElementById('modalBackdrop').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.add('hidden');
  }

  /* ==========================================================================
   * PDF Export Helper
   * ======================================================================== */

  function exportElementPdf(elementIdOrSelector, filename = 'document.pdf', orientation = 'auto') {
    const el = typeof elementIdOrSelector === 'string'
      ? (document.getElementById(elementIdOrSelector) || document.querySelector(elementIdOrSelector))
      : elementIdOrSelector;
    if (!el) {
      showToast('Could not find element to export to PDF');
      window.print();
      return;
    }

    if (typeof html2pdf !== 'undefined') {
      showToast('Generating PDF...');
      const width = el.offsetWidth || 800;
      const orient = orientation === 'auto' ? (width > 760 ? 'landscape' : 'portrait') : orientation;
      const opt = {
        margin: [6, 6, 6, 6],
        filename: filename.endsWith('.pdf') ? filename : (filename + '.pdf'),
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, logging: false },
        jsPDF: { unit: 'mm', format: 'a4', orientation: orient }
      };

      html2pdf().set(opt).from(el).save()
        .then(() => {
          showToast('PDF downloaded successfully!');
        })
        .catch(err => {
          console.warn('html2pdf fallback to print:', err);
          window.print();
        });
    } else {
      window.print();
    }
  }

  function printCleanDocument(selector) {
    const el = typeof selector === 'string' ? document.querySelector(selector) : selector;
    if (!el) {
      window.print();
      return;
    }

    let iframe = document.getElementById('_cleanPrintIframe');
    if (iframe) iframe.remove();

    iframe = document.createElement('iframe');
    iframe.id = '_cleanPrintIframe';
    iframe.style.position = 'fixed';
    iframe.style.top = '-9999px';
    iframe.style.left = '-9999px';
    iframe.style.width = '0';
    iframe.style.height = '0';
    iframe.style.border = 'none';
    document.body.appendChild(iframe);

    const doc = iframe.contentWindow.document;
    doc.open();
    doc.write(`
      <!DOCTYPE html>
      <html>
        <head>
          <title></title>
          <style>
            @page {
              size: A4 portrait;
              margin: 8mm 10mm;
            }
            * {
              box-sizing: border-box;
              -webkit-print-color-adjust: exact !important;
              print-color-adjust: exact !important;
            }
            html, body {
              margin: 0;
              padding: 0;
              background: #fff;
              color: #000;
              font-family: 'Segoe UI', Arial, sans-serif;
            }
          </style>
        </head>
        <body>
          ${el.outerHTML}
        </body>
      </html>
    `);
    doc.close();

    setTimeout(() => {
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    }, 250);
  }

  /* ==========================================================================
   * Mandatory PIN/Password Verification for Any Deletion
   * ======================================================================== */

  function verifyPinAndExecute(actionTitle, onConfirmed) {
    const modalHtml = `
      <div style="padding:4px 0;">
        <div style="color:var(--danger); font-size:14px; font-weight:700; margin-bottom:10px;">
          ⚠️ Security Check: PIN Verification Required
        </div>
        <p style="margin-bottom:14px; font-size:13px; color:var(--text);">
          To <b>${esc(actionTitle)}</b>, please enter your login PIN / Password below to confirm:
        </p>
        <div class="form-group" style="margin-bottom:8px;">
          <label style="font-weight:700;">Your Login PIN / Password *</label>
          <input type="password" id="deleteConfirmPin" placeholder="Enter your PIN..." style="font-size:16px; letter-spacing:3px; max-width:280px;" autocomplete="off" autofocus>
        </div>
        <div id="deleteConfirmError" style="color:var(--danger); font-size:12px; font-weight:700; min-height:18px;"></div>
      </div>
    `;

    openModal(
      'Confirm Deletion',
      modalHtml,
      `
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger" id="deleteConfirmSubmitBtn">Verify &amp; Delete</button>
      `
    );

    setTimeout(() => {
      const inp = document.getElementById('deleteConfirmPin');
      if (inp) {
        inp.focus();
        inp.onkeydown = (e) => {
          if (e.key === 'Enter') document.getElementById('deleteConfirmSubmitBtn')?.click();
        };
      }
    }, 120);

    document.getElementById('deleteConfirmSubmitBtn').onclick = async () => {
      const pin = document.getElementById('deleteConfirmPin')?.value.trim();
      const errEl = document.getElementById('deleteConfirmError');
      const btn = document.getElementById('deleteConfirmSubmitBtn');
      if (!pin) {
        if (errEl) errEl.textContent = 'Please enter your login PIN/Password.';
        return;
      }

      const currentUserId = state.user?.UserId;
      if (!currentUserId) {
        if (errEl) errEl.textContent = 'Session error. Please log in again.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Verifying PIN...';
      if (errEl) errEl.textContent = '';

      try {
        await gas('authenticateUser', currentUserId, pin);
        closeModal();
        showToast('PIN verified. Processing deletion...');
        await onConfirmed();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Verify & Delete';
        if (errEl) errEl.textContent = 'Incorrect PIN / Password. Deletion cancelled.';
      }
    };
  }

  /* ==========================================================================
   * Auth & Init
   * ======================================================================== */

  window.addEventListener('DOMContentLoaded', async () => {
    // 1. Instant cache load from localStorage (0ms load time!)
    try {
      const cachedUserStr = localStorage.getItem(CACHE_KEY_USER);
      const cachedDataStr = localStorage.getItem(CACHE_KEY_DATA);
      if (cachedUserStr && cachedDataStr) {
        const cachedUser = JSON.parse(cachedUserStr);
        const cachedData = JSON.parse(cachedDataStr);
        if (cachedUser && cachedData && cachedData.settings) {
          state.user = cachedUser;
          state.data = cachedData;
        ensureDataDefaults();
          document.getElementById('loginView').classList.add('hidden');
          document.getElementById('appShell').classList.remove('hidden');
          document.getElementById('sidebarUser').textContent = cachedUser.Name || 'User';
          document.getElementById('sidebarRole').textContent = cachedUser.Role || 'Staff';
          document.getElementById('brandName').textContent = cachedData.settings.CompanyName || 'Jade Coatings';
          renderCustomSidebarTabs();
          updateRestrictedTabsVisibility();
          renderTopbarClock();
          renderView();
          startAutoSync();
          // Silently refresh fresh data from backend in background without freezing
          refreshData(false, /* silent */ true);
          return;
        }
      }
    } catch (e) {
      console.warn('Cache load error:', e);
    }

    // 2. If not logged in from cache, fetch login users
    try {
      const users = await gas('getLoginUsers');
      const sel = document.getElementById('loginUser');
      if (sel && users && users.length) {
        sel.innerHTML = users.map(u => `<option value="${esc(u.UserId)}">${esc(u.Name)} (${esc(u.Role)})</option>`).join('');
      }
    } catch (e) {}

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const userId = document.getElementById('loginUser').value;
      const pin = document.getElementById('loginPin').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const origText = submitBtn ? submitBtn.textContent : '';
      if (submitBtn) { submitBtn.textContent = 'Logging in...'; submitBtn.disabled = true; }

      try {
        const res = await gas('authenticateUser', userId, pin);
        state.user = res.user || res;
        try { localStorage.setItem(CACHE_KEY_USER, JSON.stringify(state.user)); } catch (e) {}

        if (res.data) {
          state.data = res.data;
          try { localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(state.data)); } catch (e) {}
          document.getElementById('brandName').textContent = state.data.settings?.CompanyName || 'Jade Coatings';
          renderCustomSidebarTabs();
          renderTopbarClock();
          renderView();
        } else {
          await refreshData();
        }

        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('appShell').classList.remove('hidden');
        document.getElementById('sidebarUser').textContent = state.user.Name;
        document.getElementById('sidebarRole').textContent = state.user.Role;
        updateRestrictedTabsVisibility();
        startAutoSync();
      } catch (err) {
        showToast('Login failed: ' + (err.message || 'Invalid PIN'));
      } finally {
        if (submitBtn) { submitBtn.textContent = origText; submitBtn.disabled = false; }
      }
    });
  });

  function logout() {
    state.user = null;
    try { localStorage.removeItem(CACHE_KEY_USER); } catch (e) {}
    document.getElementById('loginPin').value = '';
    document.getElementById('appShell').classList.add('hidden');
    document.getElementById('loginView').classList.remove('hidden');
    updateRestrictedTabsVisibility();
  }

  async function refreshData(backupToDrive = false, silent = false) {
    if (backupToDrive) {
      try { await gas('autoSyncDriveBackup'); } catch (e) {}
    }
    try {
      const data = await gas('getAppData');
      state.data = data;
      ensureDataDefaults();
      try { localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(data)); } catch (e) {}
      if (data.settings) {
        document.getElementById('brandName').textContent = data.settings.CompanyName || 'Jade Coatings';
      }
      renderCustomSidebarTabs();
      updateRestrictedTabsVisibility();
      renderTopbarClock();
      renderView();
      if (backupToDrive) showToast('Synced with Google Drive!');
    } catch (e) {
      if (!silent) showToast('Error refreshing data: ' + e.message);
    }
  }

  function renderCustomSidebarTabs() {
    const el = document.getElementById('customSidebarTabs');
    if (!el) return;
    if (isRashiniFernando()) {
      el.innerHTML = '';
      el.style.display = 'none';
      return;
    }
    el.style.display = '';
    el.innerHTML = (state.data.customTabs || []).map(t => `
      <button class="nav-item ${state.view === 'customTab:' + t.TabId ? 'active' : ''}" data-view="customTab:${esc(t.TabId)}" onclick="navigate('customTab:${esc(t.TabId)}')">
        ${esc(t.Icon || '📋')} ${esc(t.Name)}
      </button>
    `).join('');
  }

  let _syncSecondsLeft = 300;
  function startAutoSync() {
    clearInterval(window._autoSyncTimer);
    _syncSecondsLeft = 300;
    window._autoSyncTimer = setInterval(async () => {
      _syncSecondsLeft--;
      if (_syncSecondsLeft <= 0) {
        _syncSecondsLeft = 300;
        if (state.user) {
          await refreshData(true);
        }
      }
      const m = Math.floor(_syncSecondsLeft / 60);
      const s = String(_syncSecondsLeft % 60).padStart(2, '0');
      const badge = document.getElementById('autoSyncBadge');
      if (badge) badge.textContent = `Auto-Sync: ${m}:${s}`;
    }, 1000);
  }

  function navigate(view) {
    const reportViews = ['callReport', 'projectReport', 'pettyCash'];

    if (isRashiniFernando() && !reportViews.includes(view)) {
      showToast('Access restricted: You only have access to Call Report, Project Report, and Petty Cash.');
      state.view = 'callReport';
      document.querySelectorAll('.nav-item').forEach(b => {
        b.classList.toggle('active', b.dataset.view === 'callReport');
      });
      renderView();
      return;
    }

    if (!isRestrictedReportUser() && reportViews.includes(view)) {
      showToast('Access restricted: Only Shihani Nuwanthi and Rashini Fernando can view this tab.');
      state.view = 'dashboard';
      document.querySelectorAll('.nav-item').forEach(b => {
        b.classList.toggle('active', b.dataset.view === 'dashboard');
      });
      renderView();
      return;
    }
    state.view = view;
    document.querySelectorAll('.nav-item').forEach(b => {
      b.classList.toggle('active', b.dataset.view === view);
    });
    toggleSidebar(false);
    renderView();
  }

  function renderTopbarClock() {
    const todayAtt = state.data.attendance.find(a => a.UserId === state.user.UserId && a.Date === state.data.today);
    const el = document.getElementById('clockActionArea');
    if (!todayAtt) {
      el.innerHTML = `<button class="btn btn-sm btn-success" onclick="handleClockIn()">Clock In</button>`;
    } else if (!todayAtt.ClockOut) {
      el.innerHTML = `<button class="btn btn-sm btn-danger" onclick="handleClockOut()">Clock Out (${esc(todayAtt.ClockIn)})</button>`;
    } else {
      el.innerHTML = `<span class="badge badge-success">Done ${esc(todayAtt.ClockIn)} - ${esc(todayAtt.ClockOut)}</span>`;
    }
  }

  async function handleClockIn() {
    await gas('clockInUser', state.user.UserId, state.user.Name);
    showToast('Clocked in!');
    await refreshData();
  }

  async function handleClockOut() {
    await gas('clockOutUser', state.user.UserId);
    showToast('Clocked out!');
    await refreshData();
  }

  function renderView() {
    const reportViews = ['callReport', 'projectReport', 'pettyCash'];
    if (isRashiniFernando() && !reportViews.includes(state.view)) {
      state.view = 'callReport';
    } else if (!isRestrictedReportUser() && reportViews.includes(state.view)) {
      state.view = 'dashboard';
    }

    if (state.view.startsWith('customTab:')) {
      const tabId = state.view.split(':')[1];
      const tab = (state.data.customTabs || []).find(t => t.TabId === tabId);
      document.getElementById('pageTitle').textContent = tab ? tab.Name : 'Custom Tab';
      renderCustomTabView(tabId);
      return;
    }

    const titles = {
      dashboard: 'Dashboard',
      invoices: 'Sales Invoices',
      quotation: 'Quotation',
      companyProfile: 'Company Profile',
      outstanding: 'Outstanding (Debtors & Creditors)',
      callReport: 'Call Report',
      projectReport: 'Project Report',
      pettyCash: 'Petty Cash Book',
      customers: 'Customers',
      employees: 'Employees, Attendance & Leave',
      painterTraining: 'Painter Training',
      inventory: 'Stock Management',
      tasks: 'Tasks & Projects',
      reports: 'Custom Reports & Analytics',
      import: 'Import Excel / CSV Data',
      settings: 'Settings & Customize System'
    };
    document.getElementById('pageTitle').textContent = titles[state.view] || 'Office System';

    const handlers = {
      dashboard: renderDashboard,
      invoices: renderInvoicesView,
      quotation: renderQuotationView,
      companyProfile: renderCompanyProfileView,
      outstanding: renderOutstandingView,
      callReport: renderCallReportsView,
      projectReport: renderProjectReportsView,
      pettyCash: renderPettyCashView,
      customers: renderCustomersView,
      employees: renderEmployeesView,
      painterTraining: renderPainterTrainingView,
      inventory: renderInventoryView,
      tasks: renderTasksView,
      reports: renderReportsView,
      import: renderImportView,
      settings: renderSettingsView
    };
    (handlers[state.view] || renderDashboard)();
  }

  function daysBetween(dateStr, refDateStr) {
    if (!dateStr) return 0;
    const d1 = new Date(dateStr);
    const d2 = new Date(refDateStr || state.data.today || new Date().toISOString().slice(0, 10));
    if (isNaN(d1) || isNaN(d2)) return 0;
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
  }

  function getCustomerOverdueInfo(customerId) {
    if (!customerId) return { blocked: false, maxDays: 0, balance: 0, overdueInvoices: [], overdueBalance: 0 };
    const unpaid = (state.data.invoices || []).filter(i =>
      i.CustomerId === customerId &&
      i.Status !== 'Paid' && i.Status !== 'Cancelled' && i.Status !== 'Draft' && i.Status !== 'Free Issue' &&
      (Number(i.Total || 0) - Number(i.PaidAmount || 0)) > 0
    );
    let maxDays = 0;
    let balance = 0;
    let overdueBalance = 0;
    const overdueInvoices = [];

    unpaid.forEach(i => {
      const bal = Number(i.Total || 0) - Number(i.PaidAmount || 0);
      balance += bal;
      const d = daysBetween(i.DueDate || i.Date, state.data.today);
      if (d > 0) {
        overdueBalance += bal;
        overdueInvoices.push({
          invoiceNo: i.InvoiceNo || 'INV',
          dueDate: i.DueDate || i.Date,
          daysOverdue: d,
          balance: bal
        });
      }
      if (d > maxDays) maxDays = d;
    });

    // Block customer from new invoices if payment was not made before the due date (d > 0)
    const blocked = overdueInvoices.length > 0;
    return { blocked, maxDays, balance, overdueBalance, overdueInvoices };
  }

  /* ==========================================================================
   * 1. Dashboard
   * ======================================================================== */

  function renderDashboard() {
    const { invoices, transactions, inventory, tasks, attendance, today } = state.data;
    const totalIncome = transactions.filter(t => t.Type === 'Income').reduce((s, t) => s + Number(t.Amount || 0), 0);
    const totalExpense = transactions.filter(t => t.Type === 'Expense').reduce((s, t) => s + Number(t.Amount || 0), 0);
    const pendingInv = invoices.filter(i => i.Status === 'Pending');
    const pendingSum = pendingInv.reduce((s, i) => s + Number(i.Total || 0), 0);
    const lowStock = inventory.filter(i => Number(i.StockQty) <= Number(i.ReorderLevel));
    const openTasks = tasks.filter(t => t.Status !== 'Done');
    const todayAtt = attendance.filter(a => a.Date === today);

    document.getElementById('mainContent').innerHTML = `
      <div class="kpi-grid">
        <div class="card">
          <div class="kpi-label">Net Balance</div>
          <div class="kpi-val">${fmtMoney(totalIncome - totalExpense)}</div>
          <div class="kpi-sub">Income: ${fmtMoney(totalIncome)}</div>
        </div>
        <div class="card">
          <div class="kpi-label">Pending Invoices</div>
          <div class="kpi-val">${fmtMoney(pendingSum)}</div>
          <div class="kpi-sub">${pendingInv.length} unpaid invoice(s)</div>
        </div>
        <div class="card">
          <div class="kpi-label">Low Stock Alerts</div>
          <div class="kpi-val" style="color:${lowStock.length ? 'var(--danger)' : 'var(--success)'}">${lowStock.length}</div>
          <div class="kpi-sub">${inventory.length} total items tracked</div>
        </div>
        <div class="card">

  function numberToWords(num) {
    if (num === 0 || isNaN(num)) return 'Zero Only';
    const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
      'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
    const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

    function toWords(n) {
      if (n === 0) return '';
      if (n < 20) return a[n] + ' ';
      if (n < 100) return b[Math.floor(n / 10)] + (n % 10 ? ' ' + a[n % 10] : '') + ' ';
      if (n < 1000) return a[Math.floor(n / 100)] + ' Hundred ' + toWords(n % 100);
      if (n < 1000000) return toWords(Math.floor(n / 1000)) + 'Thousand ' + toWords(n % 1000);
      if (n < 1000000000) return toWords(Math.floor(n / 1000000)) + 'Million ' + toWords(n % 1000000);
      return toWords(Math.floor(n / 1000000000)) + 'Billion ' + toWords(n % 1000000000);
    }

    const parts = Number(num).toFixed(2).split('.');
    const whole = parseInt(parts[0], 10);
    const cents = parseInt(parts[1], 10);

    let str = toWords(whole).trim();
    if (!str) str = 'Zero';
    if (cents > 0) {
      str += ' and Cents ' + toWords(cents).trim();
    }
    return str + ' Only';
  }

  function fmtInvoiceDate(dStr) {
    if (!dStr) return '';
    const d = new Date(dStr);
    if (isNaN(d)) return dStr;
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const yyyy = d.getFullYear();
    return `${mm}/${dd}/${yyyy}`;
  }

  function getSalesPersonsList() {
    const list = [];
    const added = new Set();

    // 1. Employees with position/designation containing sales/marketing
    (state.data.employees || []).forEach(e => {
      const p = ((e.Position || '') + ' ' + (e.Designation || '')).toLowerCase();
      if (e.Status !== 'Inactive' && (p.includes('sales') || p.includes('rep') || p.includes('marketing') || p.includes('officer'))) {
        if (!added.has(e.Name)) {
          added.add(e.Name);
          list.push({ Name: e.Name, Code: e.EmpCode || e.EmpId || '', Designation: e.Position || e.Designation || 'Sales Officer' });
        }
      }
    });

    // 2. Default well-known sales representatives
    const defaultSalesNames = [
      'Mr. Sunanda', 'Mr. Damith', 'Mr. Nimesh', 'Mr. Yasas',
      'Mr. Shehan', 'Mr. Manjula', 'Mr. Nipun', 'Mr. Pathum'
    ];
    defaultSalesNames.forEach(name => {
      if (!added.has(name)) {
        added.add(name);
        list.push({ Name: name, Code: '', Designation: 'Sales Officer' });
      }
    });

    // 3. Other active employees
    (state.data.employees || []).forEach(e => {
      if (e.Status !== 'Inactive' && !added.has(e.Name)) {
        added.add(e.Name);
        list.push({ Name: e.Name, Code: e.EmpCode || e.EmpId || '', Designation: e.Position || e.Designation || 'Staff' });
      }
    });

    return list;
  }

  function renderInvLines() {
    const invOpts = state.data.inventory.map(it => `<option value="${esc(it.ItemId)}">${esc(it.SKU ? it.SKU + ' - ' : '')}${esc(it.Name)} (${it.StockQty} ${esc(it.Unit)})</option>`).join('');
    document.getElementById('invLinesContainer').innerHTML = _invLines.map((ln, idx) => {
      const lineSub = Number(ln.Qty || 0) * Number(ln.UnitPrice || 0);
      const lineDisc = lineSub * ((Number(ln.DiscountPercent) || 0) / 100);
      const lineTotal = Math.round((lineSub - lineDisc) * 100) / 100;
      ln.LineTotal = lineTotal;
      return `
        <div style="display:grid; grid-template-columns:120px 90px 1.8fr 55px 85px 65px 85px 32px; gap:6px; margin-bottom:6px; align-items:center;">
          <select onchange="pickInvItem(${idx}, this.value)">
            <option value="">-- Custom --</option>
            ${invOpts}
          </select>
          <input placeholder="Code" value="${esc(ln.ItemCode || '')}" oninput="_invLines[${idx}].ItemCode=this.value">
          <input placeholder="Description" value="${esc(ln.ItemName || '')}" oninput="_invLines[${idx}].ItemName=this.value">
          <input type="number" min="1" value="${ln.Qty}" oninput="_invLines[${idx}].Qty=Number(this.value); updateInvTotals()">
          <input type="number" step="0.01" value="${ln.UnitPrice}" oninput="_invLines[${idx}].UnitPrice=Number(this.value); updateInvTotals()">
          <input type="number" step="0.1" min="0" max="100" placeholder="%" value="${ln.DiscountPercent || 0}" oninput="_invLines[${idx}].DiscountPercent=Number(this.value); updateInvTotals()">
          <div style="text-align:right; font-weight:600; font-size:13px; padding-right:4px;" id="invLineTotal_${idx}">${fmtMoney(lineTotal)}</div>
          <button type="button" class="btn btn-sm btn-danger" onclick="_invLines.splice(${idx},1); renderInvLines()">✕</button>
        </div>
      `;
    }).join('');

    const selects = document.querySelectorAll('#invLinesContainer select');
    _invLines.forEach((ln, idx) => { if (selects[idx]) selects[idx].value = ln.ItemId || ''; });
    updateInvTotals();
  }

  function pickInvItem(idx, itemId) {
    const item = state.data.inventory.find(x => x.ItemId === itemId);
    _invLines[idx].ItemId = itemId;
    if (item) {
      _invLines[idx].ItemCode = item.SKU || '';
      _invLines[idx].ItemName = item.Name;
      _invLines[idx].UnitPrice = Number(item.UnitPrice) || 0;
    }
    renderInvLines();
  }

  function addInvLine() {
    _invLines.push({ ItemId: '', ItemCode: '', ItemName: '', Qty: 1, UnitPrice: 0, DiscountPercent: 0, LineTotal: 0 });
    renderInvLines();
  }

  function updateInvTotals() {
    let sub = 0;
    _invLines.forEach((l, idx) => {
      const lineSub = Number(l.Qty || 0) * Number(l.UnitPrice || 0);
      const lineDisc = lineSub * ((Number(l.DiscountPercent) || 0) / 100);
      const lineTotal = Math.round((lineSub - lineDisc) * 100) / 100;
      l.LineTotal = lineTotal;
      sub += lineTotal;
      const ltEl = document.getElementById('invLineTotal_' + idx);
      if (ltEl) ltEl.textContent = fmtMoney(lineTotal);
    });

    const disc = Number(document.getElementById('fInvDisc')?.value || 0);
    const taxable = Math.max(0, sub - disc);
    const taxRate = Number(state.data.settings.TaxRate || 0);
    const tax = taxable * (taxRate / 100);
    const total = taxable + tax;
    const paid = Number(document.getElementById('fInvPaid')?.value || 0);
    const bal = Math.max(0, total - paid);
    const previewEl = document.getElementById('invTotalsPreview');
    if (previewEl) {
      previewEl.innerHTML =
        `Subtotal: <b>${fmtMoney(sub)}</b> | Discount: <b>${fmtMoney(disc)}</b> | Tax (${taxRate}%): <b>${fmtMoney(tax)}</b> | Total: <b>${fmtMoney(total)}</b> | Balance: <b style="color:var(--danger)">${fmtMoney(bal)}</b>`;
    }
    return { sub, disc, tax, total, paid };
  }

  async function submitInvoice(invoiceId) {
    const custId = document.getElementById('fInvCustId')?.value || document.getElementById('fInvCust')?.value || '';
    const custName = document.getElementById('fInvCustInput')?.value || '';
    const spVal = document.getElementById('fInvSPInput')?.value || document.getElementById('fInvSP')?.value || '';
    const status = document.getElementById('fInvStatus').value;
    const info = getCustomerOverdueInfo(custId);

    // Block customer if any unpaid invoice is past the Due Date unless authorized via Login PIN
    if (info.blocked && status !== 'Draft' && status !== 'Cancelled' && status !== 'Free Issue') {
      const pin = document.getElementById('fInvOverridePin')?.value.trim() || '';
      const errEl = document.getElementById('fInvOverridePinError');
      if (!pin) {
        if (errEl) errEl.textContent = 'Login PIN is required to issue invoice for an overdue customer.';
        showToast('Blocked: Customer has unpaid invoices past Due Date. Enter Login PIN to issue!');
        document.getElementById('fInvOverridePin')?.focus();
        return;
      }
      try {
        await gas('authenticateUser', state.user.UserId, pin);
      } catch (e) {
        if (errEl) errEl.textContent = 'Invalid Login PIN / Password. Invoice blocked.';
        showToast('Invalid Login PIN! Override blocked.');
        return;
      }
    }

    const cust = state.data.customers.find(c => c.CustomerId === custId);
    const { sub, disc, tax, total, paid } = updateInvTotals();
    const existing = invoiceId ? state.data.invoices.find(i => i.InvoiceId === invoiceId) : null;
    const finalPaid = status === 'Paid' ? total : (status === 'Free Issue' ? 0 : paid);

    const payload = {
      invoice: {
        InvoiceId: invoiceId || '',
        InvoiceNo: existing ? existing.InvoiceNo : '',
        CompanyId: document.getElementById('fInvCompany')?.value || '',
        CustomerId: custId,
        CustomerName: custName || (cust ? cust.Name : (custId ? 'Customer' : 'Walk-in Customer')),
        CustomerAddress: document.getElementById('fInvCustAddr')?.value || (cust ? (cust.BillingAddress || cust.DeliveryAddress || '') : ''),
        CustomerPhone: document.getElementById('fInvCustPhone')?.value || (cust ? (cust.Phone || '') : ''),
        QuoteNo: document.getElementById('fInvQuote')?.value || '',
        SalesPerson: spVal,
        BankDetails: document.getElementById('fInvBank')?.value || '',
        Date: document.getElementById('fInvDate').value,
        DueDate: document.getElementById('fInvDue').value,
        Status: status,
        Subtotal: sub,
        Discount: disc,
        TaxAmount: tax,
        Total: total,
        PaidAmount: finalPaid,
        Notes: document.getElementById('fInvNotes').value,
        CreatedBy: state.user.Name
      },
      items: _invLines.filter(l => (l.ItemName || '').trim() !== '').map(l => ({
        ItemId: l.ItemId || '',
        ItemCode: l.ItemCode || '',
        ItemName: l.ItemName || '',
        Qty: Number(l.Qty) || 0,
        UnitPrice: Number(l.UnitPrice) || 0,
        DiscountPercent: Number(l.DiscountPercent) || 0,
        LineTotal: Number(l.LineTotal) || 0
      }))
    };

    await gas('saveInvoice', payload);
    closeModal();
    showToast('Sales Invoice saved!');
    await refreshData();
  }

  function handleCompLogoUpload(input) {
    if (input.files && input.files[0]) {
      const file = input.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('fCompLogo').value = e.target.result;
        document.getElementById('compLogoPreview').innerHTML =
          `<img src="${e.target.result}" style="max-height:40px; max-width:120px; object-fit:contain; border:1px solid #e2e8f0; border-radius:4px; padding:2px;">`;
      };
      reader.readAsDataURL(file);
    }
  }

  async function submitCompanyProfile(companyId) {
    const name = document.getElementById('fCompName').value.trim();
    if (!name) {
      showToast('Please enter Company Name');
      return;
    }
    const payload = {
      CompanyId: companyId || '',
      CompanyName: name,
      Address: document.getElementById('fCompAddr').value.trim(),
      Phone: document.getElementById('fCompPhone').value.trim(),
      Email: document.getElementById('fCompEmail').value.trim(),
      Website: document.getElementById('fCompWeb').value.trim(),
      BankName: document.getElementById('fCompBank').value.trim(),
      Branch: document.getElementById('fCompBranch').value.trim(),
      AccountNo: document.getElementById('fCompAcc').value.trim(),
      Logo: document.getElementById('fCompLogo').value.trim(),
      IsDefault: document.getElementById('fCompDefault').value
    };

    await gas('saveCompanyProfile', payload);
    closeModal();
    showToast('Company Profile saved!');
    await refreshData();
  }

  async function setDefaultCompany(companyId) {
    const comp = (state.data.companyProfiles || []).find(c => c.CompanyId === companyId);
    if (!comp) return;
    comp.IsDefault = 'Yes';
    await gas('saveCompanyProfile', comp);
    showToast(`${comp.CompanyName} set as default company!`);
    await refreshData();
  }

    verifyPinAndExecute('delete this company profile', async () => {
      await gas('deleteCompanyProfile', id);
      showToast('Company profile deleted.');
      await refreshData();
    });
  }

  function getNextQuotationNo() {
    const quotes = state.data.quotations || [];
    if (quotes.length === 0) return '754';
    const nums = quotes.map(q => {
      const m = String(q.QuotationNo || '').match(/\d+/);
      return m ? parseInt(m[0], 10) : 0;
    }).filter(n => !isNaN(n) && n > 0);
    const max = nums.length ? Math.max(...nums) : 753;
    return String(max + 1);
  }

        menu.classList.add('hidden');

  function renderQuotCustList(filterText = '') {
    const menu = document.getElementById('quotCustMenu');
    if (!menu) return;
    const lower = filterText.toLowerCase().trim();
    const list = (state.data.customers || []).filter(c => {
      if (!lower) return true;
      const text = `${c.CustomerCode || ''} ${c.Name || ''} ${c.Company || ''} ${c.Phone || ''}`.toLowerCase();
      return text.includes(lower);
    });

    if (list.length === 0) {
      menu.innerHTML = '<div style="padding:10px 12px; font-size:12.5px; color:#94a3b8; text-align:center;">No matching customers found</div>';
      return;
    }

    menu.innerHTML = list.map(c => {
      const codeStr = c.CustomerCode ? `<span style="font-weight:700; color:#0f766e; margin-right:6px;">${esc(c.CustomerCode)}</span>` : '';
      const compStr = c.Company ? ` <span style="color:#64748b; font-size:12px;">(${esc(c.Company)})</span>` : '';
      return `
        <div onclick="selectQuotCust('${esc(c.CustomerId)}')" style="padding:8px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='#fff'">
          <div>${codeStr}<b>${esc(c.Name)}</b>${compStr}</div>
          <div style="font-size:11.5px; color:#94a3b8;">${esc(c.Phone || '')}</div>
        </div>
      `;
    }).join('');
  }

  function openQuotCustList() {
    const menu = document.getElementById('quotCustMenu');
    if (menu) {
      renderQuotCustList(document.getElementById('fQuotCustInput')?.value || '');
      menu.classList.remove('hidden');
    }
  }

  function toggleQuotCustList(e) {
    if (e) e.stopPropagation();
    const menu = document.getElementById('quotCustMenu');
    if (menu) {
      if (menu.classList.contains('hidden')) {
        openQuotCustList();
        document.getElementById('fQuotCustInput')?.focus();
      } else {
        menu.classList.add('hidden');
      }
    }
  }

  function focusQuotCustInput() {
    const input = document.getElementById('fQuotCustInput');
    if (input) {
      input.focus();
      openQuotCustList();
    }
  }

  function filterQuotCustList(val) {
    renderQuotCustList(val);
    const menu = document.getElementById('quotCustMenu');
    if (menu) menu.classList.remove('hidden');
  }

  function selectQuotCust(custId) {
    const cust = (state.data.customers || []).find(c => c.CustomerId === custId);
    if (cust) {
      const inputEl = document.getElementById('fQuotCustInput');
      const idEl = document.getElementById('fQuotCustId');
      const addrEl = document.getElementById('fQuotAddr');
      const displayName = `${cust.CustomerCode ? cust.CustomerCode + ' ' : ''}${cust.Name}`;
      if (inputEl) inputEl.value = displayName;
      if (idEl) idEl.value = cust.CustomerId;
      if (addrEl) {
        const fullAddr = [cust.BillingAddress || cust.DeliveryAddress || '', cust.Phone || ''].filter(Boolean).join('\n');
        addrEl.value = fullAddr;
      }
    }
    const menu = document.getElementById('quotCustMenu');
    if (menu) menu.classList.add('hidden');
  }

  function renderQuotLines() {
    const invOpts = (state.data.inventory || []).map(it => `
      <option value="${esc(it.ItemId)}">${esc(it.SKU ? it.SKU + ' - ' : '')}${esc(it.Name)}</option>
    `).join('');

    const container = document.getElementById('quotLinesContainer');
    if (!container) return;

    container.innerHTML = _quotLines.map((ln, idx) => {
      const lineSub = Number(ln.Qty || 0) * Number(ln.UnitPrice || 0);
      const lineDisc = lineSub * ((Number(ln.Discount) || 0) / 100);
      const lineTotal = Math.round((lineSub - lineDisc) * 100) / 100;
      ln.Amount = lineTotal;

      return `
        <tr style="border-bottom:1px solid #e2e8f0;">
          <td style="color:#94a3b8; font-size:14px; text-align:center; cursor:grab;">↕</td>
          <td style="padding:5px 6px;">
            <select onchange="pickQuotItem(${idx}, this.value)" style="width:100%; padding:5px 6px; font-size:12.5px; border:1px solid #d1d5db; border-radius:4px;">
              <option value="">-- Select Code / Item --</option>
              ${invOpts}
            </select>
          </td>
          <td style="padding:5px 6px;">
            <input placeholder="Product description" value="${esc(ln.Description || '')}" oninput="_quotLines[${idx}].Description=this.value" style="width:100%; padding:5px 6px; font-size:12.5px; border:1px solid #d1d5db; border-radius:4px;">
          </td>
          <td style="padding:5px 6px;">
            <input type="number" min="1" value="${ln.Qty || 1}" oninput="_quotLines[${idx}].Qty=Number(this.value); updateQuotTotals()" style="width:100%; text-align:center; padding:5px 4px; font-size:12.5px; border:1px solid #d1d5db; border-radius:4px;">
          </td>
          <td style="padding:5px 6px;">
            <input type="number" step="0.01" value="${ln.UnitPrice || 0}" oninput="_quotLines[${idx}].UnitPrice=Number(this.value); updateQuotTotals()" style="width:100%; text-align:right; padding:5px 6px; font-size:12.5px; border:1px solid #d1d5db; border-radius:4px;">
          </td>
          <td style="padding:5px 6px;">
            <div style="display:flex; align-items:center; gap:2px;">
              <input type="number" step="0.1" min="0" placeholder="0" value="${ln.Discount || 0}" oninput="_quotLines[${idx}].Discount=Number(this.value); updateQuotTotals()" style="width:65px; text-align:center; padding:5px 4px; font-size:12.5px; border:1px solid #d1d5db; border-radius:4px;">
              <span style="font-size:12px; color:#64748b;">%</span>
            </div>
          </td>
          <td style="padding:5px 6px;">
            <input readonly value="${Number(lineTotal).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}" id="quotLineAmt_${idx}" style="width:100%; text-align:right; font-weight:600; padding:5px 6px; font-size:12.5px; background:#f1f5f9; border:1px solid #cbd5e1; border-radius:4px; color:#1e293b;">
          </td>
          <td style="padding:5px 6px;">
            <select onchange="_quotLines[${idx}].Tax=this.value" style="width:100%; padding:5px 4px; font-size:12px; border:1px solid #d1d5db; border-radius:4px; color:#64748b;">
              <option ${ln.Tax === 'No tax' ? 'selected' : ''}>No tax</option>
              <option ${ln.Tax === '0%' ? 'selected' : ''}>0%</option>
            </select>
          </td>
          <td style="padding:5px 4px; text-align:center;">
            <button type="button" class="btn btn-sm btn-danger" onclick="removeQuotLine(${idx})" style="padding:2px 6px; font-size:12px; line-height:1;">✕</button>
          </td>
        </tr>
      `;
    }).join('');

    const selects = container.querySelectorAll('select');
    _quotLines.forEach((ln, idx) => {
      const sel = selects[idx * 2]; // first select in the row
      if (sel) sel.value = ln.ItemId || '';
    });
  }

  function pickQuotItem(idx, itemId) {
    const item = (state.data.inventory || []).find(x => x.ItemId === itemId);
    _quotLines[idx].ItemId = itemId;
    if (item) {
      _quotLines[idx].ItemCode = item.SKU || '';
      _quotLines[idx].Description = item.Name || '';
      _quotLines[idx].UnitPrice = Number(item.UnitPrice) || 0;
    }
    renderQuotLines();
    updateQuotTotals();
  }

  function addQuotLine() {
    _quotLines.push({ ItemId: '', ItemCode: '', Description: '', Qty: 1, UnitPrice: 0, Discount: 0, Tax: 'No tax', Amount: 0 });
    renderQuotLines();
    updateQuotTotals();
  }

  function removeQuotLine(idx) {
    if (_quotLines.length > 1) {
      _quotLines.splice(idx, 1);
    } else {
      _quotLines[0] = { ItemId: '', ItemCode: '', Description: '', Qty: 1, UnitPrice: 0, Discount: 0, Tax: 'No tax', Amount: 0 };
    }
    renderQuotLines();
    updateQuotTotals();
  }

  function updateQuotTotals() {
    let grand = 0;
    _quotLines.forEach((ln, idx) => {
      const lineSub = Number(ln.Qty || 0) * Number(ln.UnitPrice || 0);
      const lineDisc = lineSub * ((Number(ln.Discount) || 0) / 100);
      const lineTotal = Math.round((lineSub - lineDisc) * 100) / 100;
      ln.Amount = lineTotal;
      grand += lineTotal;
      const amtEl = document.getElementById('quotLineAmt_' + idx);
      if (amtEl) amtEl.value = Number(lineTotal).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    });

    const totalBox = document.getElementById('fQuotTotalBox');
    if (totalBox) {
      totalBox.textContent = Number(grand).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    }
    return grand;
  }

  async function submitQuotation(quotId) {
    const custInput = document.getElementById('fQuotCustInput')?.value.trim() || '';
    const custId = document.getElementById('fQuotCustId')?.value || '';
    const custObj = (state.data.customers || []).find(c => c.CustomerId === custId);

    const custName = custInput || (custObj ? custObj.Name : 'Walk-in Customer');
    const quotNo = document.getElementById('fQuotNo')?.value.trim() || getNextQuotationNo();
    const dateVal = document.getElementById('fQuotDate')?.value || state.data.today;
    const addrVal = document.getElementById('fQuotAddr')?.value.trim() || '';
    const descVal = document.getElementById('fQuotDesc')?.value.trim() || '';
    const companyId = document.getElementById('fQuotCompany')?.value || '';
    const statusVal = document.getElementById('fQuotStatus')?.value || 'Draft';

    const grandTotal = updateQuotTotals();

    const dataJson = JSON.stringify({
      QuotationNo: quotNo,
      CustomerId: custId,
      CustomerName: custName,
      BillingAddress: addrVal,
      Description: descVal,
      CompanyId: companyId,
      Date: dateVal,
      Items: _quotLines.filter(l => (l.Description || '').trim() !== ''),
      DiscountChecked: document.getElementById('chkQuotDisc')?.checked || false,
      DiscountType: document.getElementById('selQuotDiscType')?.value || 'Percentage',
      HideTotal: document.getElementById('chkQuotHideTotal')?.checked || false,
      TaxInclusive: document.getElementById('chkQuotTaxInclusive')?.checked || false,
      RoundOff: document.getElementById('chkQuotRound')?.checked || false,
      CustomTitle: document.getElementById('chkQuotCustomTitle')?.checked || false
    });

    const payload = {
      QuotationId: quotId || '',
      QuotationNo: quotNo,
      Date: dateVal,
      CustomerId: custId,
      CustomerName: custName,
      BillingAddress: addrVal,
      Description: descVal,
      TotalAmount: grandTotal,
      Status: statusVal,
      CompanyId: companyId,
      DataJson: dataJson,
      CreatedBy: state.user.Name
    };

    await gas('saveQuotation', payload);
    closeModal();
    showToast('Quotation saved!');
    await refreshData();
  }

    const overdueDebtors = debtors.filter(i => daysBetween(i.DueDate || i.Date, state.data.today) > 0);

      c.Status !== 'Paid' && (Number(c.TotalAmount || 0) - Number(c.PaidAmount || 0)) > 0

        const paidAmt = inv.Status === 'Paid' ? tot : Number(inv.PaidAmount || 0);

        const isOverdue = bal > 0 && daysBetween(inv.DueDate || inv.Date, state.data.today) > 0;

        spMap[sp].totalSales += tot;
        spMap[sp].collected += paidAmt;
        spMap[sp].credit += bal;

          <input class="search-input" placeholder="Search creditors..." oninput="filterTable('creditorsTable', this.value)">
          <button class="btn btn-primary" onclick="openCreditorModal()">+ Add Creditor Bill</button>

                  <tr class="${isOver120 ? 'row-overdue' : ''}">
                    <td><b>${esc(c.BillNo)}</b></td>
                    <td>${esc(c.SupplierName)}</td>
                    <td>${esc(c.DueDate || c.Date)}</td>
                    <td>${days > 0 ? `<span class="badge ${isOver120 ? 'badge-danger' : 'badge-warning'}">${days} days</span>` : '<span class="badge badge-success">Current</span>'}</td>
                    <td>${fmtMoney(c.TotalAmount)}</td>

            </tbody>
          </table>

    document.getElementById('mainContent').innerHTML = `
      <div class="kpi-grid">
        <div class="card"><div class="kpi-label">Debtors Receivable</div><div class="kpi-val">${fmtMoney(totalDebtors)}</div><div class="kpi-sub" style="color:var(--danger)">${overdueDebtors.length} past Due Date (${fmtMoney(overdueDebtorsSum)})</div></div>
        <div class="card"><div class="kpi-label">Creditors Payable</div><div class="kpi-val">${fmtMoney(totalCreditors)}</div><div class="kpi-sub" style="color:var(--danger)">${overdue120Creditors} overdue &gt; 120 days</div></div>
      </div>
      <div class="tabs">
        <button class="tab-btn ${tab === 'debtors' ? 'active' : ''}" onclick="state.outTab='debtors'; renderOutstandingView()">Debtors (Receivables)</button>
        <button class="tab-btn ${tab === 'creditors' ? 'active' : ''}" onclick="state.outTab='creditors'; renderOutstandingView()">Creditors (Payables)</button>

    /* ==========================================================================
   * 2C. Specialized Call Reports (Sales Executives & Manager's Call Report)

  let _callReportTab = 'sales'; // 'sales' | 'manager'
  const _callReportFilter = {
    startDate: '',
    endDate: '',
    person: '',
    customer: '',
    search: ''
  };

  function normCallDate(d) {
    if (!d) return '';
    return String(d).trim().replace(/[./]/g, '-');
  }

  const SALES_CALL_COLS = [
    { key: 'Date', label: 'Date' },
    { key: 'SP', label: 'S.P' },
    { key: 'Route', label: 'Route' },
    { key: 'CallReport', label: 'Call Report' },
    { key: 'NoOfNewCus', label: 'No of new Cus', isNum: true },
    { key: 'NoOfRegCus', label: 'No of Reg Cus', isNum: true },
    { key: 'SiteVisit', label: 'Site Visit', isNum: true },
    { key: 'Total', label: 'Total', isNum: true, isHighlight: true },
    { key: 'Photo', label: 'Photo' },
    { key: 'WorkedNA', label: 'WORKED/N.A' },
    { key: 'HWNames', label: 'H. W Names' },
    { key: 'EndM', label: 'End M', isNum: true },
    { key: 'StartM', label: 'Start M', isNum: true },
    { key: 'TotalKM', label: 'Total KM', isNum: true, isHighlight: true },
    { key: 'StartPhoto', label: 'Start Photo' },
    { key: 'EndPhoto', label: 'End Photo' },
    { key: 'Location', label: 'Location' }
  ];

  const MANAGER_CALL_COLS = [
    { key: 'Date', label: 'Date' },
    { key: 'ManagerName', label: 'Manager Name' },
    { key: 'Route', label: 'Route' },
    { key: 'CallReport', label: 'Call Report' },
    { key: 'NewCustomer', label: 'New Customer', isNum: true },
    { key: 'RegularCustomer', label: 'Regular Customer', isNum: true },
    { key: 'SiteVisit', label: 'Site Visit', isNum: true },
    { key: 'TotalAmount', label: 'Total Amount', isNum: true, isHighlight: true },
    { key: 'WorkedNA', label: 'Worked / N.A' },
    { key: 'HardwareName', label: 'Hardware Name' },
    { key: 'StartMeterReading', label: 'Start Meter Reading', isNum: true },
    { key: 'EndMeterReading', label: 'End Meter Reading', isNum: true },
    { key: 'TotalMeter', label: 'Total Meter', isNum: true, isHighlight: true },
    { key: 'StartPhoto', label: 'Start Photo' },
    { key: 'StartLocation', label: 'Start Location' },
    { key: 'EndPhoto', label: 'End Photo' },
    { key: 'EndLocation', label: 'End Location' }
  ];

  function getCallVal(r, col) {
    const k = col.key;
    if (r[k] !== undefined && r[k] !== null && String(r[k]).trim() !== '') return r[k];
    if (r[col.label] !== undefined && r[col.label] !== null && String(r[col.label]).trim() !== '') return r[col.label];
    // Aliases
    if (k === 'SP') return r['S.P'] || r.sp || '';
    if (k === 'CallReport') return r['Call Report'] || r['Call \nReport'] || '';
    if (k === 'NoOfNewCus') return r['No of new Cus'] || r['No of \nnew Cus '] || 0;
    if (k === 'NoOfRegCus') return r['No of Reg Cus'] || r['No of \nReg Cus'] || 0;
    if (k === 'SiteVisit') return r['Site Visit'] || r['Site \nVisit '] || 0;
    if (k === 'WorkedNA') return r['WORKED/N.A'] || r['Worked / N.A'] || r.worked || '';
    if (k === 'HWNames') return r['H. W Names'] || r.HardwareName || '';
    if (k === 'EndM') return r['End M'] || 0;
    if (k === 'StartM') return r['Start M'] || 0;
    if (k === 'TotalKM') return r['Total KM'] || 0;
    if (k === 'StartPhoto') return r['Start Photo'] || r['Start Photo '] || '';
    if (k === 'EndPhoto') return r['End Photo'] || '';
    if (k === 'Location') return r.Location || '';
    if (k === 'ManagerName') return r['Manager Name'] || r['Manager Name '] || '';
    if (k === 'NewCustomer') return r['New Customer'] || r['New Customer '] || 0;
    if (k === 'RegularCustomer') return r['Regular Customer'] || r['Regular Customer '] || 0;
    if (k === 'TotalAmount') return r['Total Amount'] || r['Total Amount '] || r.Total || 0;
    if (k === 'HardwareName') return r['Hardware Name'] || r['Hardware Name '] || '';
    if (k === 'StartMeterReading') return r['Sart Meeter Reading'] || r['Start Meeter Reading'] || 0;
    if (k === 'EndMeterReading') return r['Ent  Meeter Reading'] || r['Ent Meeter Reading'] || 0;
    if (k === 'TotalMeter') return r['Total Meeter '] || r['Total Meeter'] || r['Total Meter'] || 0;
    if (k === 'StartLocation') return r['Start Locatio '] || r['Start Location'] || '';
    if (k === 'EndLocation') return r['Ent Location'] || r['End Location'] || '';
    return col.isNum ? 0 : '';
  }

  function renderCallReportsView() {
    const isSales = _callReportTab === 'sales';
    const reportType = isSales ? 'SalesExecutive' : 'Manager';
    const allReports = state.data.callReports || [];

    // Filter by sub-tab reportType
    const subReports = allReports.filter(r => {
      if (r.ReportType) return r.ReportType === reportType;
      let d = {};
      try { d = JSON.parse(r.DataJson || '{}'); } catch (e) {}
      if (isSales) {
        return !d.ManagerName && !d['Manager Name'] && !d['Manager Name '];
      } else {
        return !!(d.ManagerName || d['Manager Name'] || d['Manager Name ']);
      }
    });

    const activeCols = isSales ? SALES_CALL_COLS : MANAGER_CALL_COLS;

    // Parse data objects
    const parsedRows = subReports.map(r => {
      let data = {};
      try { data = JSON.parse(r.DataJson || '{}'); } catch (e) {}
      return {
        _id: r.CallId,
        _by: r.CreatedBy,
        ...data
      };
    });

    // Populate person list for filter
    const persons = Array.from(new Set(parsedRows.map(r => {
      return isSales ? String(getCallVal(r, { key: 'SP', label: 'S.P' })).trim() : String(getCallVal(r, { key: 'ManagerName', label: 'Manager Name' })).trim();
    }).filter(Boolean))).sort();

    // Available customer/hardware names for filter dropdown
    const customerList = Array.from(new Set([
      ...(state.data.customers || []).map(c => c.Name).filter(Boolean),
      ...parsedRows.map(r => isSales ? getCallVal(r, { key: 'HWNames' }) : getCallVal(r, { key: 'HardwareName' })).filter(Boolean)
    ])).sort();

    // Filter rows
    const filteredRows = parsedRows.filter(r => {
      const rawD = getCallVal(r, { key: 'Date', label: 'Date' });
      const d = normCallDate(rawD);
      if (_callReportFilter.startDate && d && d < _callReportFilter.startDate) return false;
      if (_callReportFilter.endDate && d && d > _callReportFilter.endDate) return false;

      const p = isSales ? String(getCallVal(r, { key: 'SP', label: 'S.P' })).trim() : String(getCallVal(r, { key: 'ManagerName', label: 'Manager Name' })).trim();
      if (_callReportFilter.person && p !== _callReportFilter.person) return false;

      if (_callReportFilter.customer) {
        const hw = isSales ? String(getCallVal(r, { key: 'HWNames' })).toLowerCase() : String(getCallVal(r, { key: 'HardwareName' })).toLowerCase();
        if (!hw.includes(_callReportFilter.customer.toLowerCase())) return false;
      }

      if (_callReportFilter.search) {
        const q = _callReportFilter.search.toLowerCase();
        const str = Object.values(r).join(' ').toLowerCase();
        if (!str.includes(q)) return false;
      }
      return true;
    });

    // Totals
    let sumNew = 0, sumReg = 0, sumSite = 0, sumTotal = 0, sumDist = 0;
    filteredRows.forEach(r => {
      if (isSales) {
        sumNew += Number(getCallVal(r, { key: 'NoOfNewCus', isNum: true })) || 0;
        sumReg += Number(getCallVal(r, { key: 'NoOfRegCus', isNum: true })) || 0;
        sumSite += Number(getCallVal(r, { key: 'SiteVisit', isNum: true })) || 0;
        sumTotal += Number(getCallVal(r, { key: 'Total', isNum: true })) || 0;
        sumDist += Number(getCallVal(r, { key: 'TotalKM', isNum: true })) || 0;
      } else {
        sumNew += Number(getCallVal(r, { key: 'NewCustomer', isNum: true })) || 0;
        sumReg += Number(getCallVal(r, { key: 'RegularCustomer', isNum: true })) || 0;
        sumSite += Number(getCallVal(r, { key: 'SiteVisit', isNum: true })) || 0;
        sumTotal += Number(getCallVal(r, { key: 'TotalAmount', isNum: true })) || 0;
        sumDist += Number(getCallVal(r, { key: 'TotalMeter', isNum: true })) || 0;
      }
    });

    function formatDisplayDate(dateStr) {
      if (!dateStr) return '';
      const d = String(dateStr).trim().replace(/[./]/g, '-');
      const parts = d.split('-');
      if (parts.length === 3) {
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const y = parts[0];
        const m = parseInt(parts[1], 10);
        const day = parseInt(parts[2], 10);
        if (!isNaN(m) && m >= 1 && m <= 12 && !isNaN(day)) {
          return `${day} ${months[m - 1]} ${y}`;
        }
      }
      return dateStr;
    }

    let rangeText = '';
    if (_callReportFilter.startDate && _callReportFilter.endDate) {
      if (_callReportFilter.startDate === _callReportFilter.endDate) {
        rangeText = formatDisplayDate(_callReportFilter.startDate);
      } else {
        rangeText = `From ${formatDisplayDate(_callReportFilter.startDate)} to ${formatDisplayDate(_callReportFilter.endDate)}`;
      }
    } else if (_callReportFilter.startDate) {
      rangeText = `From ${formatDisplayDate(_callReportFilter.startDate)} onwards`;
    } else if (_callReportFilter.endDate) {
      rangeText = `Up to ${formatDisplayDate(_callReportFilter.endDate)}`;
    } else {
      const rowDates = filteredRows.map(r => normCallDate(getCallVal(r, { key: 'Date', label: 'Date' }))).filter(Boolean).sort();
      if (rowDates.length > 0) {
        const minD = rowDates[0];
        const maxD = rowDates[rowDates.length - 1];
        rangeText = minD === maxD ? formatDisplayDate(minD) : `From ${formatDisplayDate(minD)} to ${formatDisplayDate(maxD)}`;
      } else {
        rangeText = 'From 26 October to 25 November 2026';
      }
    }

    const reportTitle = isSales
      ? `${rangeText} - Sales Executives Call Report`
      : `Manager's Call Report (${rangeText})`;

    document.getElementById('mainContent').innerHTML = `
      <div class="card no-print" style="margin-bottom:16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:14px;">
          <div class="btn-group" style="display:inline-flex;">
            <button class="btn ${isSales ? 'btn-primary' : 'btn-secondary'}" onclick="_callReportTab='sales'; renderCallReportsView()">
              👥 Sales Executives Call Report
            </button>
            <button class="btn ${!isSales ? 'btn-primary' : 'btn-secondary'}" onclick="_callReportTab='manager'; renderCallReportsView()">
              👔 Manager's Call Report
            </button>
          </div>
          <div class="section-actions" style="margin:0;">
            <label class="btn btn-sm btn-secondary" style="cursor:pointer; margin:0;">
              📤 Upload / Import Excel
              <input type="file" accept=".xlsx,.xls,.csv" style="display:none;" onchange="importCallReportExcel(this.files[0])">
            </label>
            <button class="btn btn-sm btn-secondary" onclick="exportCallReportExcel()">⬇ Export Excel</button>
            <button class="btn btn-sm btn-secondary" onclick="exportElementPdf('#callReportTable', '${isSales ? 'Sales_Call_Report' : 'Managers_Call_Report'}', 'landscape')">📄 Download PDF</button>
            <button class="btn btn-sm btn-secondary" onclick="window.print()">🖨 Print</button>
            <button class="btn btn-sm btn-danger" onclick="clearAllCallReports()">🗑️ Clear All</button>
            <button class="btn btn-sm btn-primary" onclick="openCallReportModal()">+ New Entry</button>
          </div>

  window.calcSalesTotals = function() {
    const n1 = parseFloat(document.getElementById('cr_NoOfNewCus')?.value || 0) || 0;
    const n2 = parseFloat(document.getElementById('cr_NoOfRegCus')?.value || 0) || 0;
    const n3 = parseFloat(document.getElementById('cr_SiteVisit')?.value || 0) || 0;
    const totEl = document.getElementById('cr_Total');
    if (totEl) totEl.value = n1 + n2 + n3;

    const m1 = parseFloat(document.getElementById('cr_StartM')?.value || 0) || 0;
    const m2 = parseFloat(document.getElementById('cr_EndM')?.value || 0) || 0;
    const kmEl = document.getElementById('cr_TotalKM');
    if (kmEl) kmEl.value = (m2 > m1 ? m2 - m1 : 0);
  };

  window.calcManagerTotals = function() {
    const n1 = parseFloat(document.getElementById('cr_NewCustomer')?.value || 0) || 0;
    const n2 = parseFloat(document.getElementById('cr_RegularCustomer')?.value || 0) || 0;
    const n3 = parseFloat(document.getElementById('cr_SiteVisit')?.value || 0) || 0;
    const totEl = document.getElementById('cr_TotalAmount');
    if (totEl) totEl.value = n1 + n2 + n3;

    const m1 = parseFloat(document.getElementById('cr_StartMeterReading')?.value || 0) || 0;
    const m2 = parseFloat(document.getElementById('cr_EndMeterReading')?.value || 0) || 0;
    const mEl = document.getElementById('cr_TotalMeter');
    if (mEl) mEl.value = (m2 > m1 ? m2 - m1 : 0);
  };

  async function submitCallReport(id) {
    const isSales = _callReportTab === 'sales';
    const reportType = isSales ? 'SalesExecutive' : 'Manager';
    const obj = {};

    if (isSales) {
      obj.Date = document.getElementById('cr_Date')?.value.trim() || '';
      obj.SP = document.getElementById('cr_SP')?.value.trim() || '';
      obj.Route = document.getElementById('cr_Route')?.value.trim() || '';
      obj.CallReport = document.getElementById('cr_CallReport')?.value.trim() || '';

  async function importCallReportExcel(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        if (typeof XLSX === 'undefined') {
          showToast('Excel parser library not loaded.');
          return;
        }
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheetName = wb.SheetNames.includes('November 26') ? 'November 26' : wb.SheetNames[0];
        const ws = wb.Sheets[sheetName];
        const rawRows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

        // Auto-detect format or use current tab
        let isSales = _callReportTab === 'sales';
        const strAll = JSON.stringify(rawRows.slice(0, 4));
        if (strAll.includes('Sales') || strAll.includes('S.P')) isSales = true;
        else if (strAll.includes('Manager')) isSales = false;

        const toNum = (v) => {
          if (v === undefined || v === null) return 0;
          const s = String(v).trim();
          if (!s) return 0;
          const n = parseFloat(s);
          return isNaN(n) ? 0 : n;
        };

        const entries = [];
        if (isSales) {
          // Headers at row index 1, data starts at index 2
          for (let r = 2; r < rawRows.length; r++) {
            const row = rawRows[r] || [];
            const d = String(row[0] || '').trim();
            const sp = String(row[1] || '').trim();
            const route = String(row[2] || '').trim();
            const callRep = String(row[3] || '').trim();
            const newCus = toNum(row[4]);
            const regCus = toNum(row[5]);
            const siteVisit = toNum(row[6]);
            const total = toNum(row[7]) || (newCus + regCus + siteVisit);
            const photo = String(row[8] || '').trim();
            const worked = String(row[9] || '').trim();
            const hw = String(row[10] || '').trim();
            const endM = toNum(row[11]);
            const startM = toNum(row[12]);
            const totKm = toNum(row[13]) || (endM && startM ? endM - startM : 0);
            const sPhoto = String(row[14] || '').trim();
            const ePhoto = String(row[15] || '').trim();
            const loc = String(row[16] || '').trim();

            if (!d && !sp && !route && !hw) continue;
            entries.push({
              Date: d, SP: sp, Route: route, CallReport: callRep,
              NoOfNewCus: newCus, NoOfRegCus: regCus, SiteVisit: siteVisit, Total: total,
              Photo: photo, WorkedNA: worked, HWNames: hw,
              EndM: endM, StartM: startM, TotalKM: totKm,
              StartPhoto: sPhoto, EndPhoto: ePhoto, Location: loc
            });
          }
        } else {
          // Headers at row index 2, data starts at index 3 (starts at col B: index 1)
          for (let r = 3; r < rawRows.length; r++) {
            const row = rawRows[r] || [];
            const d = String(row[1] || '').trim();
            const mgr = String(row[2] || '').trim();
            const route = String(row[3] || '').trim();
            const callRep = String(row[4] || '').trim();
            const newCus = toNum(row[5]);
            const regCus = toNum(row[6]);
            const siteVisit = toNum(row[7]);
            const total = toNum(row[8]) || (newCus + regCus + siteVisit);
            const worked = String(row[9] || '').trim();
            const hw = String(row[10] || '').trim();
            const startM = toNum(row[11]);
            const endM = toNum(row[12]);
            const totM = toNum(row[13]) || (endM && startM ? endM - startM : 0);
            const sPhoto = String(row[14] || '').trim();
            const sLoc = String(row[15] || '').trim();
            const ePhoto = String(row[16] || '').trim();
            const eLoc = String(row[17] || '').trim();

            if (!d && !mgr && !route && !hw) continue;
            entries.push({
              Date: d, ManagerName: mgr, Route: route, CallReport: callRep,
              NewCustomer: newCus, RegularCustomer: regCus, SiteVisit: siteVisit, TotalAmount: total,
              WorkedNA: worked, HardwareName: hw,
              StartMeterReading: startM, EndMeterReading: endM, TotalMeter: totM,
              StartPhoto: sPhoto, StartLocation: sLoc, EndPhoto: ePhoto, EndLocation: eLoc
            });
          }
        }

        if (!entries.length) {
          showToast('No valid rows found in selected file.');
          return;
        }

        const reportType = isSales ? 'SalesExecutive' : 'Manager';
        const label = isSales ? 'Sales Executives' : 'Manager';
        if (confirm(`Detected ${entries.length} valid rows for ${label} Call Report. Import now?`)) {
          showToast('Importing ' + entries.length + ' entries...');
          await gas('importReportEntries', 'CallReports', entries, state.user.Name, reportType);
          showToast('Successfully imported ' + entries.length + ' entries!');
          _callReportTab = isSales ? 'sales' : 'manager';
          await refreshData();
        }
      } catch (err) {
        showToast('Error importing Excel: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function exportCallReportExcel() {
    const isSales = _callReportTab === 'sales';
    const reportType = isSales ? 'SalesExecutive' : 'Manager';
    const allReports = state.data.callReports || [];
    const subReports = allReports.filter(r => {
      if (r.ReportType) return r.ReportType === reportType;
      let d = {};
      try { d = JSON.parse(r.DataJson || '{}'); } catch (e) {}
      return isSales ? (!d.ManagerName && !d['Manager Name']) : (!!(d.ManagerName || d['Manager Name']));
    });

    const parsed = subReports.map(r => {
      let data = {};
      try { data = JSON.parse(r.DataJson || '{}'); } catch (e) {}
      return { _id: r.CallId, ...data };
    });

    const filtered = parsed.filter(r => {
      const rawD = getCallVal(r, { key: 'Date', label: 'Date' });
      const d = normCallDate(rawD);
      if (_callReportFilter.startDate && d && d < _callReportFilter.startDate) return false;
      if (_callReportFilter.endDate && d && d > _callReportFilter.endDate) return false;
      const p = isSales ? String(getCallVal(r, { key: 'SP', label: 'S.P' })).trim() : String(getCallVal(r, { key: 'ManagerName', label: 'Manager Name' })).trim();
      if (_callReportFilter.person && p !== _callReportFilter.person) return false;
      if (_callReportFilter.customer) {
        const hw = isSales ? String(getCallVal(r, { key: 'HWNames' })).toLowerCase() : String(getCallVal(r, { key: 'HardwareName' })).toLowerCase();
        if (!hw.includes(_callReportFilter.customer.toLowerCase())) return false;
      }
      return true;
    });

    const activeCols = isSales ? SALES_CALL_COLS : MANAGER_CALL_COLS;
    const rows = filtered.map(r => {
      const row = {};
      activeCols.forEach(c => {
        row[c.label] = getCallVal(r, c);
      });
      return row;
    });

    if (typeof XLSX !== 'undefined') {
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      const sheetTitle = isSales ? 'Sales Executives' : 'Manager';
      XLSX.utils.book_append_sheet(wb, ws, sheetTitle);
      const dateTag = (_callReportFilter.startDate || _callReportFilter.endDate)
        ? `_${_callReportFilter.startDate || 'start'}_to_${_callReportFilter.endDate || 'end'}`
        : `_${state.data.today || 'export'}`;
      XLSX.writeFile(wb, `${isSales ? 'Call_Report_Sales_Executives' : 'Managers_Call_Report'}${dateTag}.xlsx`);
    } else {
      showToast('Export failed: XLSX library not loaded');
    }
  }

  function importProjectReportExcel(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        if (typeof XLSX === 'undefined') {
          showToast('XLSX library not loaded.');
          return;
        }
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array' });

        const sheetName = wb.SheetNames.find(n => /sheet1|project/i.test(n)) || wb.SheetNames[0];
        const ws = wb.Sheets[sheetName];
        const rawJson = XLSX.utils.sheet_to_json(ws, { defval: '', header: 1 });

        let headerRowIdx = -1;
        for (let r = 0; r < Math.min(10, rawJson.length); r++) {
          const row = (rawJson[r] || []).map(c => String(c).trim().toLowerCase());
          if (row.includes('customer') || row.includes('contact number') || row.includes('no')) {
            headerRowIdx = r;
            break;
          }
        }

        const entries = [];
        if (headerRowIdx !== -1) {
          const headers = (rawJson[headerRowIdx] || []).map(c => String(c).trim());
          for (let r = headerRowIdx + 1; r < rawJson.length; r++) {
            const row = rawJson[r] || [];
            const obj = {};
            headers.forEach((h, i) => { if (h) obj[h] = row[i] !== undefined ? String(row[i]).trim() : ''; });
            const cust = obj['Customer'] || obj['Customer '] || '';
            const no = obj['No'] || obj['No.'] || (entries.length + 1);
            if (cust || obj['Address'] || obj['Date']) {
              entries.push({
                No: parseInt(no, 10) || no,
                Date: obj['Date'] || state.data.today || '',
                Customer: cust,
                ContactNumber: obj['Contact Number'] || obj['ContactNumber'] || obj['Phone'] || '',
                Address: obj['Address'] || '',
                Area: obj['Area'] || '',
                Comment: obj['Comment'] || ''
              });
            }
          }
        }

        const planSheetName = wb.SheetNames.find(n => /monthly plan|sales plan/i.test(n));
        if (planSheetName) {
          const pws = wb.Sheets[planSheetName];
          const planJson = XLSX.utils.sheet_to_json(pws, { defval: '', header: 1 });
          const planRows = [];
          for (let r = 0; r < planJson.length; r++) {
            const row = planJson[r] || [];
            const w = String(row[1] || '').trim();
            if (/week \d+/i.test(w)) {
              planRows.push({
                Week: w,
                MainActivity: String(row[2] || '').trim(),
                ExpectedOutcome: String(row[3] || '').trim(),
                CallReport: String(row[4] || '').trim(),
                Comment: String(row[5] || '').trim()
              });
            }
          }
          if (planRows.length) {
            await gas('saveSettings', { ProjectSalesPlan: JSON.stringify(planRows) });
          }
        }

        if (entries.length) {
          await gas('importReportEntries', 'ProjectReports', entries, state.user.Name);
          showToast(`Imported ${entries.length} Project Report entries successfully!`);
        } else {
          showToast('No project report records found in file.');
        }
        await refreshData();
        renderProjectReportsView();
      } catch (err) {
        showToast('Error importing file: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function exportProjectReportExcel() {
    if (typeof XLSX === 'undefined') {
      showToast('XLSX library not loaded.');
      return;
    }
    const rawReports = state.data.projectReports || [];
    const reportRows = rawReports.map((r, idx) => {
      let d = {};
      try { d = JSON.parse(r.DataJson || '{}'); } catch (e) {}
      return {
        'No': d.No !== undefined ? d.No : (idx + 1),
        'Customer': d.Customer || '',
        'Contact Number': d.ContactNumber || d['Contact Number'] || '',
        'Address': d.Address || '',
        'Area': d.Area || '',
        'Comment': d.Comment || '',
        'Date': d.Date || ''
      };
    });

    const wb = XLSX.utils.book_new();

    const wsReports = XLSX.utils.json_to_sheet(reportRows, {
      header: ['No', 'Customer', 'Contact Number', 'Address', 'Area', 'Comment', 'Date']
    });
    XLSX.utils.book_append_sheet(wb, wsReports, 'Sheet1');

    const planRows = getProjectPlanRows().map(p => ({
      'Week': p.Week || '',
      'Main Activity': p.MainActivity || '',
      'Expected Outcome': p.ExpectedOutcome || '',
      'Call Report': p.CallReport || '',
      'Comment': p.Comment || ''
    }));
    const wsPlan = XLSX.utils.json_to_sheet(planRows, {
      header: ['Week', 'Main Activity', 'Expected Outcome', 'Call Report', 'Comment']
    });
    XLSX.utils.book_append_sheet(wb, wsPlan, 'Monthly Plan');

    XLSX.writeFile(wb, `Project_Report_${state.data.today || 'export'}.xlsx`);
  }
