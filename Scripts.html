  async function migrateDataToSupabase() {
    if (!window.sbClient) {
      showToast('Please configure and test Supabase connection first.');
      return;
    }
    const resEl = document.getElementById('sbTestResult');
    if (resEl) resEl.innerHTML = '<div style="color:var(--primary); font-weight:600;">Migrating all local records to Supabase Cloud...</div>';

    try {
      let count = 0;
      if (state.data.invoices && state.data.invoices.length) {
        await window.sbClient.from('Invoices').upsert(state.data.invoices);
        count += state.data.invoices.length;
      }
      if (state.data.quotations && state.data.quotations.length) {
        await window.sbClient.from('Quotations').upsert(state.data.quotations);
        count += state.data.quotations.length;
      }
      if (state.data.inventory && state.data.inventory.length) {
        await window.sbClient.from('Inventory').upsert(state.data.inventory);
        count += state.data.inventory.length;
      }
      if (state.data.customers && state.data.customers.length) {
        await window.sbClient.from('Customers').upsert(state.data.customers);
        count += state.data.customers.length;
      }
      if (state.data.employees && state.data.employees.length) {
        await window.sbClient.from('Employees').upsert(state.data.employees);
        count += state.data.employees.length;
      }
      if (state.data.transactions && state.data.transactions.length) {
        await window.sbClient.from('Transactions').upsert(state.data.transactions);
        count += state.data.transactions.length;
      }

      if (resEl) {
        resEl.innerHTML = `
          <div style="background:#f0fdf4; border:1px solid #bbf7d0; border-radius:6px; padding:10px 14px; color:#166534;">
            <b>🚀 Migration Complete!</b> Synchronized ${count} records across Invoices, Quotations, Stock, Customers, and Employees to Supabase Cloud!

    } catch (e) {

      showToast('Migration error: ' + e.message);

  function initCropCanvasEvents() {
    const canvas = document.getElementById('cropCanvas');
    if (!canvas) return;

    function getPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function onStart(e) {
      _cropState.isDragging = true;
      const p = getPos(e);
      _cropState.startX = p.x - _cropState.x;
      _cropState.startY = p.y - _cropState.y;
    }

    function onMove(e) {
      if (!_cropState.isDragging) return;
      const p = getPos(e);
      _cropState.x = p.x - _cropState.startX;
      _cropState.y = p.y - _cropState.startY;
      drawCropCanvas();
    }

    function onEnd() {
      _cropState.isDragging = false;
    }

    canvas.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);

    canvas.addEventListener('touchstart', onStart, { passive: true });
    window.addEventListener('touchmove', onMove, { passive: true });
    window.addEventListener('touchend', onEnd);
  }

  function onCropZoom(val) {
    _cropState.zoom = parseFloat(val) || 1;
    drawCropCanvas();
  }

  function drawCropCanvas() {
    const canvas = document.getElementById('cropCanvas');
    if (!canvas || !_cropState.img) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;

    ctx.clearRect(0, 0, w, h);
    ctx.save();

    const scale = Math.max(w / _cropState.img.width, h / _cropState.img.height) * _cropState.zoom;
    const sw = _cropState.img.width * scale;
    const sh = _cropState.img.height * scale;
    const dx = (w - sw) / 2 + _cropState.x;
    const dy = (h - sh) / 2 + _cropState.y;

    ctx.drawImage(_cropState.img, dx, dy, sw, sh);
    ctx.restore();
  }

  async function submitUser(userId) {
    const name = document.getElementById('fUsName').value.trim();
    if (!name) {
      showToast('Please enter user name');
      return;
    }
    const checkedTabs = Array.from(document.querySelectorAll('.user-tab-checkbox:checked'))
      .map(cb => cb.getAttribute('data-tab'))
      .join(',');

    const payload = {
      UserId: userId || '',
      Name: name,
      Email: document.getElementById('fUsEmail').value.trim(),
      NIC: document.getElementById('fUsNic')?.value.trim() || '',
      Role: document.getElementById('fUsRole').value,
      Status: document.getElementById('fUsStat').value,
      AllowedTabs: checkedTabs
    };
    const pin = document.getElementById('fUsPin').value.trim();
    if (pin) payload.Pin = pin;

    // Check linked employee from directory
    const empLinkSelect = document.getElementById('fUsEmpLink');
    const linkedEmpId = empLinkSelect ? empLinkSelect.value : '';
    let linkedEmp = null;
    if (linkedEmpId) {
      linkedEmp = (state.data.employees || []).find(e => e.EmpId === linkedEmpId);
      if (linkedEmp) {
        if (payload.NIC) linkedEmp.NIC = payload.NIC;
        if (payload.Email) linkedEmp.Email = payload.Email;
        if (payload.Name) linkedEmp.Name = payload.Name;
      }
    }

    closeModal();
    showToast('Saving user profile...');

    try {
      const saved = await gas('saveUser', payload);
      if (saved && saved.UserId) {
        payload.UserId = saved.UserId;
        if (userId) {
          const idx = (state.data.users || []).findIndex(x => x.UserId === userId);
          if (idx !== -1) Object.assign(state.data.users[idx], saved);
        } else {
          (state.data.users = state.data.users || []).push(saved);
        }
        if (state.user.UserId === saved.UserId) {
          Object.assign(state.user, saved);
          renderTopbarUserProfile();
          updateRestrictedTabsVisibility();
        }
      }
      if (linkedEmp) {
        await gas('saveEmployee', linkedEmp).catch(err => console.error(err));
      }
      try {
        localStorage.setItem(CACHE_KEY_USER, JSON.stringify(state.user));
        localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(state.data));
      } catch (e) {}
      renderSettingsView();
      showToast('User profile & Employee link saved successfully!');
      await refreshData();
    } catch (err) {
      console.error(err);
      showToast('Error saving user: ' + (err.message || err));
    }
  }

  const _reportState = {
    source: 'Invoices',

    uploadedRows: [],
    selectedCols: [],

    dateTo: '',
    search: '',
    groupBy: '',

    lastOutputCols: []
  };

  function getReportDataset() {
    if (_reportState.source === 'UploadedFile') {
      return _reportState.uploadedRows || [];
    }
    const map = {
      Invoices: state.data.invoices,
      Transactions: state.data.transactions,
      Inventory: state.data.inventory.map(it => ({
        ...it,
        StockValue: (Number(it.UnitPrice) || 0) * (Number(it.StockQty) || 0)
      })),
      Customers: state.data.customers,
      Attendance: state.data.attendance.map(a => {
        let hrs = '';
        if (a.ClockIn && a.ClockOut) {
          const [h1, m1] = String(a.ClockIn).split(':').map(Number);
          const [h2, m2] = String(a.ClockOut).split(':').map(Number);
          if (!isNaN(h1) && !isNaN(h2)) {
            hrs = (((h2 * 60 + m2) - (h1 * 60 + m1)) / 60).toFixed(2);
          }
        }
        return { ...a, HoursWorked: hrs };
      }),
      Leaves: state.data.leaves,
      Tasks: state.data.tasks
    };
    return map[_reportState.source] || [];
  }

  function renderReportsView() {
    const raw = getReportDataset();
    const allCols = raw.length ? Object.keys(raw[0]) : [];
    if (!_reportState.selectedCols.length || !_reportState.selectedCols.every(c => allCols.includes(c))) {
      _reportState.selectedCols = allCols.slice(0, 8);
    }

    // Filter rows
    const dateCol = allCols.find(c => /date/i.test(c));
    const q = _reportState.search.toLowerCase();
    const filtered = raw.filter(r => {
      if (dateCol && _reportState.dateFrom && String(r[dateCol]) < _reportState.dateFrom) return false;
      if (dateCol && _reportState.dateTo && String(r[dateCol]) > _reportState.dateTo) return false;
      if (q && !Object.values(r).some(v => String(v).toLowerCase().includes(q))) return false;
      return true;
    });

    // Detect numeric columns among selectedCols
    const numCols = _reportState.selectedCols.filter(c => {
      const vals = filtered.map(r => r[c]).filter(v => v !== '' && v !== null && v !== undefined);
      return vals.length > 0 && vals.every(v => !isNaN(Number(String(v).replace(/,/g, ''))));
    });

    // Build output rows (raw or grouped with system calculations)
    let outCols = [..._reportState.selectedCols];
    let outRows = filtered;

    if (_reportState.groupBy && allCols.includes(_reportState.groupBy)) {
      const grpCol = _reportState.groupBy;
      const groups = {};
      filtered.forEach(r => {
        const k = String(r[grpCol] || '(Blank)');
        if (!groups[k]) groups[k] = [];
        groups[k].push(r);
      });

      const calcCols = numCols.filter(c => c !== grpCol);
      outCols = [grpCol, 'Count', ...calcCols.map(c => `${c} (${_reportState.calcType})`)];
      outRows = Object.keys(groups).map(k => {
        const list = groups[k];
        const rowObj = { [grpCol]: k, Count: list.length };
        calcCols.forEach(c => {
          const nums = list.map(x => Number(String(x[c]).replace(/,/g, '')) || 0);
          const sum = nums.reduce((a, b) => a + b, 0);
          let val = sum;
          if (_reportState.calcType === 'AVG') val = nums.length ? sum / nums.length : 0;
          else if (_reportState.calcType === 'MIN') val = nums.length ? Math.min(...nums) : 0;
          else if (_reportState.calcType === 'MAX') val = nums.length ? Math.max(...nums) : 0;
          rowObj[`${c} (${_reportState.calcType})`] = Number(val.toFixed(2));
        });
        return rowObj;
      });
    }

    _reportState.lastOutputCols = outCols;
    _reportState.lastOutputRows = outRows;

    // Grand Totals row
    const totals = {};
    outCols.forEach((c, idx) => {
      if (idx === 0) { totals[c] = 'TOTAL'; return; }
      const vals = outRows.map(r => r[c]).filter(v => v !== '' && v !== null && v !== undefined);
      if (vals.length && vals.every(v => !isNaN(Number(String(v).replace(/,/g, ''))))) {
        const sum = vals.reduce((a, b) => a + Number(String(b).replace(/,/g, '')), 0);
        totals[c] = Number(sum.toFixed(2)).toLocaleString('en-US', { maximumFractionDigits: 2 });
      } else {
        totals[c] = '';
      }
    });

    const savedOpts = state.data.savedReports.map(sr =>
      `<option value="${esc(sr.ReportId)}">${esc(sr.Name)} (${esc(sr.Source)})</option>`
    ).join('');

    document.getElementById('mainContent').innerHTML = `
      <div class="card no-print" style="margin-bottom:16px;">
        <div class="section-header">
          <div>
            <h3>Custom Report Builder</h3>
            <p style="font-size:12px; color:var(--muted);">Create custom reports from Office data or directly from any uploaded Excel / CSV file with automatic calculations.</p>
          </div>
          <div class="section-actions">
            <select id="savedRptSelect" style="width:auto;" onchange="loadSavedReport(this.value)">
              <option value="">-- Load Saved Report --</option>
              ${savedOpts}
            </select>
            <button class="btn btn-sm btn-secondary" onclick="saveCurrentReport()">💾 Save Report</button>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Data Source</label>
            <select onchange="changeReportSource(this.value)">
              ${['Invoices', 'Transactions', 'Inventory', 'Customers', 'Attendance', 'Leaves', 'Tasks'].map(s =>
                `<option value="${s}" ${_reportState.source === s ? 'selected' : ''}>${s}</option>`
              ).join('')}
              <option value="UploadedFile" ${_reportState.source === 'UploadedFile' ? 'selected' : ''}>📄 Uploaded Excel / CSV File ${_reportState.uploadedName ? '(' + esc(_reportState.uploadedName) + ')' : ''}</option>
            </select>
          </div>
          <div class="form-group">
            <label>Or Upload Excel / CSV File for Instant Report</label>
            <input type="file" accept=".xlsx,.xls,.csv" onchange="handleReportFileUpload(this.files[0])">
          </div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; margin-bottom:12px;">
          <div class="form-group" style="margin:0;">
            <label>Date From</label>
            <input type="date" value="${esc(_reportState.dateFrom)}" onchange="_reportState.dateFrom=this.value; renderReportsView()">
          </div>
          <div class="form-group" style="margin:0;">
            <label>Date To</label>
            <input type="date" value="${esc(_reportState.dateTo)}" onchange="_reportState.dateTo=this.value; renderReportsView()">
          </div>
          <div class="form-group" style="margin:0;">
            <label>Search / Filter</label>
            <input placeholder="Keyword..." value="${esc(_reportState.search)}" oninput="filterTable('reportsTable', this.value)">
          </div>
          <div class="form-group" style="margin:0;">
            <label>Group By (Calculations)</label>
            <select onchange="_reportState.groupBy=this.value; renderReportsView()">
              <option value="">-- Detailed Rows (No Grouping) --</option>
              ${allCols.map(c => `<option value="${esc(c)}" ${_reportState.groupBy === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
            </select>
          </div>
          ${_reportState.groupBy ? `
            <div class="form-group" style="margin:0;">
              <label>Calculation</label>
              <select onchange="_reportState.calcType=this.value; renderReportsView()">
                ${['SUM', 'AVG', 'MIN', 'MAX'].map(fn => `<option ${fn === _reportState.calcType ? 'selected' : ''}>${fn}</option>`).join('')}
              </select>
            </div>
          ` : ''}
        </div>

        ${allCols.length ? `
          <div>
            <label style="font-size:12px; font-weight:600; color:var(--muted); display:block; margin-bottom:6px;">Columns to Include:</label>
            <div style="display:flex; flex-wrap:wrap; gap:10px;">
              ${allCols.map(c => `
                <label style="display:inline-flex; align-items:center; gap:5px; font-size:12px; cursor:pointer;">
                  <input type="checkbox" style="width:auto;" ${_reportState.selectedCols.includes(c) ? 'checked' : ''} onchange="toggleReportCol('${esc(c)}', this.checked)">
                  ${esc(c)}
                </label>
              `).join('')}
            </div>
          </div>
        ` : ''}
      </div>

      <div class="card">
        <div class="section-header">
          <div>
            <h3>Report Output (${outRows.length} rows)</h3>
            <div style="font-size:12px; color:var(--muted);">Source: ${esc(_reportState.source === 'UploadedFile' ? _reportState.uploadedName : _reportState.source)}</div>
          </div>
          <div class="section-actions no-print">
            <button class="btn btn-sm btn-secondary" onclick="exportReportCsv()">⬇ Export CSV</button>
            <button class="btn btn-sm btn-secondary" onclick="exportReportExcel()">⬇ Export Excel</button>
            <button class="btn btn-sm btn-secondary" onclick="exportElementPdf('.table-wrap', 'Report_${esc(_reportState.source || 'Output')}', 'landscape')">📄 Download PDF</button>
            <button class="btn btn-sm btn-secondary" onclick="saveCurrentReportToDrive()">☁ Save to Drive</button>
            <button class="btn btn-sm btn-primary" onclick="window.print()">🖨 Print</button>
          </div>
        </div>
        <div class="table-wrap">
          <table id="reportsTable">
            <thead><tr>${outCols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
            <tbody>
              ${outRows.map(r => `
                <tr>${outCols.map(c => `<td>${esc(r[c])}</td>`).join('')}</tr>
              `).join('') || '<tr><td colspan="' + (outCols.length || 1) + '" style="color:var(--muted)">No matching records.</td></tr>'}
            </tbody>
            ${outRows.length ? `
              <tfoot>
                <tr style="background:#f1f5f9; font-weight:700;">
                  ${outCols.map(c => `<td>${esc(totals[c])}</td>`).join('')}
                </tr>
              </tfoot>
            ` : ''}
          </table>
        </div>
      </div>
    `;
  }

  function changeReportSource(src) {
    _reportState.source = src;
    _reportState.selectedCols = [];
    _reportState.groupBy = '';
    renderReportsView();
  }

  function toggleReportCol(col, checked) {
    if (checked && !_reportState.selectedCols.includes(col)) {
      _reportState.selectedCols.push(col);
    } else if (!checked) {
      _reportState.selectedCols = _reportState.selectedCols.filter(c => c !== col);
    }
    renderReportsView();
  }

  function handleReportFileUpload(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        if (typeof XLSX !== 'undefined') {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          _reportState.uploadedRows = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
        } else {
          const text = new TextDecoder().decode(e.target.result);
          const lines = text.split(/\r?\n/).filter(l => l.trim());
          const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
          _reportState.uploadedRows = lines.slice(1).map(l => {
            const cols = l.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            const obj = {};
            headers.forEach((h, i) => { obj[h] = cols[i] || ''; });
            return obj;
          });
        }
        _reportState.uploadedName = file.name;
        _reportState.source = 'UploadedFile';
        _reportState.selectedCols = [];
        _reportState.groupBy = '';
        showToast('File loaded for reporting: ' + file.name);
        renderReportsView();
      } catch (err) {
        showToast('Error reading file: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  async function saveCurrentReport() {
    const name = prompt('Enter a name for this custom report:');
    if (!name) return;
    await gas('saveCustomReport', {
      Name: name,
      Source: _reportState.source,
      ConfigJson: JSON.stringify({
        selectedCols: _reportState.selectedCols,
        dateFrom: _reportState.dateFrom,
        dateTo: _reportState.dateTo,
        search: _reportState.search,
        groupBy: _reportState.groupBy,
        calcType: _reportState.calcType
      }),
      CreatedBy: state.user.Name
    });
    showToast('Custom report saved!');
    await refreshData();
  }

  function loadSavedReport(reportId) {
    if (!reportId) return;
    const r = state.data.savedReports.find(x => x.ReportId === reportId);
    if (!r) return;
    try {
      const cfg = JSON.parse(r.ConfigJson || '{}');
      _reportState.source = r.Source || 'Invoices';
      _reportState.selectedCols = cfg.selectedCols || [];
      _reportState.dateFrom = cfg.dateFrom || '';
      _reportState.dateTo = cfg.dateTo || '';
      _reportState.search = cfg.search || '';
      _reportState.groupBy = cfg.groupBy || '';
      _reportState.calcType = cfg.calcType || 'SUM';
      renderReportsView();
    } catch (e) {}
  }

  function buildReportCsv() {
    const cols = _reportState.lastOutputCols;
    const rows = _reportState.lastOutputRows;
    const escCsv = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    return [cols.map(escCsv).join(','), ...rows.map(r => cols.map(c => escCsv(r[c])).join(','))].join('\n');
  }

  function exportReportCsv() {
    const csv = buildReportCsv();
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Report_${_reportState.source}_${state.data.today}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function exportReportExcel() {
    if (typeof XLSX === 'undefined') return exportReportCsv();
    const ws = XLSX.utils.json_to_sheet(_reportState.lastOutputRows, { header: _reportState.lastOutputCols });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Report');
    XLSX.writeFile(wb, `Report_${_reportState.source}_${state.data.today}.xlsx`);
  }

  async function saveCurrentReportToDrive() {
    const filename = `Report_${_reportState.source}_${state.data.today}.csv`;
    const res = await gas('saveReportToDrive', filename, buildReportCsv());
    showToast('Saved to Google Drive: ' + res.name);
  }

  /* ==========================================================================
   * 8. Import Excel / CSV Data
   * ======================================================================== */

  const IMPORT_SCHEMAS = {
    Inventory: ['SKU', 'Name', 'Category', 'UnitPrice', 'StockQty', 'ReorderLevel', 'Unit'],
    Customers: ['Name', 'Company', 'Phone', 'Email', 'Address', 'Notes'],
    Employees: ['Name', 'Address', 'NIC', 'DOB', 'Gender', 'Position', 'Email', 'Phone', 'EmergencyContactName', 'EmergencyContactPhone', 'JoinDate', 'Status'],
    Transactions: ['Date', 'Type', 'Category', 'Description', 'Amount', 'RecordedBy'],
    Invoices: ['InvoiceNo', 'CustomerName', 'Date', 'DueDate', 'Status', 'Subtotal', 'TaxAmount', 'Total', 'Notes'],
    Attendance: ['UserName', 'Date', 'ClockIn', 'ClockOut', 'Status', 'Notes'],
    Tasks: ['Title', 'Project', 'AssigneeName', 'DueDate', 'Priority', 'Status', 'Notes']
  };

  const _importState = {
    table: 'Inventory',
    workbook: null,
    sheetNames: [],
    selectedSheet: '',
    headers: [],
    rawRows: [],
    mapping: {}
  };

  function renderImportView() {
    const tableOpts = Object.keys(IMPORT_SCHEMAS).map(t =>
      `<option value="${t}" ${_importState.table === t ? 'selected' : ''}>${t}</option>`
    ).join('');

    const hasRows = _importState.rawRows.length > 0;
    const fields = IMPORT_SCHEMAS[_importState.table];

    document.getElementById('mainContent').innerHTML = `
      <div class="card" style="margin-bottom:16px;">
        <div class="section-header">
          <div>
            <h3>Import Manual Excel / CSV Files</h3>
            <p style="font-size:12px; color:var(--muted);">Upload your existing .xlsx, .xls, or .csv files, map columns, and import directly into Google Sheets.</p>
          </div>
          <button class="btn btn-sm btn-secondary" onclick="downloadImportTemplate()">⬇ Download Sample CSV</button>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>1. Select Target Module</label>
            <select id="impTable" onchange="changeImportTable(this.value)">${tableOpts}</select>
          </div>
          <div class="form-group">
            <label>2. Choose Excel / CSV File (.xlsx, .xls, .csv)</label>
            <input type="file" id="impFile" accept=".xlsx,.xls,.csv" onchange="handleImportFile(this.files[0])">
          </div>
        </div>

        ${_importState.sheetNames.length > 1 ? `
          <div class="form-group">
            <label>Select Excel Sheet Tab</label>
            <select onchange="loadExcelSheet(this.value)">
              ${_importState.sheetNames.map(s => `<option value="${esc(s)}" ${s === _importState.selectedSheet ? 'selected' : ''}>${esc(s)}</option>`).join('')}
            </select>
          </div>
        ` : ''}
      </div>

      ${hasRows ? `
        <div class="card" style="margin-bottom:16px;">
          <div class="section-header">
            <h3>3. Match Columns (${_importState.rawRows.length} rows detected)</h3>
            <button class="btn btn-primary" onclick="executeImport()">📥 Import ${_importState.rawRows.length} Rows to ${esc(_importState.table)}</button>
          </div>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px;">
            ${fields.map(f => `
              <div class="form-group" style="margin-bottom:0;">
                <label>${esc(f)}</label>
                <select onchange="_importState.mapping['${esc(f)}']=this.value">
                  <option value="">-- Skip / Leave Blank --</option>
                  ${_importState.headers.map(h => `<option value="${esc(h)}" ${_importState.mapping[f] === h ? 'selected' : ''}>${esc(h)}</option>`).join('')}
                </select>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="card">
          <h3 style="margin-bottom:10px;">Preview (First 5 Rows)</h3>
          <div class="table-wrap">
            <table>
              <thead><tr>${_importState.headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
              <tbody>
                ${_importState.rawRows.slice(0, 5).map(r => `
                  <tr>${_importState.headers.map(h => `<td>${esc(r[h])}</td>`).join('')}</tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      ` : ''}
    `;
  }

  function changeImportTable(tbl) {
    _importState.table = tbl;
    autoMapColumns();
    renderImportView();
  }

  function handleImportFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        if (typeof XLSX !== 'undefined') {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
          _importState.workbook = wb;
          _importState.sheetNames = wb.SheetNames;
          loadExcelSheet(wb.SheetNames[0]);
        } else {
          // Offline fallback for CSV only
          const text = new TextDecoder().decode(e.target.result);
          const lines = text.split(/\r?\n/).filter(l => l.trim());
          const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
          const rows = lines.slice(1).map(l => {
            const cols = l.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            const obj = {};
            headers.forEach((h, i) => { obj[h] = cols[i] || ''; });
            return obj;
          });
          _importState.workbook = null;
          _importState.sheetNames = [];
          _importState.headers = headers;
          _importState.rawRows = rows;
          autoMapColumns();
          renderImportView();
        }
      } catch (err) {
        showToast('Could not read file: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function loadExcelSheet(sheetName) {
    _importState.selectedSheet = sheetName;
    const sheet = _importState.workbook.Sheets[sheetName];
    const json = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
    _importState.rawRows = json;
    _importState.headers = json.length ? Object.keys(json[0]) : [];
    autoMapColumns();
    renderImportView();
  }

  function autoMapColumns() {
    const fields = IMPORT_SCHEMAS[_importState.table];
    const map = {};
    fields.forEach(f => {
      const fl = f.toLowerCase();
      const match = _importState.headers.find(h => {
        const hl = h.toLowerCase().replace(/[^a-z0-9]/g, '');
        return hl === fl || hl.includes(fl) || fl.includes(hl);
      });
      map[f] = match || '';
    });
    _importState.mapping = map;
  }

  async function executeImport() {
    const fields = IMPORT_SCHEMAS[_importState.table];
    const mapped = _importState.rawRows.map(r => {
      const obj = {};
      fields.forEach(f => {
        const src = _importState.mapping[f];
        obj[f] = src ? r[src] : '';
      });
      return obj;
    });

    const res = await gas('importRecords', _importState.table, mapped);
    showToast(`Successfully imported ${res.imported} rows into ${_importState.table}!`);
    _importState.rawRows = [];
    _importState.headers = [];
    _importState.sheetNames = [];
    await refreshData();
  }

  function downloadImportTemplate() {
    const fields = IMPORT_SCHEMAS[_importState.table];
    const csv = fields.join(',') + '\n';
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = _importState.table + '_Template.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  /* ==========================================================================
   * Table Search Helper
   * ======================================================================== */

  let _filterTimer = null;
  function filterTable(tableId, query) {
    if (_filterTimer) cancelAnimationFrame(_filterTimer);
    _filterTimer = requestAnimationFrame(() => {
      const q = query.toLowerCase();
      const rows = document.querySelectorAll('#' + tableId + ' tbody tr');
      rows.forEach(tr => {
        tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    });
  }
</script>
