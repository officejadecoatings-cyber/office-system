<script>
  const state = {
    user: null,
    view: 'dashboard',
    invTab: 'invoices',
    outTab: 'debtors',
    empTab: 'directory',
    attTab: 'attendance',
    data: {
      settings: {},
      users: [],
      customers: [],
      inventory: [],
      invoices: [],
      invoiceItems: [],
      creditors: [],
      pettyCash: [],
      callReports: [],
      projectReports: [],
      painterQuotations: [],
      painterBillBalances: [],
      employees: [],
      customTabs: [],
      customTabRows: [],
      transactions: [],
      attendance: [],
      leaves: [],
      tasks: [],
      savedReports: [],
      companyProfiles: [],
      quotations: [],
      today: ''
    }
  };

  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxbtdlTd49UX0xd9WCu6gDao16cyHWZZld0bd-mx9LA9kYEc-LyqJc0Knuv1KtxuwfOnA/exec';
  const CACHE_KEY_DATA = 'JADE_OFFICE_DATA_CACHE';
  const CACHE_KEY_USER = 'JADE_OFFICE_USER_CACHE';

  /* ==========================================================================
   * Tab Access Control (Role & User-based visibility)
   * - "Rashini Fernando": sees ONLY 3 tabs (Call Report, Project Report, Petty Cash). All other tabs hidden.
   * - "Shihani Nuwanthi": sees Call Report, Project Report, Petty Cash PLUS standard tabs.
   * - Other users (Admin, Staff, etc.): Call Report, Project Report, and Petty Cash are hidden.
   * ======================================================================== */

  function isRashiniFernando() {
    if (!state.user) return false;
    const norm = (state.user.Name || '').toLowerCase().replace(/\s+/g, ' ').trim();
    const emailNorm = (state.user.Email || '').toLowerCase().trim();
    return norm === 'rashini fernando' || emailNorm === 'staff2@office.local';
  }

  function isShihaniNuwanthi() {
    if (!state.user || !state.user.Name) return false;
    const norm = state.user.Name.toLowerCase().replace(/\s+/g, ' ').trim();
    return norm === 'shihani nuwanthi';
  }

  function isRestrictedReportUser() {
    return isShihaniNuwanthi() || isRashiniFernando();
  }

  function getUserAllowedTabs() {
    if (!state.user) return [];
    if (state.user.Role === 'Admin') return ['all'];
    if (state.user.AllowedTabs) {
      const tabs = state.user.AllowedTabs.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
      if (!tabs.includes('settings')) tabs.push('settings');
      return tabs;
    }
    if (isRashiniFernando()) return ['callreport', 'projectreport', 'pettycash', 'settings'];
    if (isShihaniNuwanthi()) return ['dashboard', 'sales', 'invoices', 'quotation', 'outstanding', 'inventory', 'callreport', 'projectreport', 'pettycash', 'customers', 'companyprofile', 'employees', 'paintertraining', 'reports', 'import', 'settings'];
    if (state.user.Role === 'Manager') return ['dashboard', 'sales', 'invoices', 'quotation', 'outstanding', 'customers', 'employees', 'reports', 'settings'];
    return ['dashboard', 'sales', 'invoices', 'quotation', 'outstanding', 'inventory', 'customers', 'companyprofile', 'employees', 'paintertraining', 'reports', 'import', 'settings'];
  }

  function isTabAllowedForUser(tabName) {
    if (!tabName) return true;
    if (tabName.toLowerCase() === 'settings') return true; // Settings is always accessible for profile & PIN management
    const allowed = getUserAllowedTabs();
    if (allowed.includes('all')) return true;
    return allowed.includes(tabName.toLowerCase());
  }

  function updateRestrictedTabsVisibility() {
    const allowed = getUserAllowedTabs();
    const isAll = allowed.includes('all');

    document.querySelectorAll('.sidebar-nav .nav-item[data-view]').forEach(btn => {
      const v = btn.getAttribute('data-view') || '';
      if (isAll || allowed.includes(v.toLowerCase()) || v.toLowerCase() === 'settings') {
        btn.style.display = '';
      } else {
        btn.style.display = 'none';
      }
    });

    const isRashini = isRashiniFernando();
    const navDividers = document.querySelectorAll('.sidebar-nav .nav-divider');
    navDividers.forEach(el => {
      el.style.display = isRashini ? 'none' : '';
    });
    const customTabsEl = document.getElementById('customSidebarTabs');
    if (customTabsEl) {
      customTabsEl.style.display = isRashini ? 'none' : '';
    }

    if (!isAll && !isTabAllowedForUser(state.view)) {
      const firstAllowed = Array.from(document.querySelectorAll('.sidebar-nav .nav-item[data-view]'))
        .map(b => b.getAttribute('data-view'))
        .find(v => isTabAllowedForUser(v));
      state.view = firstAllowed || 'dashboard';
      document.querySelectorAll('.nav-item').forEach(b => {
        b.classList.toggle('active', b.dataset.view === state.view);
      });
      renderView();
    }
  }

  /* ==========================================================================
   * Supabase Cloud Database Integration Layer (Super-Fast 1000x Engine)
   * - Ultra-fast 20-40ms direct queries and persistent multi-user synchronization.
   * - Provides graceful fallback to Google Apps Script and LocalStorage.
   * ======================================================================== */

  const ACTION_TABLE_MAP = {
    saveCustomer: { table: 'Customers', key: 'CustomerId', prefix: 'CUST', prop: 'customers' },
    deleteCustomer: { table: 'Customers', key: 'CustomerId', prop: 'customers' },
    saveInventoryItem: { table: 'Inventory', key: 'ItemId', prefix: 'ITEM', prop: 'inventory' },
    deleteInventoryItem: { table: 'Inventory', key: 'ItemId', prop: 'inventory' },
    saveInvoice: { table: 'Invoices', key: 'InvoiceId', prefix: 'INV', prop: 'invoices', isInvoice: true },
    deleteInvoice: { table: 'Invoices', key: 'InvoiceId', prop: 'invoices', isInvoice: true },
    saveQuotation: { table: 'Quotations', key: 'QuotationId', prefix: 'QT', prop: 'quotations' },
    deleteQuotation: { table: 'Quotations', key: 'QuotationId', prop: 'quotations' },
    saveCreditor: { table: 'Creditors', key: 'CreditorId', prefix: 'CRED', prop: 'creditors' },
    deleteCreditor: { table: 'Creditors', key: 'CreditorId', prop: 'creditors' },
    savePettyCash: { table: 'PettyCash', key: 'PcId', prefix: 'PC', prop: 'pettyCash' },
    deletePettyCash: { table: 'PettyCash', key: 'PcId', prop: 'pettyCash' },
    saveEmployee: { table: 'Employees', key: 'EmpId', prefix: 'EMP', prop: 'employees' },
    deleteEmployee: { table: 'Employees', key: 'EmpId', prop: 'employees' },
    savePainterParticipant: { table: 'PainterParticipants', key: 'ParticipantId', prefix: 'PART', prop: 'painterParticipants' },
    deletePainterParticipant: { table: 'PainterParticipants', key: 'ParticipantId', prop: 'painterParticipants' },
    savePainterQuotation: { table: 'PainterQuotations', key: 'QuotationId', prefix: 'PQT', prop: 'painterQuotations' },
    deletePainterQuotation: { table: 'PainterQuotations', key: 'QuotationId', prop: 'painterQuotations' },
    savePainterBillBalance: { table: 'PainterBillBalances', key: 'BalanceId', prefix: 'PBB', prop: 'painterBillBalances' },
    deletePainterBillBalance: { table: 'PainterBillBalances', key: 'BalanceId', prop: 'painterBillBalances' },
    saveCompanyProfile: { table: 'CompanyProfiles', key: 'CompanyId', prefix: 'COMP', prop: 'companyProfiles' },
    deleteCompanyProfile: { table: 'CompanyProfiles', key: 'CompanyId', prop: 'companyProfiles' },
    saveCustomTab: { table: 'CustomTabs', key: 'TabId', prefix: 'TAB', prop: 'customTabs' },
    deleteCustomTab: { table: 'CustomTabs', key: 'TabId', prop: 'customTabs' },
    saveCustomTabRow: { table: 'CustomTabRows', key: 'RowId', prefix: 'ROW', prop: 'customTabRows' },
    deleteCustomTabRow: { table: 'CustomTabRows', key: 'RowId', prop: 'customTabRows' },
    saveTransaction: { table: 'Transactions', key: 'TxId', prefix: 'TX', prop: 'transactions' },
    deleteTransaction: { table: 'Transactions', key: 'TxId', prop: 'transactions' },
    saveLeaveRequest: { table: 'Leaves', key: 'LeaveId', prefix: 'LV', prop: 'leaves' },
    deleteLeaveRequest: { table: 'Leaves', key: 'LeaveId', prop: 'leaves' },
    saveTask: { table: 'Tasks', key: 'TaskId', prefix: 'TSK', prop: 'tasks' },
    deleteTask: { table: 'Tasks', key: 'TaskId', prop: 'tasks' },
    saveUser: { table: 'Users', key: 'UserId', prefix: 'USR', prop: 'users' },
    saveSettings: { table: 'Settings', key: 'Key', isSettings: true }
  };

  const DEFAULT_SUPABASE_URL = 'https://ftucnvtpmkftjzoobrfq.supabase.co';
  const DEFAULT_SUPABASE_KEY = 'sb_publishable_T4O1XsAawck_ix9z_acpdA_EWcNkJtR';
  const CURRENT_GAS_URL = 'https://script.google.com/macros/s/AKfycbysvc7x4c0_TFKxpCPI8_p2haPMOSSRwpYYANaE3H2BzFIXD-XD-L8H6vFM-FViRAxTvA/exec';

  const OfficeSupabase = {
    client: null,
    config: {
      url: DEFAULT_SUPABASE_URL,
      key: DEFAULT_SUPABASE_KEY,
      enabled: true
    },

    loadConfig() {
      let cfg = null;
      try {
        cfg = JSON.parse(localStorage.getItem('office_supabase_config') || 'null');
      } catch (e) {}

      if (!cfg || !cfg.url) {
        if (state && state.data && state.data.settings && state.data.settings.SupabaseUrl) {
          cfg = {
            url: state.data.settings.SupabaseUrl,
            key: state.data.settings.SupabaseKey || DEFAULT_SUPABASE_KEY,
            enabled: state.data.settings.UseSupabase !== 'No'
          };
        } else {
          cfg = {
            url: DEFAULT_SUPABASE_URL,
            key: DEFAULT_SUPABASE_KEY,
            enabled: true
          };
        }
      }

      this.config = cfg || { url: DEFAULT_SUPABASE_URL, key: DEFAULT_SUPABASE_KEY, enabled: true };

      if (this.config.url && this.config.key && window.supabase && typeof window.supabase.createClient === 'function') {
        try {
          this.client = window.supabase.createClient(this.config.url, this.config.key);
        } catch (e) {
          console.warn('Supabase client creation error:', e);
        }
      }
      return this.config;
    },

    isReady() {
      if (!this.client) this.loadConfig();
      return !!(this.client && this.config.enabled && this.config.url && this.config.key);
    },

    async testConnection(url, key) {
      if (!window.supabase || typeof window.supabase.createClient !== 'function') {
        return { ok: false, error: 'Supabase JS library is loading. Please check your internet connection.' };
      }
      try {
        const testClient = window.supabase.createClient(url, key);
        const start = Date.now();
        const { data, error } = await testClient.from('Settings').select('Key').limit(1);
        const latency = Date.now() - start;
        if (error) {
          if (error.code === 'PGRST205' || (error.message && error.message.includes('schema cache'))) {
            return { ok: false, isSchemaMissing: true, error: 'Connected to Supabase successfully, but database tables are not created yet! Please click "Copy SQL Schema" and run it in the Supabase SQL Editor.' };
          }
          return { ok: false, error: error.message || JSON.stringify(error) };
        }
        return { ok: true, latency: latency };
      } catch (e) {
        return { ok: false, error: e.message || String(e) };
      }
    },

    async fetchAll() {
      if (!this.isReady()) throw new Error('Supabase not configured');
      const tables = [
        'Settings', 'Users', 'Customers', 'Inventory', 'Invoices', 'InvoiceItems',
        'CompanyProfiles', 'Quotations', 'Creditors', 'PettyCash', 'CallReports',
        'ProjectReports', 'PainterQuotations', 'PainterBillBalances', 'PainterParticipants',
        'Employees', 'CustomTabs', 'CustomTabRows', 'Transactions', 'Attendance',
        'Leaves', 'Tasks', 'SavedReports'
      ];

      const results = await Promise.all(tables.map(t => this.client.from(t).select('*')));
      const out = {};
      tables.forEach((t, i) => {
        const res = results[i];
        if (res.error) console.warn('Supabase fetch error on table ' + t + ':', res.error);
        const rows = res.data || [];
        if (t === 'Settings') {
          const s = {};
          rows.forEach(r => { if (r.Key) s[r.Key] = r.Value; });
          out.settings = s;
        } else {
          const propName = t.charAt(0).toLowerCase() + t.slice(1);
          out[propName] = rows;
        }
      });
      out.today = (typeof todayStr_ === 'function') ? todayStr_() : new Date().toISOString().slice(0, 10);
      return out;
    },

    async upsert(tableName, recordOrArray) {
      if (!this.isReady() || !recordOrArray) return;
      const items = Array.isArray(recordOrArray) ? recordOrArray : [recordOrArray];
      const cleaned = items.map(record => {
        const clean = {};
        Object.keys(record).forEach(k => {
          if (record[k] !== undefined && typeof record[k] !== 'function') {
            clean[k] = record[k] === null ? '' : String(record[k]);
          }
        });
        return clean;
      });
      const { data, error } = await this.client.from(tableName).upsert(cleaned);
      if (error) {
        console.error('Supabase upsert error on ' + tableName + ':', error);
        throw new Error(error.message || 'Supabase upsert failed');
      }
      return data;
    },

    async delete(tableName, keyField, keyValue) {
      if (!this.isReady() || !keyValue) return;
      const { data, error } = await this.client.from(tableName).delete().eq(keyField, String(keyValue));
      if (error) {
        console.error('Supabase delete error on ' + tableName + ':', error);
        throw new Error(error.message || 'Supabase delete failed');
      }
      return data;
    },

    async handleAction(fnName, args) {
      const mapping = ACTION_TABLE_MAP[fnName];
      if (!mapping) return null;

      const isDelete = fnName.startsWith('delete') || fnName.startsWith('remove');
      const payload = args[0];

      if (isDelete) {
        const idVal = args[0] !== undefined ? args[0] : (payload && payload[mapping.key]);
        if (mapping.isInvoice) {
          await Promise.all([
            this.delete('Invoices', 'InvoiceId', idVal),
            this.delete('InvoiceItems', 'InvoiceId', idVal)
          ]);
        } else {
          await this.delete(mapping.table, mapping.key, idVal);
        }
        if (state && state.data && mapping.prop && Array.isArray(state.data[mapping.prop])) {
          state.data[mapping.prop] = state.data[mapping.prop].filter(x => String(x[mapping.key]) !== String(idVal));
          try { localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(state.data)); } catch (e) {}
        }
        return true;
      }

      if (mapping.isSettings) {
        if (payload && typeof payload === 'object') {
          const sRows = Object.keys(payload).map(k => ({ Key: k, Value: String(payload[k] || '') }));
          if (sRows.length > 0) await this.upsert('Settings', sRows);
          if (state && state.data) {
            state.data.settings = state.data.settings || {};
            Object.assign(state.data.settings, payload);
            try { localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(state.data)); } catch (e) {}
          }
        }
        return true;
      }

      if (mapping.isInvoice) {
        const inv = payload.invoice || payload;
        inv.InvoiceId = inv.InvoiceId || (mapping.prefix + '-' + Date.now() + '-' + Math.floor(Math.random() * 1000));
        await this.upsert('Invoices', inv);

        if (payload.items && Array.isArray(payload.items) && payload.items.length > 0) {
          const items = payload.items.map(it => ({
            ...it,
            LineId: it.LineId || ('LINE-' + Date.now() + '-' + Math.floor(Math.random() * 1000)),
            InvoiceId: inv.InvoiceId
          }));
          await this.upsert('InvoiceItems', items);
          if (state && state.data) {
            state.data.invoiceItems = (state.data.invoiceItems || []).filter(x => x.InvoiceId !== inv.InvoiceId).concat(items);
          }
        }

        if (state && state.data) {
          state.data.invoices = state.data.invoices || [];
          const idx = state.data.invoices.findIndex(x => x.InvoiceId === inv.InvoiceId);
          if (idx !== -1) state.data.invoices[idx] = inv;
          else state.data.invoices.unshift(inv);
          try { localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(state.data)); } catch (e) {}
        }
        return inv;
      }

      // Standard entity save
      if (payload && typeof payload === 'object') {
        payload[mapping.key] = payload[mapping.key] || (mapping.prefix + '-' + Date.now() + '-' + Math.floor(Math.random() * 1000));
        await this.upsert(mapping.table, payload);

        if (state && state.data && mapping.prop) {
          state.data[mapping.prop] = state.data[mapping.prop] || [];
          const idx = state.data[mapping.prop].findIndex(x => String(x[mapping.key]) === String(payload[mapping.key]));
          if (idx !== -1) state.data[mapping.prop][idx] = payload;
          else state.data[mapping.prop].unshift(payload);
          try { localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(state.data)); } catch (e) {}
        }
        return payload;
      }
      return true;
    },

    async migrateAllFromState(stateData) {
      if (!this.isReady()) throw new Error('Supabase client is not configured or connected.');
      if (typeof ensureDataDefaults === 'function') ensureDataDefaults();

      const map = [
        { t: 'Users', d: stateData.users || [] },
        { t: 'Customers', d: stateData.customers || [] },
        { t: 'Inventory', d: stateData.inventory || [] },
        { t: 'Invoices', d: stateData.invoices || [] },
        { t: 'InvoiceItems', d: stateData.invoiceItems || [] },
        { t: 'CompanyProfiles', d: stateData.companyProfiles || [] },
        { t: 'Quotations', d: stateData.quotations || [] },
        { t: 'Creditors', d: stateData.creditors || [] },
        { t: 'PettyCash', d: stateData.pettyCash || [] },
        { t: 'CallReports', d: stateData.callReports || [] },
        { t: 'ProjectReports', d: stateData.projectReports || [] },
        { t: 'PainterQuotations', d: stateData.painterQuotations || [] },
        { t: 'PainterBillBalances', d: stateData.painterBillBalances || [] },
        { t: 'PainterParticipants', d: stateData.painterParticipants || [] },
        { t: 'Employees', d: stateData.employees || [] },
        { t: 'CustomTabs', d: stateData.customTabs || [] },
        { t: 'CustomTabRows', d: stateData.customTabRows || [] },
        { t: 'Transactions', d: stateData.transactions || [] },
        { t: 'Attendance', d: stateData.attendance || [] },
        { t: 'Leaves', d: stateData.leaves || [] },
        { t: 'Tasks', d: stateData.tasks || [] },
        { t: 'SavedReports', d: stateData.savedReports || [] }
      ];

      let totalMigrated = 0;
      const summary = [];

      if (stateData.settings) {
        const sRows = Object.keys(stateData.settings).map(k => ({ Key: k, Value: String(stateData.settings[k] || '') }));
        if (sRows.length > 0) {
          await this.upsert('Settings', sRows);
          summary.push(`Settings: ${sRows.length}`);
          totalMigrated += sRows.length;
        }
      }

      for (const item of map) {
        if (item.d && item.d.length > 0) {
          const chunk = 50;
          for (let i = 0; i < item.d.length; i += chunk) {
            const slice = item.d.slice(i, i + chunk);
            await this.upsert(item.t, slice);
          }
          summary.push(`${item.t}: ${item.d.length}`);
          totalMigrated += item.d.length;
        }
      }
      return { total: totalMigrated, summary: summary };
    }
  };

  function backgroundSyncToGas(fnName, args) {
    try {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(() => {})
          .withFailureHandler(err => console.warn('Background GAS sync warning:', err))[fnName](...args);
      } else {
        fetch(CURRENT_GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: fnName, args: args })
        }).catch(err => console.warn('Background GAS fetch warning:', err));
      }
    } catch (e) {
      console.warn('Background sync error:', e);
    }
  }

  function callGasDirect(fnName, args) {
    document.getElementById('loadingBar')?.classList.remove('hidden');
    return new Promise((resolve, reject) => {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(res => {
            document.getElementById('loadingBar')?.classList.add('hidden');
            resolve(res);
          })
          .withFailureHandler(err => {
            document.getElementById('loadingBar')?.classList.add('hidden');
            const msg = err && err.message ? err.message : String(err);
            showToast('Error: ' + msg);
            reject(err);
          })[fnName](...args);
      } else {
        fetch(CURRENT_GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: fnName, args: args })
        })
        .then(r => r.json())
        .then(res => {
          document.getElementById('loadingBar')?.classList.add('hidden');
          if (res && res.ok) {
            resolve(res.result !== undefined ? res.result : res.data);
          } else {
            const err = new Error(res && res.error ? res.error : 'Unknown backend error');
            showToast('Error: ' + err.message);
            reject(err);
          }
        })
        .catch(err => {
          document.getElementById('loadingBar')?.classList.add('hidden');
          showToast('Network error: ' + err.message);
          reject(err);
        });
      }
    });
  }

  function gas(fnName, ...args) {
    if (typeof OfficeSupabase !== 'undefined' && OfficeSupabase.isReady()) {
      if (fnName === 'getAppData') {
        return OfficeSupabase.fetchAll()
          .then(data => {
            backgroundSyncToGas(fnName, args);
            return data;
          })
          .catch(err => {
            console.warn('Supabase fetch failed, falling back to GAS:', err);
            return callGasDirect(fnName, args);
          });
      }

      if (ACTION_TABLE_MAP[fnName]) {
        return OfficeSupabase.handleAction(fnName, args)
          .then(result => {
            backgroundSyncToGas(fnName, args);
            return result;
          })
          .catch(err => {
            console.warn('Supabase action error, falling back to GAS:', err);
            return callGasDirect(fnName, args);
          });
      }
    }

    return callGasDirect(fnName, args);
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
  }

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtMoney(num) {
    const cur = state.data.settings.Currency || 'LKR';
    const val = Number(num || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return cur + ' ' + val;
  }

  function toggleSidebar(open) {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const isOpen = open !== undefined ? !!open : !sidebar.classList.contains('open');
    sidebar.classList.toggle('open', isOpen);
    if (overlay) overlay.classList.toggle('hidden', !isOpen);
  }

  function openModal(title, bodyHtml, footerHtml, large = false) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modalFooter').innerHTML = footerHtml || '';
    document.getElementById('modalBox').classList.toggle('modal-lg', !!large);
    const backdrop = document.getElementById('modalBackdrop');
    backdrop.classList.remove('hidden');
    document.body.classList.add('modal-open');
    if (!backdrop._hasClickListener) {
      backdrop._hasClickListener = true;
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) closeModal();
      });
    }
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.add('hidden');
    document.body.classList.remove('modal-open');
  }

  /* ==========================================================================
   * PDF Export Helper
   * ======================================================================== */

  function exportElementPdf(elementIdOrSelector, filename = 'document.pdf', orientation = 'auto') {
    const el = typeof elementIdOrSelector === 'string'
      ? (document.getElementById(elementIdOrSelector) || document.querySelector(elementIdOrSelector))
      : elementIdOrSelector;
    if (!el) {
      showToast('Could not find element to export to PDF');
      window.print();
      return;
    }

    if (typeof html2pdf !== 'undefined') {
      showToast('Generating PDF...');
      const width = el.offsetWidth || 800;
      const orient = orientation === 'auto' ? (width > 760 ? 'landscape' : 'portrait') : orientation;
      const opt = {
        margin: [6, 6, 6, 6],
        filename: filename.endsWith('.pdf') ? filename : (filename + '.pdf'),
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, logging: false },
        jsPDF: { unit: 'mm', format: 'a4', orientation: orient }
      };

      html2pdf().set(opt).from(el).save()
        .then(() => {
          showToast('PDF downloaded successfully!');
        })
        .catch(err => {
          console.warn('html2pdf fallback to print:', err);
          window.print();
        });
    } else {
      window.print();
    }
  }

  function printCleanDocument(selector) {
    const el = typeof selector === 'string' ? document.querySelector(selector) : selector;
    if (!el) {
      window.print();
      return;
    }

    let iframe = document.getElementById('_cleanPrintIframe');
    if (iframe) iframe.remove();

    iframe = document.createElement('iframe');
    iframe.id = '_cleanPrintIframe';
    iframe.style.position = 'fixed';
    iframe.style.top = '-9999px';
    iframe.style.left = '-9999px';
    iframe.style.width = '0';
    iframe.style.height = '0';
    iframe.style.border = 'none';
    document.body.appendChild(iframe);

    const doc = iframe.contentWindow.document;
    doc.open();
    doc.write(`
      <!DOCTYPE html>
      <html>
        <head>
          <title></title>
          <style>
            @page {
              size: A4 portrait;
              margin: 8mm 10mm;
            }
            * {
              box-sizing: border-box;
              -webkit-print-color-adjust: exact !important;
              print-color-adjust: exact !important;
            }
            html, body {
              margin: 0;

            }

          ${el.outerHTML}

      </html>
    `);
    doc.close();

    setTimeout(() => {

  function verifyPinAndExecute(actionTitle, onConfirmed) {
    const modalHtml = `
      <div style="padding:4px 0;">
        <div style="color:var(--danger); font-size:14px; font-weight:700; margin-bottom:10px;">
          ⚠️ Security Check: PIN Verification Required
        </div>
        <p style="margin-bottom:14px; font-size:13px; color:var(--text);">
          To <b>${esc(actionTitle)}</b>, please enter your login PIN / Password below to confirm:
        </p>
        <div class="form-group" style="margin-bottom:8px;">
          <label style="font-weight:700;">Your Login PIN / Password *</label>
          <input type="password" id="deleteConfirmPin" placeholder="Enter your PIN..." style="font-size:16px; letter-spacing:3px; max-width:280px;" autocomplete="off" autofocus>
        </div>
        <div id="deleteConfirmError" style="color:var(--danger); font-size:12px; font-weight:700; min-height:18px;"></div>
      </div>
    `;

    openModal(
      'Confirm Deletion',
      modalHtml,
      `
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger" id="deleteConfirmSubmitBtn">Verify &amp; Delete</button>
      `
    );

    setTimeout(() => {
      const inp = document.getElementById('deleteConfirmPin');
      if (inp) {
        inp.focus();
        inp.onkeydown = (e) => {
          if (e.key === 'Enter') document.getElementById('deleteConfirmSubmitBtn')?.click();
        };
      }
    }, 120);

    document.getElementById('deleteConfirmSubmitBtn').onclick = async () => {
      const pin = document.getElementById('deleteConfirmPin')?.value.trim();
      const errEl = document.getElementById('deleteConfirmError');
      const btn = document.getElementById('deleteConfirmSubmitBtn');
      if (!pin) {
        if (errEl) errEl.textContent = 'Please enter your login PIN/Password.';
        return;
      }

      const currentUserId = state.user?.UserId;
      if (!currentUserId) {
        if (errEl) errEl.textContent = 'Session error. Please log in again.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Verifying PIN...';
      if (errEl) errEl.textContent = '';

      try {
        await gas('authenticateUser', currentUserId, pin);
        closeModal();
        showToast('PIN verified. Processing deletion...');
        await onConfirmed();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Verify & Delete';
        if (errEl) errEl.textContent = 'Incorrect PIN / Password. Deletion cancelled.';
      }
    };
  }

  window.addEventListener('DOMContentLoaded', async () => {
    // 1. Instant cache load from localStorage (0ms load time!)
    try {
      const cachedUserStr = localStorage.getItem(CACHE_KEY_USER);
      const cachedDataStr = localStorage.getItem(CACHE_KEY_DATA);
      if (cachedUserStr && cachedDataStr) {
        const cachedUser = JSON.parse(cachedUserStr);
        const cachedData = JSON.parse(cachedDataStr);
        if (cachedUser && cachedData && cachedData.settings) {
          state.user = cachedUser;
          state.data = cachedData;
        ensureDataDefaults();
          document.getElementById('loginView').classList.add('hidden');
          document.getElementById('appShell').classList.remove('hidden');
          document.getElementById('sidebarUser').textContent = cachedUser.Name || 'User';
          document.getElementById('sidebarRole').textContent = cachedUser.Role || 'Staff';
          document.getElementById('brandName').textContent = cachedData.settings.CompanyName || 'Jade Coatings';
          renderCustomSidebarTabs();
          updateRestrictedTabsVisibility();
          renderTopbarClock();
          renderView();
          startAutoSync();
          // Silently refresh fresh data from backend in background without freezing UI
          setTimeout(() => { refreshData(false, /* silent */ true); }, 150);
          return;
        }
      }
    } catch (e) {
      console.warn('Cache load error:', e);
    }

    // 2. Populate login users instantly from cache (0ms perceived load time!)
    try {
      const cachedUsersStr = localStorage.getItem('cached_login_users_v1');
      if (cachedUsersStr) {
        const cachedUsers = JSON.parse(cachedUsersStr);
        const sel = document.getElementById('loginUser');
        if (sel && cachedUsers && cachedUsers.length) {
          sel.innerHTML = cachedUsers.map(u => `<option value="${esc(u.UserId)}">${esc(u.Name)} (${esc(u.Role)})</option>`).join('');
        }
      }
    } catch (e) {}

    // Fetch and update login users in background
    gas('getLoginUsers').then(users => {
      const sel = document.getElementById('loginUser');
      if (sel && users && users.length) {
        sel.innerHTML = users.map(u => `<option value="${esc(u.UserId)}">${esc(u.Name)} (${esc(u.Role)})</option>`).join('');
        try { localStorage.setItem('cached_login_users_v1', JSON.stringify(users)); } catch (e) {}
      }
    }).catch(e => console.warn('Login users fetch error:', e));

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const userId = document.getElementById('loginUser').value;
      const pin = document.getElementById('loginPin').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const origText = submitBtn ? submitBtn.textContent : '';
      if (submitBtn) { submitBtn.textContent = 'Logging in...'; submitBtn.disabled = true; }

      try {
        const res = await gas('authenticateUser', userId, pin);
        state.user = res.user || res;
        try { localStorage.setItem(CACHE_KEY_USER, JSON.stringify(state.user)); } catch (e) {}

        if (res.data) {
          state.data = res.data;
          try { localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(state.data)); } catch (e) {}
          document.getElementById('brandName').textContent = state.data.settings?.CompanyName || 'Jade Coatings';
          renderCustomSidebarTabs();
          renderTopbarClock();
          renderView();
        } else {
          await refreshData();
        }

        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('appShell').classList.remove('hidden');
        document.getElementById('sidebarUser').textContent = state.user.Name;
        document.getElementById('sidebarRole').textContent = state.user.Role;
        updateRestrictedTabsVisibility();
        startAutoSync();
      } catch (err) {
        showToast('Login failed: ' + (err.message || 'Invalid PIN'));
      } finally {
        if (submitBtn) { submitBtn.textContent = origText; submitBtn.disabled = false; }
      }
    });
  });

  async function refreshData(backupToDrive = false, silent = false) {
    if (backupToDrive) {
      try { await gas('autoSyncDriveBackup'); } catch (e) {}
    }
    try {
      let data = null;
      if (typeof OfficeSupabase !== 'undefined' && OfficeSupabase.isReady()) {
        try {
          data = await OfficeSupabase.fetchAll();
        } catch (err) {
          console.warn('Supabase fetch failed, falling back to GAS:', err);

      }
      if (!data) {
        data = await gas('getAppData');
      }
      state.data = data;
      ensureDataDefaults();
      try { localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(data)); } catch (e) {}
      if (data.settings) {
        document.getElementById('brandName').textContent = data.settings.CompanyName || 'Jade Coatings';
      }
      renderCustomSidebarTabs();
      updateRestrictedTabsVisibility();
      renderTopbarClock();
      renderView();

  function daysBetween(dateStr, refDateStr) {
    if (!dateStr) return 0;
    const d1 = new Date(dateStr);
    const d2 = new Date(refDateStr || state.data.today || new Date().toISOString().slice(0, 10));
    if (isNaN(d1) || isNaN(d2)) return 0;
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
  }

  function getCustomerOverdueInfo(customerId) {
    if (!customerId) return { blocked: false, maxDays: 0, balance: 0, overdueInvoices: [], overdueBalance: 0 };
    const unpaid = (state.data.invoices || []).filter(i =>
      i.CustomerId === customerId &&
      i.Status !== 'Paid' && i.Status !== 'Cancelled' && i.Status !== 'Draft' && i.Status !== 'Free Issue' &&
      (Number(i.Total || 0) - Number(i.PaidAmount || 0)) > 0
    );
    let maxDays = 0;
    let balance = 0;
    let overdueBalance = 0;
    const overdueInvoices = [];

    unpaid.forEach(i => {
      const bal = Number(i.Total || 0) - Number(i.PaidAmount || 0);
      balance += bal;
      const d = daysBetween(i.DueDate || i.Date, state.data.today);
      if (d > 0) {
        overdueBalance += bal;
        overdueInvoices.push({
          invoiceNo: i.InvoiceNo || 'INV',
          dueDate: i.DueDate || i.Date,
          daysOverdue: d,
          balance: bal
        });
      }
      if (d > maxDays) maxDays = d;
    });

    // Block customer from new invoices if payment was not made before the due date (d > 0)
    const blocked = overdueInvoices.length > 0;
    return { blocked, maxDays, balance, overdueBalance, overdueInvoices };
  }

  function numberToWords(num) {
    if (num === 0 || isNaN(num)) return 'Zero Only';
    const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
      'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
    const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

    function toWords(n) {
      if (n === 0) return '';
      if (n < 20) return a[n] + ' ';
      if (n < 100) return b[Math.floor(n / 10)] + (n % 10 ? ' ' + a[n % 10] : '') + ' ';
      if (n < 1000) return a[Math.floor(n / 100)] + ' Hundred ' + toWords(n % 100);
      if (n < 1000000) return toWords(Math.floor(n / 1000)) + 'Thousand ' + toWords(n % 1000);
      if (n < 1000000000) return toWords(Math.floor(n / 1000000)) + 'Million ' + toWords(n % 1000000);
      return toWords(Math.floor(n / 1000000000)) + 'Billion ' + toWords(n % 1000000000);
    }

    const parts = Number(num).toFixed(2).split('.');
    const whole = parseInt(parts[0], 10);
    const cents = parseInt(parts[1], 10);

    let str = toWords(whole).trim();
    if (!str) str = 'Zero';
    if (cents > 0) {
      str += ' and Cents ' + toWords(cents).trim();
    }
    return str + ' Only';
  }

  function fmtInvoiceDate(dStr) {
    if (!dStr) return '';
    const d = new Date(dStr);
    if (isNaN(d)) return dStr;
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const yyyy = d.getFullYear();
    return `${mm}/${dd}/${yyyy}`;
  }

    const now = new Date();

    const d = String(now.getDate()).padStart(2, '0');
    const todayStr = `${y}-${m}-${d}`;

    if (preset === 'thisMonth') {
      _mgrSalesState.start = `${y}-${m}-01`;
      _mgrSalesState.end = todayStr;
    } else if (preset === 'last30') {
      const past = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
      _mgrSalesState.start = past.toISOString().slice(0, 10);
      _mgrSalesState.end = todayStr;
    } else if (preset === 'thisYear') {
      _mgrSalesState.start = `${y}-01-01`;
      _mgrSalesState.end = todayStr;

      _mgrSalesState.start = '';

  function cleanDataRedundancy(data) {
    if (!data || typeof data !== 'object') return data;
    const dedupe = (arr, keyFn) => {
      if (!Array.isArray(arr)) return [];
      const seen = new Set();
      const res = [];
      for (let i = 0; i < arr.length; i++) {
        const item = arr[i];
        if (!item) continue;
        const key = keyFn(item);
        if (key && seen.has(key)) continue;
        if (key) seen.add(key);
        res.push(item);
      }
      return res;
    };

    if (Array.isArray(data.employees)) {
      data.employees = dedupe(data.employees, e => (e.NIC || e.EmployeeId || e.Email || '').toString().trim().toLowerCase());
    }
    if (Array.isArray(data.users)) {
      data.users = dedupe(data.users, u => (u.UserId || u.Email || '').toString().trim().toLowerCase());
    }
    if (Array.isArray(data.companyProfiles)) {
      data.companyProfiles = dedupe(data.companyProfiles, c => (c.CompanyId || c.CompanyName || '').toString().trim().toLowerCase());
    }
    if (Array.isArray(data.inventory)) {
      data.inventory = dedupe(data.inventory, it => (it.ItemId || it.SKU || it.ItemName || '').toString().trim().toLowerCase());
    }
    if (Array.isArray(data.invoices)) {
      data.invoices = dedupe(data.invoices, inv => (inv.InvoiceId || inv.InvoiceNo || '').toString().trim().toLowerCase());
    }
    if (Array.isArray(data.customers)) {
      data.customers = dedupe(data.customers, c => (c.CustomerId || c.Name || '').toString().trim().toLowerCase());
    }
    if (Array.isArray(data.quotations)) {
      data.quotations = dedupe(data.quotations, q => (q.QuotationId || q.QuoteNo || '').toString().trim().toLowerCase());
    }
    if (Array.isArray(data.painterParticipants)) {
      data.painterParticipants = dedupe(data.painterParticipants, p => (p.ParticipantId || '').toString().trim().toLowerCase());
    }
    return data;
  }

  function onInvQuoteSelectChange(quotIdOrNo) {
    if (!quotIdOrNo) return;
    const q = (state.data.quotations || []).find(x => x.QuotationId === quotIdOrNo || x.QuotationNo === quotIdOrNo);
    if (!q) return;

    const qNo = q.QuotationNo || q.QuotationId;
    const quoteInput = document.getElementById('fInvQuote');
    if (quoteInput) quoteInput.value = qNo;

    let parsed = {};
    if (q.DataJson) {
      try { parsed = JSON.parse(q.DataJson); } catch (e) {}
    }

    // 1. Company Profile
    const compId = q.CompanyId || parsed.CompanyId;
    if (compId) {
      const compEl = document.getElementById('fInvCompany');
      if (compEl) {
        compEl.value = compId;
        onInvCompanyChange();
      }
    }

    // 2. Customer
    const custId = q.CustomerId || parsed.CustomerId;
    if (custId) {
      selectInvCust(custId);
    } else if (q.CustomerName || parsed.CustomerName) {
      const custInputEl = document.getElementById('fInvCustInput');
      const custAddrEl = document.getElementById('fInvCustAddr');
      if (custInputEl) custInputEl.value = q.CustomerName || parsed.CustomerName;
      if (custAddrEl) custAddrEl.value = q.BillingAddress || parsed.BillingAddress || '';
    }

    // 3. Sales Person
    const sp = q.SalesPerson || parsed.SalesPerson;
    if (sp) {
      selectInvSP(sp);
    }

    // 4. Line Items
    const items = parsed.Items || q.Items || [];
    if (items.length > 0) {
      _invLines = items.map(it => ({
        ItemId: it.ItemId || '',
        ItemCode: it.ItemCode || '',
        ItemName: it.Description || it.ItemName || '',
        Qty: Number(it.Qty || it.Quantity || 1),
        UnitPrice: Number(it.UnitPrice || 0),
        DiscountPercent: Number(it.Discount || 0),
        LineTotal: Number(it.Amount || it.Total || 0)
      }));
      renderInvLines();
      updateInvTotals();
    }

    // 5. Notes / Terms
    if (q.Description || parsed.Description || parsed.Notes) {
      const notesEl = document.getElementById('fInvNotes');
      if (notesEl && !notesEl.value) {
        notesEl.value = q.Description || parsed.Description || parsed.Notes || '';
      }
    }

    showToast('Auto-filled from Quotation ' + qNo);
  }

  function renderInvCustList(filterText = '') {
    const menu = document.getElementById('invCustMenu');
    if (!menu) return;
    const lower = filterText.toLowerCase().trim();
    const list = (state.data.customers || []).filter(c => {
      if (!lower) return true;
      const text = `${c.CustomerCode || ''} ${c.Name || ''} ${c.Company || ''} ${c.Phone || ''}`.toLowerCase();
      return text.includes(lower);
    });

    if (list.length === 0) {
      menu.innerHTML = '<div style="padding:10px 12px; font-size:12.5px; color:#94a3b8; text-align:center;">No matching customers found</div>';
      return;
    }

    menu.innerHTML = list.map(c => {
      const codeStr = c.CustomerCode ? `<span style="font-weight:700; color:#0f766e; margin-right:6px;">${esc(c.CustomerCode)}</span>` : '';
      const compStr = c.Company ? ` <span style="color:#64748b; font-size:12px;">(${esc(c.Company)})</span>` : '';
      return `
        <div onclick="selectInvCust('${esc(c.CustomerId)}')" style="padding:8px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='#fff'">
          <div>${codeStr}<b>${esc(c.Name)}</b>${compStr}</div>
          <div style="font-size:11.5px; color:#94a3b8;">${esc(c.Phone || '')}</div>
        </div>
      `;
    }).join('');
  }

  function selectInvCust(custId) {
    const cust = (state.data.customers || []).find(c => c.CustomerId === custId);
    if (cust) {
      const inputEl = document.getElementById('fInvCustInput');
      const idEl = document.getElementById('fInvCustId');
      const addrEl = document.getElementById('fInvCustAddr');
      const phoneEl = document.getElementById('fInvCustPhone');
      const displayName = `${cust.CustomerCode ? cust.CustomerCode + ' ' : ''}${cust.Name}`;
      if (inputEl) inputEl.value = displayName;
      if (idEl) idEl.value = cust.CustomerId;
      if (addrEl) {
        addrEl.value = cust.BillingAddress || cust.DeliveryAddress || '';
      }
      if (phoneEl) {
        phoneEl.value = cust.Phone || '';
      }

      // If customer has an assigned Sales Officer, auto-fill Sales Person if currently blank
      if (cust.SalesOfficerId) {
        const spEmp = (state.data.employees || []).find(e => e.EmpId === cust.SalesOfficerId);
        const spName = spEmp ? spEmp.Name : cust.SalesOfficerId;
        const spInput = document.getElementById('fInvSPInput');
        const spHidden = document.getElementById('fInvSP');
        if (spInput && !spInput.value && spName) {
          spInput.value = spName;
          if (spHidden) spHidden.value = spName;
        }
      }

      checkInvCustomerBlock(cust.CustomerId);
    }
    const menu = document.getElementById('invCustMenu');
    if (menu) menu.classList.add('hidden');
  }

  function getSalesPersonsList() {
    const list = [];
    const added = new Set();

    // Strictly ONLY employees registered as Sales Officer in the Employee Directory (Requirement 4)
    (state.data.employees || []).forEach(e => {
      if (e.Status === 'Inactive') return;
      const pos = String(e.Position || '').trim().toLowerCase();
      const desig = String(e.Designation || '').trim().toLowerCase();
      const isSalesOfficer = pos === 'sales officer' || desig === 'sales officer' || pos.includes('sales') || desig.includes('sales');
      if (isSalesOfficer) {
        const name = (e.Name || '').trim();
        if (name && !added.has(name.toLowerCase())) {
          added.add(name.toLowerCase());
          list.push({
            EmpId: e.EmpId,
            Name: name,
            Code: e.EmpCode || e.EmpId || '',
            Designation: e.Designation || e.Position || 'Sales Officer'
          });
        }
      }
    });

    return list;
  }

  function updateInvTotals() {
    let sub = 0;
    _invLines.forEach((l, idx) => {
      const lineSub = Number(l.Qty || 0) * Number(l.UnitPrice || 0);
      const lineDisc = lineSub * ((Number(l.DiscountPercent) || 0) / 100);
      const lineTotal = Math.round((lineSub - lineDisc) * 100) / 100;
      l.LineTotal = lineTotal;
      sub += lineTotal;
      const ltEl = document.getElementById('invLineTotal_' + idx);
      if (ltEl) ltEl.textContent = fmtMoney(lineTotal);
    });

    const disc = Number(document.getElementById('fInvDisc')?.value || 0);
    const taxable = Math.max(0, sub - disc);
    const taxRate = Number(state.data.settings.TaxRate || 0);
    const tax = taxable * (taxRate / 100);
    const total = taxable + tax;
    const paid = Number(document.getElementById('fInvPaid')?.value || 0);
    const bal = Math.max(0, total - paid);
    const previewEl = document.getElementById('invTotalsPreview');
    if (previewEl) {
      previewEl.innerHTML =
        `Subtotal: <b>${fmtMoney(sub)}</b> | Discount: <b>${fmtMoney(disc)}</b> | Tax (${taxRate}%): <b>${fmtMoney(tax)}</b> | Total: <b>${fmtMoney(total)}</b> | Balance: <b style="color:var(--danger)">${fmtMoney(bal)}</b>`;
    }
    return { sub, disc, tax, total, paid };
  }

  async function submitInvoice(invoiceId) {
    const custId = document.getElementById('fInvCustId')?.value || document.getElementById('fInvCust')?.value || '';
    const custName = document.getElementById('fInvCustInput')?.value || '';
    const spVal = document.getElementById('fInvSPInput')?.value || document.getElementById('fInvSP')?.value || '';
    const status = document.getElementById('fInvStatus').value;

    if (status !== 'Free Issue' && status !== 'Draft' && status !== 'Cancelled' && !spVal.trim()) {
      showToast('Please select a registered Sales Person (S.P) for this invoice.');
      document.getElementById('fInvSPInput')?.focus();
      return;
    }

    const info = getCustomerOverdueInfo(custId);

    // Block customer if any unpaid invoice is past the Due Date unless authorized via Login PIN
    if (info.blocked && status !== 'Draft' && status !== 'Cancelled' && status !== 'Free Issue') {
      const pin = document.getElementById('fInvOverridePin')?.value.trim() || '';
      const errEl = document.getElementById('fInvOverridePinError');
      if (!pin) {
        if (errEl) errEl.textContent = 'Login PIN is required to issue invoice for an overdue customer.';
        showToast('Blocked: Customer has unpaid invoices past Due Date. Enter Login PIN to issue!');
        document.getElementById('fInvOverridePin')?.focus();
        return;
      }
      try {
        await gas('authenticateUser', state.user.UserId, pin);
      } catch (e) {
        if (errEl) errEl.textContent = 'Invalid Login PIN / Password. Invoice blocked.';
        showToast('Invalid Login PIN! Override blocked.');
        return;
      }
    }

    const cust = state.data.customers.find(c => c.CustomerId === custId);
    const { sub, disc, tax, total, paid } = updateInvTotals();
    const existing = invoiceId ? state.data.invoices.find(i => i.InvoiceId === invoiceId) : null;
    const finalPaid = status === 'Paid' ? total : (status === 'Free Issue' ? 0 : paid);

    const payload = {
      invoice: {
        InvoiceId: invoiceId || '',
        InvoiceNo: existing ? existing.InvoiceNo : '',
        CompanyId: document.getElementById('fInvCompany')?.value || '',
        CustomerId: custId,
        CustomerName: custName || (cust ? cust.Name : (custId ? 'Customer' : 'Walk-in Customer')),
        CustomerAddress: document.getElementById('fInvCustAddr')?.value || (cust ? (cust.BillingAddress || cust.DeliveryAddress || '') : ''),
        CustomerPhone: document.getElementById('fInvCustPhone')?.value || (cust ? (cust.Phone || '') : ''),
        QuoteNo: document.getElementById('fInvQuote')?.value || '',
        SalesPerson: spVal,
        BankDetails: document.getElementById('fInvBank')?.value || '',
        Date: document.getElementById('fInvDate').value,
        DueDate: document.getElementById('fInvDue').value,
        Status: status,
        Subtotal: sub,
        Discount: disc,
        TaxAmount: tax,
        Total: total,
        PaidAmount: finalPaid,
        Notes: document.getElementById('fInvNotes').value,
        CreatedBy: state.user.Name
      },
      items: _invLines.filter(l => (l.ItemName || '').trim() !== '').map(l => ({
        ItemId: l.ItemId || '',
        ItemCode: l.ItemCode || '',
        ItemName: l.ItemName || '',
        Qty: Number(l.Qty) || 0,
        UnitPrice: Number(l.UnitPrice) || 0,
        DiscountPercent: Number(l.DiscountPercent) || 0,
        LineTotal: Number(l.LineTotal) || 0
      }))
    };

    // 1. Stock Deduction: Deduct quantities from inventory immediately
    if (status !== 'Draft' && status !== 'Cancelled') {
      payload.items.forEach(li => {
        const invItem = state.data.inventory.find(x => 
          (li.ItemId && x.ItemId === li.ItemId) ||
          (li.ItemCode && x.SKU && String(x.SKU).trim().toLowerCase() === String(li.ItemCode).trim().toLowerCase()) ||
          (li.ItemName && x.Name && String(x.Name).trim().toLowerCase() === String(li.ItemName).trim().toLowerCase())
        );
        if (invItem) {
          invItem.StockQty = Math.max(0, (Number(invItem.StockQty) || 0) - (Number(li.Qty) || 0));
          invItem.UpdatedAt = state.data.today;
        }
      });
    }

    // 2. Increment Next Invoice No in Company Profile & Settings
    if (!invoiceId) {
      const comp = (state.data.companyProfiles || []).find(c => c.CompanyId === payload.invoice.CompanyId);
      if (comp && comp.NextInvoiceNo) {
        const n = parseInt(comp.NextInvoiceNo, 10);
        if (!isNaN(n)) comp.NextInvoiceNo = String(n + 1);
      }
      if (state.data.settings && state.data.settings.NextInvoiceNo) {
        const n = parseInt(state.data.settings.NextInvoiceNo, 10);
        if (!isNaN(n)) state.data.settings.NextInvoiceNo = String(n + 1);
      }
    }

    // 3. Save to Google Apps Script & Update Local Cache
    let assignedInvNo = document.getElementById('fInvNo')?.value.trim();
    if (!assignedInvNo || (!invoiceId && (state.data.invoices || []).some(i => String(i.InvoiceNo || '').trim().toLowerCase() === assignedInvNo.toLowerCase()))) {
      assignedInvNo = generateNextInvoiceNo(payload.invoice.CompanyId);
    }
    payload.invoice.InvoiceNo = assignedInvNo;

    payload.invoice.InvoiceId = invoiceId || '';
    if (status === 'Free Issue') {
      payload.invoice.SalesPerson = '';
      payload.invoice.PaidAmount = 0;
    }

    closeModal();
    showToast(invoiceId ? 'Saving invoice update...' : 'Issuing Sales Invoice...');

    try {
      const saved = await gas('saveInvoice', payload);
      if (saved && saved.InvoiceId) {
        payload.invoice = saved;
        if (invoiceId) {
          const idx = state.data.invoices.findIndex(i => i.InvoiceId === invoiceId);
          if (idx !== -1) state.data.invoices[idx] = saved;
        } else {
          state.data.invoices.unshift(saved);
        }
        state.data.invoiceItems = state.data.invoiceItems.filter(li => li.InvoiceId !== saved.InvoiceId).concat(
          payload.items.map(li => ({ ...li, InvoiceId: saved.InvoiceId }))
        );
      }
      try { localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(state.data)); } catch (e) {}
      renderView();
      showToast(invoiceId ? 'Sales Invoice updated successfully!' : 'Sales Invoice issued successfully! (Stock deducted)');
      await refreshData();
    } catch (err) {
      console.error('saveInvoice sync error:', err);
      showToast('Error saving invoice: ' + (err.message || err));
    }
  }

  async function removeInvoice(id) {
    verifyPinAndExecute('delete invoice ' + id, async () => {
      const oldInv = (state.data.invoices || []).find(i => i.InvoiceId === id);
      const oldItems = (state.data.invoiceItems || []).filter(li => li.InvoiceId === id);
      if (oldInv && oldInv.Status !== 'Draft' && oldInv.Status !== 'Cancelled') {
        oldItems.forEach(li => {
          const invItem = state.data.inventory.find(x => 
            (li.ItemId && x.ItemId === li.ItemId) ||
            (li.ItemCode && x.SKU && String(x.SKU).trim().toLowerCase() === String(li.ItemCode).trim().toLowerCase()) ||
            (li.ItemName && x.Name && String(x.Name).trim().toLowerCase() === String(li.ItemName).trim().toLowerCase())
          );
          if (invItem) {
            invItem.StockQty = (Number(invItem.StockQty) || 0) + (Number(li.Qty) || 0);
          }
        });
      }
      state.data.invoices = state.data.invoices.filter(i => i.InvoiceId !== id);
      state.data.invoiceItems = state.data.invoiceItems.filter(li => li.InvoiceId !== id);
      try { localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(state.data)); } catch (e) {}
      renderView();
      showToast('Sales Invoice deleted.');
      gas('deleteInvoice', id).catch(err => console.error(err));
    });
  }

  async function submitCompanyProfile(companyId) {
    const name = document.getElementById('fCompName').value.trim();
    if (!name) {
      showToast('Please enter Company Name');
      return;
    }
    const payload = {
      CompanyId: companyId || '',
      CompanyName: name,
      Address: document.getElementById('fCompAddr').value.trim(),
      Phone: document.getElementById('fCompPhone').value.trim(),
      Email: document.getElementById('fCompEmail').value.trim(),
      Website: document.getElementById('fCompWeb').value.trim(),
      BankName: document.getElementById('fCompBank').value.trim(),
      Branch: document.getElementById('fCompBranch').value.trim(),
      AccountNo: document.getElementById('fCompAcc').value.trim(),
      Logo: document.getElementById('fCompLogo').value.trim(),
      InvoicePrefix: document.getElementById('fCompInvPrefix')?.value.trim() || '',
      NextInvoiceNo: document.getElementById('fCompNextInv')?.value.trim() || '',
      QuotePrefix: document.getElementById('fCompQuotPrefix')?.value.trim() || '',
      NextQuoteNo: document.getElementById('fCompNextQuot')?.value.trim() || '',
      IsDefault: document.getElementById('fCompDefault').value
    };

    closeModal();

    // 1. Optimistic Local Update
    if (payload.IsDefault === 'Yes') {
      (state.data.companyProfiles || []).forEach(c => { if (c.CompanyId !== companyId) c.IsDefault = 'No'; });
    }
    if (companyId) {
      const idx = (state.data.companyProfiles || []).findIndex(c => c.CompanyId === companyId);
      if (idx !== -1) {
        Object.assign(state.data.companyProfiles[idx], payload);
      }
    }
    try { localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(state.data)); } catch (e) {}
    renderView();
    showToast('Saving Company Profile...');

    try {
      const saved = await gas('saveCompanyProfile', payload);
      if (saved && saved.CompanyId) {
        if (saved.IsDefault === 'Yes') {
          (state.data.companyProfiles || []).forEach(c => { if (c.CompanyId !== saved.CompanyId) c.IsDefault = 'No'; });
        }
        const idx = (state.data.companyProfiles || []).findIndex(c => c.CompanyId === saved.CompanyId || c.CompanyId === companyId);
        if (idx !== -1) {
          state.data.companyProfiles[idx] = saved;
        } else {
          (state.data.companyProfiles = state.data.companyProfiles || []).push(saved);
        }
      }
      try { localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(state.data)); } catch (e) {}
      renderView();
      showToast('Company Profile saved successfully!');
      await refreshData();
    } catch (err) {
      console.error(err);
      showToast('Error saving company: ' + (err.message || err));
    }
  }

  function generateNextInvoiceNo(companyId) {
    const comp = companyId ? (state.data.companyProfiles || []).find(c => c.CompanyId === companyId) : ((state.data.companyProfiles || []).find(c => c.IsDefault === 'Yes') || (state.data.companyProfiles || [])[0]);
    const prefix = comp ? (comp.InvoicePrefix || 'JDI') : ((state.data.settings && state.data.settings.InvoicePrefix) || 'JDI');
    const invs = state.data.invoices || [];
    let baseNum = comp && comp.NextInvoiceNo ? parseInt(comp.NextInvoiceNo, 10) : ((state.data.settings && state.data.settings.NextInvoiceNo) ? parseInt(state.data.settings.NextInvoiceNo, 10) : 8800);
    if (isNaN(baseNum)) baseNum = 8800;

    invs.forEach(i => {
      const invNo = String(i.InvoiceNo || '').trim();
      const m = invNo.match(/(\d+)/g);
      if (m) {
        m.forEach(str => {
          const n = parseInt(str, 10);
          if (!isNaN(n) && n >= baseNum) {
            baseNum = n + 1;
          }
        });
      }
    });

    let candidate = (prefix || '') + baseNum;
    while (invs.some(i => String(i.InvoiceNo || '').trim().toLowerCase() === candidate.toLowerCase())) {
      baseNum++;
      candidate = (prefix || '') + baseNum;
    }
    return candidate;
  }

  function getNextQuotationNo(companyId) {
    const comp = companyId ? (state.data.companyProfiles || []).find(c => c.CompanyId === companyId) : ((state.data.companyProfiles || []).find(c => c.IsDefault === 'Yes') || (state.data.companyProfiles || [])[0]);
    const prefix = comp ? (comp.QuotePrefix || 'JDQ') : ((state.data.settings && state.data.settings.QuotePrefix) || 'JDQ');
    const quotes = state.data.quotations || [];
    let baseNum = comp && comp.NextQuoteNo ? parseInt(comp.NextQuoteNo, 10) : ((state.data.settings && state.data.settings.NextQuoteNo) ? parseInt(state.data.settings.NextQuoteNo, 10) : 8800);
    if (isNaN(baseNum)) baseNum = 8800;

    quotes.forEach(q => {
      const qNo = String(q.QuotationNo || '').trim();
      const m = qNo.match(/(\d+)/g);
      if (m) {
        m.forEach(str => {
          const n = parseInt(str, 10);
          if (!isNaN(n) && n >= baseNum) {
            baseNum = n + 1;
          }
        });
      }
    });

    let candidate = (prefix || '') + baseNum;
    while (quotes.some(q => String(q.QuotationNo || '').trim().toLowerCase() === candidate.toLowerCase())) {
      baseNum++;
      candidate = (prefix || '') + baseNum;
    }
    return candidate;
  }

  function generateNextSKU() {
    const items = state.data.inventory || [];
    let prefix = 'JD-001-';
    let maxNum = 0;
    let foundPattern = false;

    items.forEach(it => {
      const s = String(it.SKU || '').trim();
      const m = s.match(/^(JD-001-)(\d+)$/i);
      if (m) {
        foundPattern = true;
        prefix = m[1];
        const n = parseInt(m[2], 10);
        if (!isNaN(n) && n > maxNum) maxNum = n;
      }
    });

    if (!foundPattern) {
      items.forEach(it => {
        const s = String(it.SKU || '').trim();
        const m = s.match(/^(.*?)(\d+)$/);
        if (m) {
          prefix = m[1] || 'SKU-';
          const n = parseInt(m[2], 10);
          if (!isNaN(n) && n > maxNum) maxNum = n;
        }
      });
    }

    if (maxNum === 0) maxNum = 80 + items.length;
    let nextNum = maxNum + 1;
    let candidate = prefix + nextNum;
    while (items.some(it => String(it.SKU || '').trim().toLowerCase() === candidate.toLowerCase())) {
      nextNum++;
      candidate = prefix + nextNum;
    }
    return candidate;
  }

  function generateNextCustomerCode() {
    const custs = state.data.customers || [];
    let maxNum = 680;
    custs.forEach(c => {
      const s = String(c.CustomerCode || '').trim();
      const m = s.match(/(\d+)/);
      if (m) {
        const n = parseInt(m[1], 10);
        if (!isNaN(n) && n > maxNum) maxNum = n;
      }
    });
    let nextNum = maxNum + 1;
    let candidate = String(nextNum);
    while (custs.some(c => String(c.CustomerCode || '').trim().toLowerCase() === candidate.toLowerCase())) {
      nextNum++;
      candidate = String(nextNum);
    }
    return candidate;
  }

  function generateNextEmployeeCode() {
    const emps = state.data.employees || [];
    let maxNum = 0;
    emps.forEach(e => {
      const s = String(e.EmpNo || e.NIC || '').trim();
      const m = s.match(/(?:EMP[-_]?)(\d+)/i);
      if (m) {
        const n = parseInt(m[1], 10);
        if (!isNaN(n) && n > maxNum) maxNum = n;
      }
    });
    if (maxNum === 0) maxNum = emps.length;
    let nextNum = maxNum + 1;
    let candidate = 'EMP-' + String(nextNum).padStart(3, '0');
    while (emps.some(e => String(e.EmpNo || '').trim().toLowerCase() === candidate.toLowerCase())) {
      nextNum++;
      candidate = 'EMP-' + String(nextNum).padStart(3, '0');
    }
    return candidate;
  }

  function getNetSales(invoices) {
    return (invoices || []).reduce((sum, inv) => {
      if (inv.Status === 'Cancelled' || inv.PaymentStatus === 'Cancel') return sum;
      const total = Number(inv.Total || 0);
      const ret = Number(inv.ReturnAmount || 0);
      const tok = Number(inv.TokenAmount || 0);
      return sum + Math.max(0, total - ret - tok);
    }, 0);
  }

  function renderQuotCustList(filterText = '') {
    const menu = document.getElementById('quotCustMenu');
    if (!menu) return;
    const lower = filterText.toLowerCase().trim();
    const list = (state.data.customers || []).filter(c => {
      if (!lower) return true;
      const text = `${c.CustomerCode || ''} ${c.Name || ''} ${c.Company || ''} ${c.Phone || ''}`.toLowerCase();
      return text.includes(lower);
    });

    if (list.length === 0) {
      menu.innerHTML = '<div style="padding:10px 12px; font-size:12.5px; color:#94a3b8; text-align:center;">No matching customers found</div>';
      return;
    }

    menu.innerHTML = list.map(c => {
      const codeStr = c.CustomerCode ? `<span style="font-weight:700; color:#0f766e; margin-right:6px;">${esc(c.CustomerCode)}</span>` : '';
      const compStr = c.Company ? ` <span style="color:#64748b; font-size:12px;">(${esc(c.Company)})</span>` : '';
      return `
        <div onclick="selectQuotCust('${esc(c.CustomerId)}')" style="padding:8px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='#fff'">
          <div>${codeStr}<b>${esc(c.Name)}</b>${compStr}</div>
          <div style="font-size:11.5px; color:#94a3b8;">${esc(c.Phone || '')}</div>
        </div>
      `;
    }).join('');
  }

  function openQuotCustList() {
    const menu = document.getElementById('quotCustMenu');
    if (menu) {
      renderQuotCustList(document.getElementById('fQuotCustInput')?.value || '');
      menu.classList.remove('hidden');
    }
  }

  function toggleQuotCustList(e) {
    if (e) e.stopPropagation();
    const menu = document.getElementById('quotCustMenu');
    if (menu) {
      if (menu.classList.contains('hidden')) {
        openQuotCustList();
        document.getElementById('fQuotCustInput')?.focus();
      } else {
        menu.classList.add('hidden');
      }
    }
  }

    renderQuotCustList(val);
    const menu = document.getElementById('quotCustMenu');
    if (menu) menu.classList.remove('hidden');

  function selectQuotCust(custId) {
    const cust = (state.data.customers || []).find(c => c.CustomerId === custId);

      const inputEl = document.getElementById('fQuotCustInput');
      const idEl = document.getElementById('fQuotCustId');
      const addrEl = document.getElementById('fQuotAddr');
      const displayName = `${cust.CustomerCode ? cust.CustomerCode + ' ' : ''}${cust.Name}`;
      if (inputEl) inputEl.value = displayName;
      if (idEl) idEl.value = cust.CustomerId;
      if (addrEl) {
        const fullAddr = [cust.BillingAddress || cust.DeliveryAddress || '', cust.Phone || ''].filter(Boolean).join('\n');
        addrEl.value = fullAddr;
      }
    }
    const menu = document.getElementById('quotCustMenu');

  function pickQuotItem(idx, itemId) {
    const item = (state.data.inventory || []).find(x => x.ItemId === itemId);
    _quotLines[idx].ItemId = itemId;
    if (item) {
      _quotLines[idx].ItemCode = item.SKU || '';
      _quotLines[idx].Description = item.Name || '';
      _quotLines[idx].UnitPrice = Number(item.UnitPrice) || 0;
    }
    renderQuotLines();
    updateQuotTotals();
  }

  function addQuotLine() {
    _quotLines.push({ ItemId: '', ItemCode: '', Description: '', Qty: 1, UnitPrice: 0, Discount: 0, Tax: 'No tax', Amount: 0 });
    renderQuotLines();
    updateQuotTotals();
  }

  function removeQuotLine(idx) {
    if (_quotLines.length > 1) {
      _quotLines.splice(idx, 1);
    } else {
      _quotLines[0] = { ItemId: '', ItemCode: '', Description: '', Qty: 1, UnitPrice: 0, Discount: 0, Tax: 'No tax', Amount: 0 };
    }
    renderQuotLines();
    updateQuotTotals();
  }

  function updateQuotTotals() {
    let grand = 0;
    _quotLines.forEach((ln, idx) => {
      const lineSub = Number(ln.Qty || 0) * Number(ln.UnitPrice || 0);
      const lineDisc = lineSub * ((Number(ln.Discount) || 0) / 100);
      const lineTotal = Math.round((lineSub - lineDisc) * 100) / 100;
      ln.Amount = lineTotal;
      grand += lineTotal;
      const amtEl = document.getElementById('quotLineAmt_' + idx);
      if (amtEl) amtEl.value = Number(lineTotal).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    });

    const totalBox = document.getElementById('fQuotTotalBox');
    if (totalBox) {
      totalBox.textContent = Number(grand).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    }
    return grand;
  }

  async function submitQuotation(quotId) {
    const custInput = document.getElementById('fQuotCustInput')?.value.trim() || '';
    const custId = document.getElementById('fQuotCustId')?.value || '';
    const custObj = (state.data.customers || []).find(c => c.CustomerId === custId);

    const custName = custInput || (custObj ? custObj.Name : 'Walk-in Customer');
    const quotNo = document.getElementById('fQuotNo')?.value.trim() || getNextQuotationNo();
    const dateVal = document.getElementById('fQuotDate')?.value || state.data.today;
    const addrVal = document.getElementById('fQuotAddr')?.value.trim() || '';
    const descVal = document.getElementById('fQuotDesc')?.value.trim() || '';
    const companyId = document.getElementById('fQuotCompany')?.value || '';
    const statusVal = document.getElementById('fQuotStatus')?.value || 'Draft';

    const grandTotal = updateQuotTotals();

    const dataJson = JSON.stringify({
      QuotationNo: quotNo,
      CustomerId: custId,
      CustomerName: custName,
      BillingAddress: addrVal,
      Description: descVal,
      CompanyId: companyId,
      Date: dateVal,
      Items: _quotLines.filter(l => (l.Description || '').trim() !== ''),
      DiscountChecked: document.getElementById('chkQuotDisc')?.checked || false,
      DiscountType: document.getElementById('selQuotDiscType')?.value || 'Percentage',
      HideTotal: document.getElementById('chkQuotHideTotal')?.checked || false,
      TaxInclusive: document.getElementById('chkQuotTaxInclusive')?.checked || false,
      RoundOff: document.getElementById('chkQuotRound')?.checked || false,
      CustomTitle: document.getElementById('chkQuotCustomTitle')?.checked || false
    });

    const payload = {
      QuotationId: quotId || '',
      QuotationNo: quotNo,
      Date: dateVal,
      CustomerId: custId,
      CustomerName: custName,
      BillingAddress: addrVal,
      Description: descVal,
      TotalAmount: grandTotal,
      Status: statusVal,
      CompanyId: companyId,
      DataJson: dataJson,
      CreatedBy: state.user.Name
    };

    // Optimistic local update (0ms response)
    const localQuotId = quotId || ('QT-' + Date.now());
    payload.QuotationId = localQuotId;

    if (!quotId) {
      const comp = (state.data.companyProfiles || []).find(c => c.CompanyId === companyId);
      if (comp && comp.NextQuoteNo) {
        const n = parseInt(comp.NextQuoteNo, 10);
        if (!isNaN(n)) comp.NextQuoteNo = String(n + 1);
      }
      if (state.data.settings && state.data.settings.NextQuoteNo) {
        const n = parseInt(state.data.settings.NextQuoteNo, 10);
        if (!isNaN(n)) state.data.settings.NextQuoteNo = String(n + 1);
      }
    }

    if (quotId) {
      const idx = (state.data.quotations || []).findIndex(q => q.QuotationId === quotId);
      if (idx !== -1) state.data.quotations[idx] = payload;
    } else {
      (state.data.quotations = state.data.quotations || []).unshift(payload);
    }
    try { localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(state.data)); } catch (e) {}

    closeModal();
    renderView();
    showToast(quotId ? 'Quotation updated!' : 'Quotation saved!');

    try {
      const finalQuotId = quotId || payload.QuotationId || ('QT-' + Date.now() + '-' + Math.floor(Math.random()*1000));
      payload.QuotationId = finalQuotId;
      const saved = await gas('saveQuotation', payload);
      if (saved && saved.QuotationId) {
        const idx = (state.data.quotations || []).findIndex(q => q.QuotationId === localQuotId || q.QuotationId === saved.QuotationId);
        if (idx !== -1) {
          state.data.quotations[idx].QuotationId = saved.QuotationId;
          try { localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(state.data)); } catch (e) {}
        }
      }
    } catch (err) {
      console.error('saveQuotation error:', err);
    }
  }

  function openTxModal() {
    openModal(
      'Record Income / Expense',
      `

          <div class="form-group"><label>Date</label><input type="date" id="fTxDate" value="${state.data.today}"></div>

      `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
