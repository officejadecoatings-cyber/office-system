<style>
  :root {
    --bg: #f7fbf9;
    --surface: #ffffff;
    --border: #d1fae5;
    --text: #231f20;
    --muted: #4b5563;
    --primary: #00a651;
    --primary-hover: #008f45;
    --primary-light: #ebf8f2;
    --brand-dark: #074626;
    --success: #00a651;
    --success-bg: #ebf8f2;
    --warning: #d97706;
    --warning-bg: #fef3c7;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --sidebar-w: 245px;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }

  .hidden { display: none !important; }

  /* Login Screen */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #ebf8f2 0%, #ffffff 55%, #e6f4ec 100%);
  }
  .login-logo {
    display: block;
    max-width: 180px;
    max-height: 80px;
    object-fit: contain;
    margin: 0 auto 14px auto;
    border-radius: 8px;
  }
  .sidebar-logo {
    width: 34px;
    height: 34px;
    object-fit: cover;
    border-radius: 6px;
    background: #fff;
    flex-shrink: 0;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
  }
  .login-card h1 { font-size: 20px; margin-bottom: 4px; }
  .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  /* App Shell */
  .app-shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w);
    background: #231f20;
    color: #e5e7eb;
    border-right: 2px solid var(--brand-dark);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; bottom: 0; left: 0;
    z-index: 40;
    transition: transform 0.2s ease;
  }
  .sidebar-brand {
    padding: 16px 18px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    border-bottom: 1px solid var(--brand-dark);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border: none;
    background: transparent;
    color: #94a3b8;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    margin-bottom: 4px;
    transition: all 0.15s;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item.active { background: var(--primary); color: #fff; }
  .sidebar-footer {
    padding: 14px 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 12px;
  }

  .main-wrap {
    flex: 1;
    margin-left: var(--sidebar-w);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-title { font-size: 17px; font-weight: 600; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .menu-btn {
    display: none;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }

  .content { padding: 24px; max-width: 1320px; width: 100%; margin: 0 auto; }

  /* Cards & Grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.03);
  }
  .kpi-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .kpi-val { font-size: 24px; font-weight: 700; margin-top: 6px; }
  .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .section-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .section-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab-btn {
    padding: 8px 14px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-weight: 600;
    color: var(--muted);
  }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* Forms & Buttons */
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  input, select, textarea {
    width: 100%;
    padding: 8px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  .search-input { width: 240px; max-width: 100%; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary { background: #fff; border-color: var(--border); color: var(--text); }
  .btn-secondary:hover { background: #f8fafc; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); background: #f8fafc; font-weight: 600; }
  tr:hover td { background: #f8fafc; }

  /* Badges */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-success { background: var(--success-bg); color: var(--success); }
  .badge-warning { background: var(--warning-bg); color: var(--warning); }
  .badge-danger { background: var(--danger-bg); color: var(--danger); }
  .badge-info { background: var(--primary-light); color: var(--primary); }
  .badge-muted { background: #e2e8f0; color: #475569; }
  .row-overdue td { background: #fef2f2 !important; color: #991b1b; }
  .alert-danger {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .nav-divider { border-top: 1px solid rgba(255,255,255,0.08); margin: 10px 8px; }

  /* Kanban / Tasks */
  .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .kanban-col { background: #eef2f6; border-radius: var(--radius); padding: 12px; min-height: 300px; }
  .kanban-col h4 { font-size: 13px; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .task-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .task-title { font-weight: 600; margin-bottom: 4px; }
  .task-meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; margin-top: 8px; }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 60;
  }
  .modal {
    background: #fff;
    border-radius: 12px;
    width: 100%;
    max-width: 620px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  }
  .modal-lg { max-width: 820px; }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-body { padding: 20px; overflow-y: auto; }
  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* Toast & Loader */
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #0f172a;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 80;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
  }
  .loading-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--primary);
    z-index: 90;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Excel Styled Tables (Petty Cash & Call Reports) */
  .print-excel-table {
    border-collapse: collapse;
    width: 100%;
    border: 1px solid #000;
    font-size: 12px;
  }
  .print-excel-table th, .print-excel-table td {
    border: 1px solid #000;
    padding: 6px 8px;
    font-size: 12px;
  }
  .print-excel-table .print-title {
    background: #b9d2e6;
    color: #000;
    font-weight: 700;
    text-align: center;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #000;
  }
  .print-excel-table thead tr:last-child th {
    background: #9bc2e3;
    color: #000;
    font-weight: 700;
    text-align: center;
    border: 1px solid #000;
  }
  .print-excel-table tfoot td {
    background: #ffffff;
    font-weight: 700;
    border: 1px solid #000;
    color: #000;
  }

  @media (max-width: 860px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main-wrap { margin-left: 0; }
    .menu-btn { display: inline-flex; }
    .two-col, .kanban, .form-row { grid-template-columns: 1fr; }
  }

  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .sidebar, .topbar, .no-print, .modal-footer, .modal-header .close-btn { display: none !important; }
    body, .main-wrap, .content, .card, .modal-backdrop, .modal { position: static; background: #fff; box-shadow: none; border: none; margin: 0; padding: 0; max-width: 100%; max-height: none; }
    #pcTable, .print-excel-table { border-collapse: collapse; width: 100%; border: 1px solid #000 !important; }
    #pcTable th, #pcTable td, .print-excel-table th, .print-excel-table td { border: 1px solid #000 !important; font-size: 12px; }
    #pcTable .pc-title, .print-excel-table .print-title { background: #b9d2e6 !important; color: #000 !important; border: 1px solid #000 !important; font-weight: 700; text-align: center; }
    #pcTable .pc-group-in, #pcTable .pc-group-out { background: #ffffff !important; color: #000 !important; border: 1px solid #000 !important; font-weight: 700; }
    #pcTable .pc-sub, .print-excel-table th { background: #9bc2e3 !important; color: #000 !important; border: 1px solid #000 !important; font-weight: 700; }
    #pcTable .pc-balance-prev { background: #cfdce4 !important; color: #000 !important; border: 1px solid #000 !important; }
    #pcTable .pc-total, #pcTable .pc-total td, .print-excel-table tfoot td { background: #ffffff !important; color: #000 !important; border: 1px solid #000 !important; font-weight: 700; }
    #pcTable .pc-cf-empty { background: transparent !important; border: none !important; }
    #pcTable .pc-cf-label { background: #ffffff !important; color: #000 !important; border-top: none !important; border-left: 1px solid #000 !important; border-right: 1px solid #000 !important; border-bottom: 1px solid #000 !important; font-weight: 700; text-align: right; }
    #pcTable .pc-cf-val { background: #ffffff !important; color: #000 !important; border-top: none !important; border-left: 1px solid #000 !important; border-right: 1px solid #000 !important; border-bottom: 1px solid #000 !important; font-weight: 700; text-align: right; text-decoration: underline; }
    #pcTable .pc-divider { border-right: 1px solid #000 !important; }
    #pcTable .pc-amt-in, #pcTable .pc-amt-out, #pcTable .pc-amt-cf { color: #000 !important; }
  }
</style>
