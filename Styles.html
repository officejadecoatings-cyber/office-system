<style>
  :root {
    --bg: #f7fbf9;
    --surface: #ffffff;
    --border: #d1fae5;
    --text: #231f20;
    --muted: #4b5563;
    --primary: #00a651;
    --primary-hover: #008f45;
    --primary-light: #ebf8f2;
    --brand-dark: #074626;
    --success: #00a651;
    --success-bg: #ebf8f2;
    --warning: #d97706;
    --warning-bg: #fef3c7;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --sidebar-w: 245px;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* Clean number inputs without cramped spin buttons */
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] {
    -moz-appearance: textfield;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }

  .hidden { display: none !important; }

  .paid-seal {
    display: inline-block;
    border: 2px solid #16a34a;
    color: #15803d;
    font-weight: 900;
    font-size: 11.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
    transform: rotate(-6deg);
    background: #dcfce7;
    box-shadow: 0 1px 3px rgba(22, 163, 74, 0.25);
    user-select: none;
  }

  /* Login Screen */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #ebf8f2 0%, #ffffff 55%, #e6f4ec 100%);
  }
  .login-logo {
    display: block;
    max-width: 180px;
    max-height: 80px;
    object-fit: contain;
    margin: 0 auto 14px auto;
    border-radius: 8px;
  }
  .sidebar-logo {
    width: 34px;
    height: 34px;
    object-fit: cover;
    border-radius: 6px;
    background: #fff;
    flex-shrink: 0;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
  }
  .login-card h1 { font-size: 20px; margin-bottom: 4px; }
  .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  /* App Shell */
  .app-shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w);
    background: #231f20;
    color: #e5e7eb;
    border-right: 2px solid var(--brand-dark);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; bottom: 0; left: 0;
    z-index: 40;
    transition: transform 0.2s ease;
  }
  .sidebar-brand {
    padding: 16px 18px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    border-bottom: 1px solid var(--brand-dark);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border: none;
    background: transparent;
    color: #94a3b8;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    margin-bottom: 4px;
    transition: all 0.15s;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item.active { background: var(--primary); color: #fff; }
  .sidebar-footer {
    padding: 14px 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 12px;
  }

  .main-wrap {
    flex: 1;
    margin-left: var(--sidebar-w);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-title { font-size: 17px; font-weight: 600; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .menu-btn {
    display: none;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }

  .content { padding: 24px; max-width: 1320px; width: 100%; margin: 0 auto; }

  /* Cards & Grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.03);
  }
  .kpi-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .kpi-val { font-size: 24px; font-weight: 700; margin-top: 6px; }
  .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .section-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .section-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab-btn {
    padding: 8px 14px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-weight: 600;
    color: var(--muted);
  }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* Forms & Buttons */
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  input, select, textarea {
    width: 100%;
    padding: 8px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  input[type="checkbox"], input[type="radio"] {
    width: 16px !important;
    height: 16px !important;
    display: inline-block !important;
    margin: 0 !important;
    flex-shrink: 0 !important;
    cursor: pointer;
  }
  .search-input { width: 240px; max-width: 100%; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary { background: #fff; border-color: var(--border); color: var(--text); }
  .btn-secondary:hover { background: #f8fafc; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); background: #f8fafc; font-weight: 600; }
  tr:hover td { background: #f8fafc; }

  /* Badges */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-success { background: var(--success-bg); color: var(--success); }
  .badge-warning { background: var(--warning-bg); color: var(--warning); }
  .badge-danger { background: var(--danger-bg); color: var(--danger); }
  .badge-info { background: var(--primary-light); color: var(--primary); }
  .badge-muted { background: #e2e8f0; color: #475569; }
  .row-overdue td { background: #fef2f2 !important; color: #991b1b; }
  .alert-danger {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .nav-divider { border-top: 1px solid rgba(255,255,255,0.08); margin: 10px 8px; }

  /* Kanban / Tasks */
  .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .kanban-col { background: #eef2f6; border-radius: var(--radius); padding: 12px; min-height: 300px; }
  .kanban-col h4 { font-size: 13px; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .task-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .task-title { font-weight: 600; margin-bottom: 4px; }
  .task-meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; margin-top: 8px; }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 60;
  }
  .modal {
    background: #fff;
    border-radius: 12px;
    width: 100%;
    max-width: 620px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  }
  .modal-lg { max-width: 1220px; width: 96vw; }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-body { padding: 20px; overflow-y: auto; }
  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* Toast & Loader */
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #0f172a;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 80;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
  }
  .loading-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--primary);
    z-index: 90;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Excel Styled Tables (Petty Cash & Call Reports & Outstanding) */
  .excel-grid-table {
    border-collapse: collapse;
    width: 100%;
    min-width: 1400px;
    border: 1px solid #7ea7d8;
    background: #fff;
  }
  .excel-grid-table th {
    background: #8ea9db !important;
    color: #000 !important;
    font-weight: 700 !important;
    font-size: 11.5px !important;
    text-align: center !important;
    border: 1px solid #7ea7d8 !important;
    padding: 6px 8px !important;
    white-space: nowrap !important;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .excel-grid-table td {
    border: 1px solid #d9e1f2 !important;
    padding: 6px 8px !important;
    font-size: 12px !important;
    white-space: nowrap !important;
    color: #1e293b;
  }
  .excel-grid-table tr:nth-child(even) td {
    background: #f2f5fb;
  }
  .excel-grid-table tr:hover td {
    background: #e9f0fc !important;
  }
  .excel-grid-table tfoot td {
    background: #d9e1f2 !important;
    font-weight: 700 !important;
    border-top: 2px solid #8ea9db !important;
  }

  .print-excel-table {
    border-collapse: collapse;
    width: 100%;
    border: 1px solid #000;
    font-size: 12px;
  }
  .print-excel-table th, .print-excel-table td {
    border: 1px solid #000;
    padding: 6px 8px;
    font-size: 12px;
  }
  .print-excel-table .print-title {
    background: #b9d2e6;
    color: #000;
    font-weight: 700;
    text-align: center;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #000;
  }
  .print-excel-table thead tr:last-child th {
    background: #9bc2e3;
    color: #000;
    font-weight: 700;
    text-align: center;
    border: 1px solid #000;
  }
  .print-excel-table tfoot td {
    background: #ffffff;
    font-weight: 700;
    border: 1px solid #000;
    color: #000;
  }

  /* Sidebar Overlay & Mobile Drawer */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 95;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .sidebar-overlay:not(.hidden) {
    display: block;
    opacity: 1;
  }

  /* Mobile and Tablet Responsive Optimization */
  @media (max-width: 860px) {
    :root {
      --sidebar-w: 280px;
    }

    body {
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Off-canvas Mobile Sidebar */
    .sidebar {
      transform: translateX(-100%);
      transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: none;
      z-index: 100;
      width: 280px;
      max-width: 86vw;
      will-change: transform;
    }
    .sidebar.open {
      transform: translateX(0);
      box-shadow: 6px 0 24px rgba(0, 0, 0, 0.45);
    }
    #closeSidebarBtn {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      font-size: 16px;
      padding: 0;
      line-height: 1;
      border-radius: 8px;
    }

    .main-wrap {
      margin-left: 0 !important;
      width: 100% !important;
      min-width: 0;
      overflow-x: hidden;
    }

    /* Compact Mobile Topbar */
    .topbar {
      padding: 8px 12px;
      gap: 8px;
    }
    .menu-btn {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      min-height: 42px;
      font-size: 20px;
      padding: 4px 10px;
      border-radius: 8px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      cursor: pointer;
    }
    .topbar-title {
      font-size: 16px;
      font-weight: 700;
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-right {
      gap: 6px;
    }
    #autoSyncBadge {
      display: none;
    }

    /* Content Area */
    .content {
      padding: 12px 10px;
    }

    /* Responsive Grids & Layouts */
    .two-col, .kanban, .form-row {
      grid-template-columns: 1fr !important;
      gap: 10px !important;
    }

    /* Section Headers & Action Bars */
    .section-header {
      flex-direction: column;
      align-items: stretch !important;
      gap: 10px;
    }
    .section-header .search-input {
      width: 100% !important;
      max-width: 100% !important;
    }
    .section-header .btn,
    .section-header .section-actions,
    .section-actions .btn {
      width: 100% !important;
      justify-content: center;
    }

    /* Horizontal Scrolling Scrollable Tabs */
    .tabs {
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
      margin-bottom: 12px;
    }
    .tab {
      padding: 8px 14px;
      font-size: 13px;
      flex-shrink: 0;
    }

    /* Mobile KPI Cards */
    .kpi-grid {
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 10px !important;
      margin-bottom: 14px;
    }
    .kpi-card, .card {
      padding: 12px !important;
      border-radius: 10px;
    }
    .kpi-val {
      font-size: 18px !important;
      word-break: break-word;
    }
    .kpi-label {
      font-size: 11px !important;
    }

    /* Mobile Table Scrolling */
    .table-wrap {
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    table {
      min-width: 600px;
    }
    th, td {
      padding: 8px 10px !important;
      font-size: 12px !important;
    }

    /* Mobile Responsive Modals */
    .modal-backdrop {
      padding: 6px !important;
      align-items: center;
      z-index: 110;
    }
    .modal, .modal-lg {
      width: 100% !important;
      max-width: 100% !important;
      max-height: 94vh !important;
      margin: 0 auto !important;
      border-radius: 14px !important;
    }
    .modal-header {
      padding: 12px 14px !important;
    }
    .modal-header h3 {
      font-size: 16px !important;
    }
    .modal-body {
      padding: 14px 12px !important;
      max-height: calc(94vh - 115px) !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }
    .modal-footer {
      padding: 10px 12px !important;
      flex-wrap: wrap;
      gap: 8px;
    }
    .modal-footer .btn {
      flex: 1 1 auto;
      min-height: 42px;
      justify-content: center;
    }

    /* Prevent iOS & Android browser zooming on input focus (minimum 16px required) */
    input, select, textarea {
      font-size: 16px !important;
      min-height: 42px;
      border-radius: 7px;
    }

    /* Interactive Buttons */
    .btn {
      min-height: 42px;
      font-size: 14px;
      padding: 8px 14px;
    }
    .btn-sm {
      min-height: 34px;
      font-size: 12px;
      padding: 4px 10px;
    }

    /* Login Card for Mobile */
    .login-wrap {
      padding: 12px;
    }
    .login-card {
      padding: 24px 16px;
      border-radius: 14px;
      max-width: 100%;
    }
  }

  @media (max-width: 480px) {
    .kpi-grid {
      grid-template-columns: 1fr !important;
    }
    .topbar-title {
      font-size: 15px;
      max-width: 130px;
    }
    .modal-body {
      padding: 10px !important;
    }
  }

  @media print {
    @page { size: portrait; margin: 8mm 10mm; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .sidebar, .topbar, .no-print, .modal-footer, .modal-header, .close-btn { display: none !important; }
    
    /* When a modal is open during print, hide the underlying page/app completely so background tables never print */
    body:has(#modalBackdrop:not(.hidden)) #appShell > *:not(#modalBackdrop),
    body:has(#modalBackdrop:not(.hidden)) .main-wrap,
    body:has(#modalBackdrop:not(.hidden)) #mainContent,
    body:has(#modalBackdrop:not(.hidden)) .sidebar,
    body:has(#modalBackdrop:not(.hidden)) .topbar,
    body.modal-open .main-wrap,
    body.modal-open #mainContent,
    body.modal-open .sidebar,
    body.modal-open .topbar {
      display: none !important;
    }

    body, .main-wrap, .content, .card, .modal-backdrop, .modal { position: static; background: #fff; box-shadow: none; border: none; margin: 0; padding: 0; max-width: 100%; max-height: none; }
    #pcTable, .print-excel-table { border-collapse: collapse; width: 100%; border: 1px solid #000 !important; }
    #pcTable th, #pcTable td, .print-excel-table th, .print-excel-table td { border: 1px solid #000 !important; font-size: 12px; }
    #pcTable .pc-title, .print-excel-table .print-title { background: #b9d2e6 !important; color: #000 !important; border: 1px solid #000 !important; font-weight: 700; text-align: center; }
    #pcTable .pc-group-in, #pcTable .pc-group-out { background: #ffffff !important; color: #000 !important; border: 1px solid #000 !important; font-weight: 700; }
    #pcTable .pc-sub, .print-excel-table th { background: #9bc2e3 !important; color: #000 !important; border: 1px solid #000 !important; font-weight: 700; }
    #pcTable .pc-balance-prev { background: #cfdce4 !important; color: #000 !important; border: 1px solid #000 !important; }
    #pcTable .pc-total, #pcTable .pc-total td, .print-excel-table tfoot td { background: #ffffff !important; color: #000 !important; border: 1px solid #000 !important; font-weight: 700; }
    #pcTable .pc-cf-empty { background: transparent !important; border: none !important; }
    #pcTable .pc-cf-label { background: #ffffff !important; color: #000 !important; border-top: none !important; border-left: 1px solid #000 !important; border-right: 1px solid #000 !important; border-bottom: 1px solid #000 !important; font-weight: 700; text-align: right; }
    #pcTable .pc-cf-val { background: #ffffff !important; color: #000 !important; border-top: none !important; border-left: 1px solid #000 !important; border-right: 1px solid #000 !important; border-bottom: 1px solid #000 !important; font-weight: 700; text-align: right; text-decoration: underline; }
