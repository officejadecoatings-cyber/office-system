<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Office System</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
  :root {
    --bg: #f7fbf9;
    --surface: #ffffff;
    --border: #d1fae5;
    --text: #231f20;
    --muted: #4b5563;
    --primary: #00a651;
    --primary-hover: #008f45;
    --primary-light: #ebf8f2;
    --brand-dark: #074626;
    --success: #00a651;
    --success-bg: #ebf8f2;
    --warning: #d97706;
    --warning-bg: #fef3c7;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --sidebar-w: 245px;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }

  .hidden { display: none !important; }

  /* Login Screen */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #ebf8f2 0%, #ffffff 55%, #e6f4ec 100%);
  }
  .login-logo {
    display: block;
    max-width: 180px;
    max-height: 80px;
    object-fit: contain;
    margin: 0 auto 14px auto;
    border-radius: 8px;
  }
  .sidebar-logo {
    width: 34px;
    height: 34px;
    object-fit: cover;
    border-radius: 6px;
    background: #fff;
    flex-shrink: 0;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
  }
  .login-card h1 { font-size: 20px; margin-bottom: 4px; }
  .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  /* App Shell */
  .app-shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w);
    background: #231f20;
    color: #e5e7eb;
    border-right: 2px solid var(--brand-dark);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; bottom: 0; left: 0;
    z-index: 40;
    transition: transform 0.2s ease;
  }
  .sidebar-brand {
    padding: 16px 18px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    border-bottom: 1px solid var(--brand-dark);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border: none;
    background: transparent;
    color: #94a3b8;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    margin-bottom: 4px;
    transition: all 0.15s;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item.active { background: var(--primary); color: #fff; }
  .sidebar-footer {
    padding: 14px 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 12px;
  }

  .main-wrap {
    flex: 1;
    margin-left: var(--sidebar-w);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-title { font-size: 17px; font-weight: 600; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .menu-btn {
    display: none;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }

  .content { padding: 24px; max-width: 1320px; width: 100%; margin: 0 auto; }

  /* Cards & Grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.03);
  }
  .kpi-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .kpi-val { font-size: 24px; font-weight: 700; margin-top: 6px; }
  .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .section-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .section-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab-btn {
    padding: 8px 14px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-weight: 600;
    color: var(--muted);
  }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* Forms & Buttons */
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  input, select, textarea {
    width: 100%;
    padding: 8px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  .search-input { width: 240px; max-width: 100%; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary { background: #fff; border-color: var(--border); color: var(--text); }
  .btn-secondary:hover { background: #f8fafc; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); background: #f8fafc; font-weight: 600; }
  tr:hover td { background: #f8fafc; }

  /* Badges */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-success { background: var(--success-bg); color: var(--success); }
  .badge-warning { background: var(--warning-bg); color: var(--warning); }
  .badge-danger { background: var(--danger-bg); color: var(--danger); }
  .badge-info { background: var(--primary-light); color: var(--primary); }
  .badge-muted { background: #e2e8f0; color: #475569; }
  .row-overdue td { background: #fef2f2 !important; color: #991b1b; }
  .alert-danger {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .nav-divider { border-top: 1px solid rgba(255,255,255,0.08); margin: 10px 8px; }

  /* Kanban / Tasks */
  .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .kanban-col { background: #eef2f6; border-radius: var(--radius); padding: 12px; min-height: 300px; }
  .kanban-col h4 { font-size: 13px; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .task-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .task-title { font-weight: 600; margin-bottom: 4px; }
  .task-meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; margin-top: 8px; }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 60;
  }
  .modal {
    background: #fff;
    border-radius: 12px;
    width: 100%;
    max-width: 620px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  }
  .modal-lg { max-width: 820px; }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-body { padding: 20px; overflow-y: auto; }
  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* Toast & Loader */
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #0f172a;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 80;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
  }
  .loading-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--primary);
    z-index: 90;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Excel Styled Tables (Petty Cash & Call Reports) */
  .print-excel-table {
    border-collapse: collapse;
    width: 100%;
    border: 1px solid #000;
    font-size: 12px;
  }
  .print-excel-table th, .print-excel-table td {
    border: 1px solid #000;
    padding: 6px 8px;
    font-size: 12px;
  }
  .print-excel-table .print-title {
    background: #b9d2e6;
    color: #000;
    font-weight: 700;
    text-align: center;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #000;
  }
  .print-excel-table thead tr:last-child th {
    background: #9bc2e3;
    color: #000;
    font-weight: 700;
    text-align: center;
    border: 1px solid #000;
  }
  .print-excel-table tfoot td {
    background: #ffffff;
    font-weight: 700;
    border: 1px solid #000;
    color: #000;
  }

  @media (max-width: 860px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main-wrap { margin-left: 0; }
    .menu-btn { display: inline-flex; }
    .two-col, .kanban, .form-row { grid-template-columns: 1fr; }
  }

  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .sidebar, .topbar, .no-print, .modal-footer, .modal-header .close-btn { display: none !important; }
    body, .main-wrap, .content, .card, .modal-backdrop, .modal { position: static; background: #fff; box-shadow: none; border: none; margin: 0; padding: 0; max-width: 100%; max-height: none; }
    #pcTable, .print-excel-table { border-collapse: collapse; width: 100%; border: 1px solid #000 !important; }
    #pcTable th, #pcTable td, .print-excel-table th, .print-excel-table td { border: 1px solid #000 !important; font-size: 12px; }
    #pcTable .pc-title, .print-excel-table .print-title { background: #b9d2e6 !important; color: #000 !important; border: 1px solid #000 !important; font-weight: 700; text-align: center; }
    #pcTable .pc-group-in, #pcTable .pc-group-out { background: #ffffff !important; color: #000 !important; border: 1px solid #000 !important; font-weight: 700; }
    #pcTable .pc-sub, .print-excel-table th { background: #9bc2e3 !important; color: #000 !important; border: 1px solid #000 !important; font-weight: 700; }
    #pcTable .pc-balance-prev { background: #cfdce4 !important; color: #000 !important; border: 1px solid #000 !important; }
    #pcTable .pc-total, #pcTable .pc-total td, .print-excel-table tfoot td { background: #ffffff !important; color: #000 !important; border: 1px solid #000 !important; font-weight: 700; }
    #pcTable .pc-cf-empty { background: transparent !important; border: none !important; }
    #pcTable .pc-cf-label { background: #ffffff !important; color: #000 !important; border-top: none !important; border-left: 1px solid #000 !important; border-right: 1px solid #000 !important; border-bottom: 1px solid #000 !important; font-weight: 700; text-align: right; }
    #pcTable .pc-cf-val { background: #ffffff !important; color: #000 !important; border-top: none !important; border-left: 1px solid #000 !important; border-right: 1px solid #000 !important; border-bottom: 1px solid #000 !important; font-weight: 700; text-align: right; text-decoration: underline; }
    #pcTable .pc-divider { border-right: 1px solid #000 !important; }
    #pcTable .pc-amt-in, #pcTable .pc-amt-out, #pcTable .pc-amt-cf { color: #000 !important; }
  }
</style>

</head>
<body>
  <div id="loadingBar" class="loading-bar hidden"></div>

  <!-- Login Screen -->
  <div id="loginView" class="login-wrap">
    <div class="login-card">
      <img src="logo.jpg" onerror="this.src='https://jade-office-system-app.netlify.app/logo.jpg'" alt="Logo" class="login-logo">
      <h1 style="text-align:center;">System Manager</h1>
      <p style="text-align:center;">Sign in with your team profile and PIN</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginUser">Team Member</label>
          <select id="loginUser" required>
            <option value="">Loading users...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="loginPin">PIN</label>
          <input type="password" id="loginPin" placeholder="Enter 4-digit PIN" required maxlength="10">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
      </form>
      <p style="margin-top:14px; font-size:11px; color:#94a3b8; text-align:center;">
        Default Admin PIN: 1234 (Change in Settings)
      </p>
    </div>
  </div>

  <!-- Main App Shell -->
  <div id="appShell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div style="display:flex; align-items:center; gap:10px; min-width:0;">
          <img src="logo.jpg" onerror="this.src='https://jade-office-system-app.netlify.app/logo.jpg'" alt="Logo" class="sidebar-logo">
          <span id="brandName" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">System Manager</span>
        </div>
        <button class="btn btn-sm btn-secondary hidden" id="closeSidebarBtn" onclick="toggleSidebar(false)">✕</button>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="dashboard" onclick="navigate('dashboard')">📊 Dashboard</button>
        <button class="nav-item" data-view="invoices" onclick="navigate('invoices')">🧾 Invoices</button>
        <button class="nav-item" data-view="outstanding" onclick="navigate('outstanding')">⏳ Outstanding</button>
        <button class="nav-item" data-view="inventory" onclick="navigate('inventory')">📦 Stock</button>
        <button class="nav-item" data-view="callReport" onclick="navigate('callReport')">📞 Call Report</button>
        <button class="nav-item" data-view="projectReport" onclick="navigate('projectReport')">🏗️ Project Report</button>
        <button class="nav-item" data-view="pettyCash" onclick="navigate('pettyCash')">💵 Petty Cash</button>
        <button class="nav-item" data-view="customers" onclick="navigate('customers')">👥 Customers</button>
        <button class="nav-item" data-view="employees" onclick="navigate('employees')">🧑‍💼 Employees</button>
        <button class="nav-item" data-view="painterTraining" onclick="navigate('painterTraining')">🎨 Painter Training</button>
        <div id="customSidebarTabs"></div>
        <div class="nav-divider"></div>
        <button class="nav-item" data-view="reports" onclick="navigate('reports')">📈 Custom Reports</button>
        <button class="nav-item" data-view="import" onclick="navigate('import')">📥 Import Excel / CSV</button>
        <button class="nav-item" data-view="settings" onclick="navigate('settings')">⚙️ Settings &amp; Customize</button>
      </nav>
      <div class="sidebar-footer">
        <div id="sidebarUser" style="font-weight:600; color:#fff;"></div>
        <div id="sidebarRole" style="color:#94a3b8; margin-bottom:8px;"></div>
        <button class="btn btn-sm btn-secondary" style="width:100%;" onclick="logout()">Sign Out</button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-btn" onclick="toggleSidebar(true)">☰</button>
          <div class="topbar-title" id="pageTitle">Dashboard</div>
        </div>
        <div class="topbar-right">
          <span id="autoSyncBadge" class="badge badge-info" title="Auto-syncs with Google Drive every 5 minutes">Auto-Sync: 5m</span>
          <button class="btn btn-sm btn-secondary" onclick="refreshData(true)" title="Sync with Google Sheets & Drive">↻ Sync Now</button>
          <span id="clockActionArea"></span>
        </div>
      </header>

      <main class="content" id="mainContent"></main>
    </div>
  </div>

  <!-- Reusable Modal -->
  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div id="modalBox" class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Modal</h3>
        <button class="btn btn-sm btn-secondary close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
  const state = {
    user: null,
    view: 'dashboard',
    invTab: 'invoices',
    outTab: 'debtors',
    empTab: 'directory',
    attTab: 'attendance',
    data: {
      settings: {},
      users: [],
      customers: [],
      inventory: [],
      invoices: [],
      invoiceItems: [],
      creditors: [],
      pettyCash: [],
      callReports: [],
      projectReports: [],
      painterQuotations: [],
      painterBillBalances: [],
      employees: [],
      customTabs: [],
      customTabRows: [],
      transactions: [],
      attendance: [],
      leaves: [],
      tasks: [],
      savedReports: [],
      today: ''
    }
  };

  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxbtdlTd49UX0xd9WCu6gDao16cyHWZZld0bd-mx9LA9kYEc-LyqJc0Knuv1KtxuwfOnA/exec';
  const CACHE_KEY_DATA = 'JADE_OFFICE_DATA_CACHE';
  const CACHE_KEY_USER = 'JADE_OFFICE_USER_CACHE';

  /* ==========================================================================
   * Utilities & GAS Bridge
   * ======================================================================== */

  function gas(fnName, ...args) {
    document.getElementById('loadingBar').classList.remove('hidden');
    return new Promise((resolve, reject) => {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(res => {
            document.getElementById('loadingBar').classList.add('hidden');
            resolve(res);
          })
          .withFailureHandler(err => {
            document.getElementById('loadingBar').classList.add('hidden');
            const msg = err && err.message ? err.message : String(err);
            showToast('Error: ' + msg);
            reject(err);
          })[fnName](...args);
      } else {
        // Fallback for standalone / GitHub Pages / local: call Google Apps Script Web App via fetch POST
        fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: fnName, args: args })
        })
        .then(r => r.json())
        .then(res => {
          document.getElementById('loadingBar').classList.add('hidden');
          if (res && res.ok) {
            resolve(res.result !== undefined ? res.result : res.data);
          } else {
            const err = new Error(res && res.error ? res.error : 'Unknown backend error');
            showToast('Error: ' + err.message);
            reject(err);
          }
        })
        .catch(err => {
          document.getElementById('loadingBar').classList.add('hidden');
          showToast('Network error: ' + err.message);
          reject(err);
        });
      }
    });
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
  }

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtMoney(num) {
    const cur = state.data.settings.Currency || 'LKR';
    const val = Number(num || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return cur + ' ' + val;
  }

  function toggleSidebar(open) {
    document.getElementById('sidebar').classList.toggle('open', open);
  }

  function openModal(title, bodyHtml, footerHtml, large = false) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;

  /* ==========================================================================
   * Auth & Init
   * ======================================================================== */

  window.addEventListener('DOMContentLoaded', async () => {
    // 1. Instant cache load from localStorage (0ms load time!)
    try {
      const cachedUserStr = localStorage.getItem(CACHE_KEY_USER);
      const cachedDataStr = localStorage.getItem(CACHE_KEY_DATA);
      if (cachedUserStr && cachedDataStr) {
        const cachedUser = JSON.parse(cachedUserStr);
        const cachedData = JSON.parse(cachedDataStr);
        if (cachedUser && cachedData && cachedData.settings) {
          state.user = cachedUser;
          state.data = cachedData;
          document.getElementById('loginView').classList.add('hidden');
          document.getElementById('appShell').classList.remove('hidden');
          document.getElementById('sidebarUser').textContent = cachedUser.Name || 'User';
          document.getElementById('sidebarRole').textContent = cachedUser.Role || 'Staff';
          document.getElementById('brandName').textContent = cachedData.settings.CompanyName || 'Jade Coatings';
          renderCustomSidebarTabs();
          renderTopbarClock();
          renderView();
          startAutoSync();
          // Silently refresh fresh data from backend in background without freezing
          refreshData(false, /* silent */ true);
          return;
        }
      }
    } catch (e) {
      console.warn('Cache load error:', e);
    }

    // 2. If not logged in from cache, fetch login users
    try {
      const users = await gas('getLoginUsers');
      const sel = document.getElementById('loginUser');
      if (sel && users && users.length) {
        sel.innerHTML = users.map(u => `<option value="${esc(u.UserId)}">${esc(u.Name)} (${esc(u.Role)})</option>`).join('');
      }
    } catch (e) {}

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const userId = document.getElementById('loginUser').value;
      const pin = document.getElementById('loginPin').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const origText = submitBtn ? submitBtn.textContent : '';
      if (submitBtn) { submitBtn.textContent = 'Logging in...'; submitBtn.disabled = true; }

      try {
        const res = await gas('authenticateUser', userId, pin);
        state.user = res.user || res;
        try { localStorage.setItem(CACHE_KEY_USER, JSON.stringify(state.user)); } catch (e) {}

        if (res.data) {
          state.data = res.data;
          try { localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(state.data)); } catch (e) {}
          document.getElementById('brandName').textContent = state.data.settings?.CompanyName || 'Jade Coatings';
          renderCustomSidebarTabs();
          renderTopbarClock();
          renderView();
        } else {
          await refreshData();
        }

        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('appShell').classList.remove('hidden');
        document.getElementById('sidebarUser').textContent = state.user.Name;
        document.getElementById('sidebarRole').textContent = state.user.Role;
        startAutoSync();
      } catch (err) {
        showToast('Login failed: ' + (err.message || 'Invalid PIN'));
      } finally {
        if (submitBtn) { submitBtn.textContent = origText; submitBtn.disabled = false; }
      }
    });
  });

  function logout() {
    state.user = null;
    try { localStorage.removeItem(CACHE_KEY_USER); } catch (e) {}
    document.getElementById('loginPin').value = '';
    document.getElementById('appShell').classList.add('hidden');
    document.getElementById('loginView').classList.remove('hidden');
  }

  async function refreshData(backupToDrive = false, silent = false) {
    if (backupToDrive) {
      try { await gas('autoSyncDriveBackup'); } catch (e) {}
    }
    try {
      const data = await gas('getAppData');
      state.data = data;
      try { localStorage.setItem(CACHE_KEY_DATA, JSON.stringify(data)); } catch (e) {}
      if (data.settings) {
        document.getElementById('brandName').textContent = data.settings.CompanyName || 'Jade Coatings';
      }
      renderCustomSidebarTabs();
      renderTopbarClock();
      renderView();
      if (backupToDrive) showToast('Synced with Google Drive!');
    } catch (e) {
      if (!silent) showToast('Error refreshing data: ' + e.message);
    }
  }

  function renderCustomSidebarTabs() {
    const el = document.getElementById('customSidebarTabs');
    if (!el) return;
    el.innerHTML = (state.data.customTabs || []).map(t => `
      <button class="nav-item ${state.view === 'customTab:' + t.TabId ? 'active' : ''}" data-view="customTab:${esc(t.TabId)}" onclick="navigate('customTab:${esc(t.TabId)}')">
        ${esc(t.Icon || '📋')} ${esc(t.Name)}
      </button>
    `).join('');
  }

  let _syncSecondsLeft = 300;
  function startAutoSync() {
    clearInterval(window._autoSyncTimer);
    _syncSecondsLeft = 300;
    window._autoSyncTimer = setInterval(async () => {
      _syncSecondsLeft--;
      if (_syncSecondsLeft <= 0) {
        _syncSecondsLeft = 300;
        if (state.user) {
          await refreshData(true);
        }
      }
      const m = Math.floor(_syncSecondsLeft / 60);
      const s = String(_syncSecondsLeft % 60).padStart(2, '0');
      const badge = document.getElementById('autoSyncBadge');
      if (badge) badge.textContent = `Auto-Sync: ${m}:${s}`;
    }, 1000);
  }

  function navigate(view) {
    state.view = view;
    document.querySelectorAll('.nav-item').forEach(b => {
      b.classList.toggle('active', b.dataset.view === view);
    });
    toggleSidebar(false);
    renderView();
  }

  function renderTopbarClock() {
    const todayAtt = state.data.attendance.find(a => a.UserId === state.user.UserId && a.Date === state.data.today);
    const el = document.getElementById('clockActionArea');
    if (!todayAtt) {
      el.innerHTML = `<button class="btn btn-sm btn-success" onclick="handleClockIn()">Clock In</button>`;
    } else if (!todayAtt.ClockOut) {
      el.innerHTML = `<button class="btn btn-sm btn-danger" onclick="handleClockOut()">Clock Out (${esc(todayAtt.ClockIn)})</button>`;
    } else {
      el.innerHTML = `<span class="badge badge-success">Done ${esc(todayAtt.ClockIn)} - ${esc(todayAtt.ClockOut)}</span>`;
    }

    await gas('clockInUser', state.user.UserId, state.user.Name);

    await refreshData();

  function daysBetween(dateStr, refDateStr) {
    if (!dateStr) return 0;
    const d1 = new Date(dateStr);
    const d2 = new Date(refDateStr || state.data.today || new Date().toISOString().slice(0, 10));
    if (isNaN(d1) || isNaN(d2)) return 0;
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
  }

  function getCustomerOverdueInfo(customerId) {
    if (!customerId) return { blocked: false, maxDays: 0, balance: 0 };
    const unpaid = state.data.invoices.filter(i =>
      i.CustomerId === customerId &&
      i.Status !== 'Paid' && i.Status !== 'Cancelled' && i.Status !== 'Draft' &&
      (Number(i.Total || 0) - Number(i.PaidAmount || 0)) > 0
    );
    let maxDays = 0;
    let balance = 0;
    unpaid.forEach(i => {
      const bal = Number(i.Total || 0) - Number(i.PaidAmount || 0);
      balance += bal;
      const d = daysBetween(i.DueDate || i.Date, state.data.today);
      if (d > maxDays) maxDays = d;
    });
    return { blocked: maxDays > 120, maxDays, balance };
  }

  let _invLines = [];

  function checkInvCustomerBlock() {
    const custId = document.getElementById('fInvCust').value;
    const info = getCustomerOverdueInfo(custId);
    const alertEl = document.getElementById('invOverdueAlert');
    if (info.blocked) {
      document.getElementById('invOverdueMsg').textContent =
        `This customer has unpaid invoices overdue by ${info.maxDays} days (Balance: ${fmtMoney(info.balance)}).`;
      alertEl.classList.remove('hidden');
    } else {
      alertEl.classList.add('hidden');
    }

  function renderInvLines() {
    const invOpts = state.data.inventory.map(it => `<option value="${esc(it.ItemId)}">${esc(it.Name)} (${it.StockQty} ${esc(it.Unit)})</option>`).join('');
    document.getElementById('invLinesContainer').innerHTML = _invLines.map((ln, idx) => `
      <div style="display:grid; grid-template-columns:2fr 1.5fr 70px 100px 36px; gap:6px; margin-bottom:6px; align-items:center;">
        <select onchange="pickInvItem(${idx}, this.value)">
          <option value="">-- Custom Item --</option>
          ${invOpts}
        </select>
        <input placeholder="Item name" value="${esc(ln.ItemName)}" oninput="_invLines[${idx}].ItemName=this.value">
        <input type="number" min="1" value="${ln.Qty}" oninput="_invLines[${idx}].Qty=Number(this.value); updateInvTotals()">
        <input type="number" step="0.01" value="${ln.UnitPrice}" oninput="_invLines[${idx}].UnitPrice=Number(this.value); updateInvTotals()">
        <button type="button" class="btn btn-sm btn-danger" onclick="_invLines.splice(${idx},1); renderInvLines()">✕</button>
      </div>
    `).join('');

    // Set selected dropdown values
    const selects = document.querySelectorAll('#invLinesContainer select');
    _invLines.forEach((ln, idx) => { if (selects[idx]) selects[idx].value = ln.ItemId || ''; });
    updateInvTotals();
  }

  function pickInvItem(idx, itemId) {
    const item = state.data.inventory.find(x => x.ItemId === itemId);
    _invLines[idx].ItemId = itemId;
    if (item) {
      _invLines[idx].ItemName = item.Name;
      _invLines[idx].UnitPrice = Number(item.UnitPrice) || 0;
    }
    renderInvLines();
  }

  function addInvLine() {
    _invLines.push({ ItemId: '', ItemName: '', Qty: 1, UnitPrice: 0 });
    renderInvLines();
  }

  function updateInvTotals() {
    const sub = _invLines.reduce((s, l) => s + (Number(l.Qty || 0) * Number(l.UnitPrice || 0)), 0);
    const disc = Number(document.getElementById('fInvDisc')?.value || 0);
    const taxable = Math.max(0, sub - disc);
    const taxRate = Number(state.data.settings.TaxRate || 0);
    const tax = taxable * (taxRate / 100);
    const total = taxable + tax;
    const paid = Number(document.getElementById('fInvPaid')?.value || 0);
    const bal = Math.max(0, total - paid);
    document.getElementById('invTotalsPreview').innerHTML =
      `Subtotal: <b>${fmtMoney(sub)}</b> | Discount: <b>${fmtMoney(disc)}</b> | Tax (${taxRate}%): <b>${fmtMoney(tax)}</b> | Total: <b>${fmtMoney(total)}</b> | Balance: <b style="color:var(--danger)">${fmtMoney(bal)}</b>`;
    return { sub, disc, tax, total, paid };
  }

  async function submitInvoice(invoiceId) {
    const custId = document.getElementById('fInvCust').value;
    const status = document.getElementById('fInvStatus').value;
    const info = getCustomerOverdueInfo(custId);

    // Block >120 day overdue customers unless Login PIN override is verified
    if (info.blocked && status !== 'Draft' && status !== 'Cancelled') {
      const pin = document.getElementById('fInvOverridePin')?.value || '';
      if (!pin) {
        showToast('Blocked: Customer is >120 days overdue. Enter your Login PIN to issue!');
        return;
      }
      try {
        await gas('authenticateUser', state.user.UserId, pin);
      } catch (e) {
        showToast('Invalid Login PIN! Invoice blocked.');
        return;
      }
    }

    const cust = state.data.customers.find(c => c.CustomerId === custId);
    const { sub, disc, tax, total, paid } = updateInvTotals();
    const existing = invoiceId ? state.data.invoices.find(i => i.InvoiceId === invoiceId) : null;
    const finalPaid = status === 'Paid' ? total : paid;

    const payload = {
      invoice: {
        InvoiceId: invoiceId || '',
        InvoiceNo: existing ? existing.InvoiceNo : '',
        CustomerId: custId,
        CustomerName: cust ? cust.Name : 'Walk-in Customer',
        Date: document.getElementById('fInvDate').value,
        DueDate: document.getElementById('fInvDue').value,
        Status: status,
        Subtotal: sub,
        Discount: disc,
        TaxAmount: tax,
        Total: total,
        PaidAmount: finalPaid,
        Notes: document.getElementById('fInvNotes').value,
        CreatedBy: state.user.Name
      },
      items: _invLines.filter(l => l.ItemName.trim() !== '')
    };

    await gas('saveInvoice', payload);
    closeModal();
    showToast('Invoice saved!');
    await refreshData();
  }

  function normCallDate(d) {
    if (!d) return '';
    return String(d).trim().replace(/[./]/g, '-');
  }

  const SALES_CALL_COLS = [
    { key: 'Date', label: 'Date' },
    { key: 'SP', label: 'S.P' },
    { key: 'Route', label: 'Route' },
    { key: 'CallReport', label: 'Call Report' },

    { key: 'Date', label: 'Date' },
    { key: 'ManagerName', label: 'Manager Name' },
    { key: 'Route', label: 'Route' },
    { key: 'CallReport', label: 'Call Report' },
    { key: 'NewCustomer', label: 'New Customer', isNum: true },
    { key: 'RegularCustomer', label: 'Regular Customer', isNum: true },
    { key: 'SiteVisit', label: 'Site Visit', isNum: true },
    { key: 'TotalAmount', label: 'Total Amount', isNum: true, isHighlight: true },
    { key: 'WorkedNA', label: 'Worked / N.A' },
    { key: 'HardwareName', label: 'Hardware Name' },
    { key: 'StartMeterReading', label: 'Start Meter Reading', isNum: true },
    { key: 'EndMeterReading', label: 'End Meter Reading', isNum: true },
    { key: 'TotalMeter', label: 'Total Meter', isNum: true, isHighlight: true },
    { key: 'StartPhoto', label: 'Start Photo' },
    { key: 'StartLocation', label: 'Start Location' },
    { key: 'EndPhoto', label: 'End Photo' },
    { key: 'EndLocation', label: 'End Location' }
  ];

  function getCallVal(r, col) {
    const k = col.key;
    if (r[k] !== undefined && r[k] !== null && String(r[k]).trim() !== '') return r[k];
    if (r[col.label] !== undefined && r[col.label] !== null && String(r[col.label]).trim() !== '') return r[col.label];
    // Aliases
    if (k === 'SP') return r['S.P'] || r.sp || '';
    if (k === 'CallReport') return r['Call Report'] || r['Call \nReport'] || '';
    if (k === 'NoOfNewCus') return r['No of new Cus'] || r['No of \nnew Cus '] || 0;
    if (k === 'NoOfRegCus') return r['No of Reg Cus'] || r['No of \nReg Cus'] || 0;
    if (k === 'SiteVisit') return r['Site Visit'] || r['Site \nVisit '] || 0;
    if (k === 'WorkedNA') return r['WORKED/N.A'] || r['Worked / N.A'] || r.worked || '';
    if (k === 'HWNames') return r['H. W Names'] || r.HardwareName || '';
    if (k === 'EndM') return r['End M'] || 0;
    if (k === 'StartM') return r['Start M'] || 0;
    if (k === 'TotalKM') return r['Total KM'] || 0;
    if (k === 'StartPhoto') return r['Start Photo'] || r['Start Photo '] || '';
    if (k === 'EndPhoto') return r['End Photo'] || '';
    if (k === 'Location') return r.Location || '';
    if (k === 'ManagerName') return r['Manager Name'] || r['Manager Name '] || '';
    if (k === 'NewCustomer') return r['New Customer'] || r['New Customer '] || 0;
    if (k === 'RegularCustomer') return r['Regular Customer'] || r['Regular Customer '] || 0;
    if (k === 'TotalAmount') return r['Total Amount'] || r['Total Amount '] || r.Total || 0;
    if (k === 'HardwareName') return r['Hardware Name'] || r['Hardware Name '] || '';
    if (k === 'StartMeterReading') return r['Sart Meeter Reading'] || r['Start Meeter Reading'] || 0;
    if (k === 'EndMeterReading') return r['Ent  Meeter Reading'] || r['Ent Meeter Reading'] || 0;
    if (k === 'TotalMeter') return r['Total Meeter '] || r['Total Meeter'] || r['Total Meter'] || 0;
    if (k === 'StartLocation') return r['Start Locatio '] || r['Start Location'] || '';
    if (k === 'EndLocation') return r['Ent Location'] || r['End Location'] || '';
    return col.isNum ? 0 : '';
  }

  function renderCallReportsView() {
    const isSales = _callReportTab === 'sales';
    const reportType = isSales ? 'SalesExecutive' : 'Manager';
    const allReports = state.data.callReports || [];

    // Filter by sub-tab reportType
    const subReports = allReports.filter(r => {
      if (r.ReportType) return r.ReportType === reportType;
      let d = {};
      try { d = JSON.parse(r.DataJson || '{}'); } catch (e) {}
      if (isSales) {
        return !d.ManagerName && !d['Manager Name'] && !d['Manager Name '];
      } else {
        return !!(d.ManagerName || d['Manager Name'] || d['Manager Name ']);
      }
    });

    const activeCols = isSales ? SALES_CALL_COLS : MANAGER_CALL_COLS;

    // Parse data objects
    const parsedRows = subReports.map(r => {
      let data = {};
      try { data = JSON.parse(r.DataJson || '{}'); } catch (e) {}
      return {
        _id: r.CallId,
        _by: r.CreatedBy,
        ...data
      };
    });

    // Populate person list for filter
    const persons = Array.from(new Set(parsedRows.map(r => {
      return isSales ? String(getCallVal(r, { key: 'SP', label: 'S.P' })).trim() : String(getCallVal(r, { key: 'ManagerName', label: 'Manager Name' })).trim();
    }).filter(Boolean))).sort();

    // Available customer/hardware names for filter dropdown
    const customerList = Array.from(new Set([
      ...(state.data.customers || []).map(c => c.Name).filter(Boolean),
      ...parsedRows.map(r => isSales ? getCallVal(r, { key: 'HWNames' }) : getCallVal(r, { key: 'HardwareName' })).filter(Boolean)
    ])).sort();

    // Filter rows
    const filteredRows = parsedRows.filter(r => {
      const rawD = getCallVal(r, { key: 'Date', label: 'Date' });
      const d = normCallDate(rawD);
      if (_callReportFilter.startDate && d && d < _callReportFilter.startDate) return false;
      if (_callReportFilter.endDate && d && d > _callReportFilter.endDate) return false;

      const p = isSales ? String(getCallVal(r, { key: 'SP', label: 'S.P' })).trim() : String(getCallVal(r, { key: 'ManagerName', label: 'Manager Name' })).trim();
      if (_callReportFilter.person && p !== _callReportFilter.person) return false;

      if (_callReportFilter.customer) {
        const hw = isSales ? String(getCallVal(r, { key: 'HWNames' })).toLowerCase() : String(getCallVal(r, { key: 'HardwareName' })).toLowerCase();
        if (!hw.includes(_callReportFilter.customer.toLowerCase())) return false;
      }

      if (_callReportFilter.search) {
        const q = _callReportFilter.search.toLowerCase();
        const str = Object.values(r).join(' ').toLowerCase();
        if (!str.includes(q)) return false;
      }
      return true;
    });

    // Totals
    let sumNew = 0, sumReg = 0, sumSite = 0, sumTotal = 0, sumDist = 0;
    filteredRows.forEach(r => {
      if (isSales) {
        sumNew += Number(getCallVal(r, { key: 'NoOfNewCus', isNum: true })) || 0;
        sumReg += Number(getCallVal(r, { key: 'NoOfRegCus', isNum: true })) || 0;
        sumSite += Number(getCallVal(r, { key: 'SiteVisit', isNum: true })) || 0;
        sumTotal += Number(getCallVal(r, { key: 'Total', isNum: true })) || 0;
        sumDist += Number(getCallVal(r, { key: 'TotalKM', isNum: true })) || 0;
      } else {
        sumNew += Number(getCallVal(r, { key: 'NewCustomer', isNum: true })) || 0;
        sumReg += Number(getCallVal(r, { key: 'RegularCustomer', isNum: true })) || 0;
        sumSite += Number(getCallVal(r, { key: 'SiteVisit', isNum: true })) || 0;
        sumTotal += Number(getCallVal(r, { key: 'TotalAmount', isNum: true })) || 0;
        sumDist += Number(getCallVal(r, { key: 'TotalMeter', isNum: true })) || 0;
      }
    });

    function formatDisplayDate(dateStr) {
      if (!dateStr) return '';
      const d = String(dateStr).trim().replace(/[./]/g, '-');
      const parts = d.split('-');
      if (parts.length === 3) {
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const y = parts[0];
        const m = parseInt(parts[1], 10);
        const day = parseInt(parts[2], 10);
        if (!isNaN(m) && m >= 1 && m <= 12 && !isNaN(day)) {
          return `${day} ${months[m - 1]} ${y}`;
        }
      }
      return dateStr;
    }

    let rangeText = '';
    if (_callReportFilter.startDate && _callReportFilter.endDate) {
      if (_callReportFilter.startDate === _callReportFilter.endDate) {
        rangeText = formatDisplayDate(_callReportFilter.startDate);
      } else {
        rangeText = `From ${formatDisplayDate(_callReportFilter.startDate)} to ${formatDisplayDate(_callReportFilter.endDate)}`;
      }
    } else if (_callReportFilter.startDate) {
      rangeText = `From ${formatDisplayDate(_callReportFilter.startDate)} onwards`;
    } else if (_callReportFilter.endDate) {
      rangeText = `Up to ${formatDisplayDate(_callReportFilter.endDate)}`;
    } else {
      const rowDates = filteredRows.map(r => normCallDate(getCallVal(r, { key: 'Date', label: 'Date' }))).filter(Boolean).sort();
      if (rowDates.length > 0) {
        const minD = rowDates[0];
        const maxD = rowDates[rowDates.length - 1];
        rangeText = minD === maxD ? formatDisplayDate(minD) : `From ${formatDisplayDate(minD)} to ${formatDisplayDate(maxD)}`;
      } else {
        rangeText = 'From 26 October to 25 November 2026';
      }
    }

    const reportTitle = isSales
      ? `${rangeText} - Sales Executives Call Report`
      : `Manager's Call Report (${rangeText})`;

    document.getElementById('mainContent').innerHTML = `
      <div class="card no-print" style="margin-bottom:16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:14px;">
          <div class="btn-group" style="display:inline-flex;">

  window.calcSalesTotals = function() {
    const n1 = parseFloat(document.getElementById('cr_NoOfNewCus')?.value || 0) || 0;
    const n2 = parseFloat(document.getElementById('cr_NoOfRegCus')?.value || 0) || 0;
    const n3 = parseFloat(document.getElementById('cr_SiteVisit')?.value || 0) || 0;
    const totEl = document.getElementById('cr_Total');
    if (totEl) totEl.value = n1 + n2 + n3;

    const m1 = parseFloat(document.getElementById('cr_StartM')?.value || 0) || 0;
    const m2 = parseFloat(document.getElementById('cr_EndM')?.value || 0) || 0;
    const kmEl = document.getElementById('cr_TotalKM');
    if (kmEl) kmEl.value = (m2 > m1 ? m2 - m1 : 0);
  };

  window.calcManagerTotals = function() {
    const n1 = parseFloat(document.getElementById('cr_NewCustomer')?.value || 0) || 0;
    const n2 = parseFloat(document.getElementById('cr_RegularCustomer')?.value || 0) || 0;
    const n3 = parseFloat(document.getElementById('cr_SiteVisit')?.value || 0) || 0;

  async function importCallReportExcel(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        if (typeof XLSX === 'undefined') {
          showToast('Excel parser library not loaded.');
          return;
        }
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheetName = wb.SheetNames.includes('November 26') ? 'November 26' : wb.SheetNames[0];
        const ws = wb.Sheets[sheetName];
        const rawRows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

        // Auto-detect format or use current tab
        let isSales = _callReportTab === 'sales';
        const strAll = JSON.stringify(rawRows.slice(0, 4));
        if (strAll.includes('Sales') || strAll.includes('S.P')) isSales = true;
        else if (strAll.includes('Manager')) isSales = false;

        const toNum = (v) => {
          if (v === undefined || v === null) return 0;
          const s = String(v).trim();
          if (!s) return 0;
          const n = parseFloat(s);
          return isNaN(n) ? 0 : n;
        };

        const entries = [];
        if (isSales) {
          // Headers at row index 1, data starts at index 2
          for (let r = 2; r < rawRows.length; r++) {
            const row = rawRows[r] || [];
            const d = String(row[0] || '').trim();
            const sp = String(row[1] || '').trim();
            const route = String(row[2] || '').trim();
            const callRep = String(row[3] || '').trim();
            const newCus = toNum(row[4]);
            const regCus = toNum(row[5]);
            const siteVisit = toNum(row[6]);
            const total = toNum(row[7]) || (newCus + regCus + siteVisit);
            const photo = String(row[8] || '').trim();
            const worked = String(row[9] || '').trim();
            const hw = String(row[10] || '').trim();
            const endM = toNum(row[11]);
            const startM = toNum(row[12]);
            const totKm = toNum(row[13]) || (endM && startM ? endM - startM : 0);
            const sPhoto = String(row[14] || '').trim();
            const ePhoto = String(row[15] || '').trim();
            const loc = String(row[16] || '').trim();

            if (!d && !sp && !route && !hw) continue;
            entries.push({
              Date: d, SP: sp, Route: route, CallReport: callRep,
              NoOfNewCus: newCus, NoOfRegCus: regCus, SiteVisit: siteVisit, Total: total,
              Photo: photo, WorkedNA: worked, HWNames: hw,
              EndM: endM, StartM: startM, TotalKM: totKm,
              StartPhoto: sPhoto, EndPhoto: ePhoto, Location: loc
            });
          }
        } else {
          // Headers at row index 2, data starts at index 3 (starts at col B: index 1)
          for (let r = 3; r < rawRows.length; r++) {
            const row = rawRows[r] || [];
            const d = String(row[1] || '').trim();
            const mgr = String(row[2] || '').trim();
            const route = String(row[3] || '').trim();
            const callRep = String(row[4] || '').trim();
            const newCus = toNum(row[5]);
            const regCus = toNum(row[6]);
            const siteVisit = toNum(row[7]);
            const total = toNum(row[8]) || (newCus + regCus + siteVisit);
            const worked = String(row[9] || '').trim();
            const hw = String(row[10] || '').trim();
            const startM = toNum(row[11]);
            const endM = toNum(row[12]);
            const totM = toNum(row[13]) || (endM && startM ? endM - startM : 0);
            const sPhoto = String(row[14] || '').trim();
            const sLoc = String(row[15] || '').trim();
            const ePhoto = String(row[16] || '').trim();
            const eLoc = String(row[17] || '').trim();

            if (!d && !mgr && !route && !hw) continue;
            entries.push({
              Date: d, ManagerName: mgr, Route: route, CallReport: callRep,
              NewCustomer: newCus, RegularCustomer: regCus, SiteVisit: siteVisit, TotalAmount: total,
              WorkedNA: worked, HardwareName: hw,
              StartMeterReading: startM, EndMeterReading: endM, TotalMeter: totM,
              StartPhoto: sPhoto, StartLocation: sLoc, EndPhoto: ePhoto, EndLocation: eLoc
            });
          }
        }

        if (!entries.length) {
          showToast('No valid rows found in selected file.');
          return;
        }

        const reportType = isSales ? 'SalesExecutive' : 'Manager';
        const label = isSales ? 'Sales Executives' : 'Manager';
        if (confirm(`Detected ${entries.length} valid rows for ${label} Call Report. Import now?`)) {
          showToast('Importing ' + entries.length + ' entries...');
          await gas('importReportEntries', 'CallReports', entries, state.user.Name, reportType);
          showToast('Successfully imported ' + entries.length + ' entries!');
          _callReportTab = isSales ? 'sales' : 'manager';
          await refreshData();
        }
      } catch (err) {
        showToast('Error importing Excel: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function exportCallReportExcel() {
    const isSales = _callReportTab === 'sales';
    const reportType = isSales ? 'SalesExecutive' : 'Manager';
    const allReports = state.data.callReports || [];
    const subReports = allReports.filter(r => {
      if (r.ReportType) return r.ReportType === reportType;
      let d = {};
      try { d = JSON.parse(r.DataJson || '{}'); } catch (e) {}
      return isSales ? (!d.ManagerName && !d['Manager Name']) : (!!(d.ManagerName || d['Manager Name']));
    });

    const parsed = subReports.map(r => {
      let data = {};
      try { data = JSON.parse(r.DataJson || '{}'); } catch (e) {}
      return { _id: r.CallId, ...data };
    });

    const filtered = parsed.filter(r => {
      const rawD = getCallVal(r, { key: 'Date', label: 'Date' });
      const d = normCallDate(rawD);
      if (_callReportFilter.startDate && d && d < _callReportFilter.startDate) return false;
      if (_callReportFilter.endDate && d && d > _callReportFilter.endDate) return false;
      const p = isSales ? String(getCallVal(r, { key: 'SP', label: 'S.P' })).trim() : String(getCallVal(r, { key: 'ManagerName', label: 'Manager Name' })).trim();
      if (_callReportFilter.person && p !== _callReportFilter.person) return false;
      if (_callReportFilter.customer) {
        const hw = isSales ? String(getCallVal(r, { key: 'HWNames' })).toLowerCase() : String(getCallVal(r, { key: 'HardwareName' })).toLowerCase();
        if (!hw.includes(_callReportFilter.customer.toLowerCase())) return false;
      }
      return true;
    });

    const activeCols = isSales ? SALES_CALL_COLS : MANAGER_CALL_COLS;
    const rows = filtered.map(r => {
      const row = {};
      activeCols.forEach(c => {
        row[c.label] = getCallVal(r, c);
      });
      return row;
    });

    if (typeof XLSX !== 'undefined') {
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      const sheetTitle = isSales ? 'Sales Executives' : 'Manager';
      XLSX.utils.book_append_sheet(wb, ws, sheetTitle);
      const dateTag = (_callReportFilter.startDate || _callReportFilter.endDate)
        ? `_${_callReportFilter.startDate || 'start'}_to_${_callReportFilter.endDate || 'end'}`
        : `_${state.data.today || 'export'}`;
      XLSX.writeFile(wb, `${isSales ? 'Call_Report_Sales_Executives' : 'Managers_Call_Report'}${dateTag}.xlsx`);
    } else {
      showToast('Export failed: XLSX library not loaded');
    }
  }

  function uploadTemplateFile(sheetName, file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        let json = [];
        if (typeof XLSX !== 'undefined') {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          json = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
        } else {
          const text = new TextDecoder().decode(e.target.result);
          const lines = text.split(/\r?\n/).filter(l => l.trim());
          const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
          json = lines.slice(1).map(l => {
            const cols = l.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            const obj = {};
            headers.forEach((h, i) => { obj[h] = cols[i] || ''; });
            return obj;
          });
        }
        if (!json.length) { showToast('Uploaded file is empty.'); return; }
        const cols = Object.keys(json[0]);
        const settingKey = sheetName === 'CallReports' ? 'CallReportTemplate' : 'ProjectReportTemplate';
        await gas('saveSettings', { [settingKey]: JSON.stringify(cols) });
        if (confirm(`Detected ${cols.length} columns and ${json.length} rows. Import all ${json.length} rows now?`)) {
          await gas('importReportEntries', sheetName, json, state.user.Name);
        }
        showToast('Template & data updated!');
        await refreshData();
      } catch (err) {
        showToast('Error reading file: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  async function submitPainterQuotation(id) {
    const quotFor = document.getElementById('pq_for')?.value.trim() || '';
    const title = document.getElementById('pq_title')?.value.trim() || quotFor || 'Painter Training';
    const qNo = document.getElementById('pq_no')?.value.trim();
    const date = document.getElementById('pq_date')?.value.trim();
    if (!quotFor && !title) {
      showToast('Please enter the recipient name in QUOTATION FOR.');
      return;
    }
    if (!qNo) {
      showToast('Please enter Quotation No.');
      return;
    }

    const supplier = document.getElementById('pq_supplier')?.value.trim() || '';
    const receivers = document.getElementById('pq_receivers')?.value.trim() || '';
    const place = document.getElementById('pq_place')?.value.trim() || '';
    const time = document.getElementById('pq_time')?.value.trim() || '';
    const adv = parseFloat(document.getElementById('pq_adv')?.value || 0) || 0;

    const items = (window._tempQuotItems || [])
      .filter(it => it && (it.desc && it.desc.trim() !== ''))
      .map((it, idx) => ({
        no: idx + 1,
        desc: it.desc.trim(),
        qty: Number(it.qty || 0),
        price: Number(it.price || 0),
        amount: Number(it.qty || 0) * Number(it.price || 0)
      }));

    const totalAmt = items.reduce((s, it) => s + it.amount, 0);
    const remAmt = totalAmt - adv;

    await gas('savePainterQuotation', {
      QuotationId: id || undefined,
      QuotationNo: qNo,
      Date: date,
      Title: title,
      QuotationFor: quotFor,
      Supplier: supplier,
      Receivers: receivers,
      Place: place,
      Time: time,
      TotalAmount: totalAmt,
      AdvanceAmount: adv,
      RemainingAmount: remAmt,
      ItemsJson: JSON.stringify(items),
      Status: 'Active',
      CreatedBy: state.user.Name
    });

    closeModal();
    showToast('Painter Training Quotation saved!');
    await refreshData();
    _selectedQuotationId = id || state.data.painterQuotations[state.data.painterQuotations.length - 1]?.QuotationId;
    renderPainterTrainingView();
  }

  async function deletePainterQuotationAction(id) {
    if (!id || !confirm('Are you sure you want to delete this quotation?')) return;
    await gas('deletePainterQuotation', id);
    showToast('Quotation deleted.');
    _selectedQuotationId = '';
    await refreshData();
    renderPainterTrainingView();
  }

  async function importPainterQuotationExcel(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        if (typeof XLSX === 'undefined') { showToast('XLSX library not loaded.'); return; }
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheetName = wb.SheetNames[0];
        const ws = wb.Sheets[sheetName];

        const title = ws['B3'] ? ws['B3'].v : sheetName;
        const date = ws['E4'] ? ws['E4'].v : (state.data.today || '');
        const qNo = ws['E5'] ? ws['E5'].v : ('PTQ-' + sheetName);
        const supp = ws['B6'] ? ws['B6'].v : '';
        const recv = ws['E6'] ? ws['E6'].v : 'Jade Coatings';
        const placeTime = ws['B14'] ? String(ws['B14'].v || '') : '';

        const rawRows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        const items = [];
        for (let r = 16; r < Math.min(rawRows.length, 24); r++) {
          const row = rawRows[r] || [];
          const no = row[1];
          const desc = row[2];
          const qty = parseFloat(row[3]) || 0;
          const price = parseFloat(row[4]) || 0;
          const amt = parseFloat(row[5]) || (qty * price);
          if (desc && String(desc).trim() && !String(desc).includes('Total Amount')) {
            items.push({
              no: no || items.length + 1,
              desc: String(desc).trim(),
              qty: qty,
              price: price,
              amount: amt
            });
          }
        }

        const adv = ws['F25'] ? (parseFloat(ws['F25'].v) || 0) : 0;
        const tot = items.reduce((s, it) => s + it.amount, 0);

        const newQ = {
          QuotationNo: String(qNo).trim(),
          Date: String(date).trim(),
          Title: String(title).replace(/QUOTATION FOR /i, '').trim(),
          QuotationFor: String(title).replace(/QUOTATION FOR /i, '').trim(),
          Supplier: String(supp).trim(),
          Receivers: String(recv).trim(),
          Place: placeTime.split('\n')[0] || '',
          Time: placeTime.split('\n')[1] || '',
          TotalAmount: tot,
          AdvanceAmount: adv,
          RemainingAmount: tot - adv,
          ItemsJson: JSON.stringify(items.length ? items : DEFAULT_QUOTATION_ITEMS),
          Status: 'Active',
          CreatedBy: state.user.Name
        };

        await gas('savePainterQuotation', newQ);
        showToast('Quotation imported successfully!');
        await refreshData();
        renderPainterTrainingView();
      } catch (err) {
        showToast('Error importing quotation: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  async function importPainterBillBalanceExcel(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        if (typeof XLSX === 'undefined') { showToast('XLSX library not loaded.'); return; }
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheetName = wb.SheetNames[0];
        const ws = wb.Sheets[sheetName];
        const progName = sheetName.trim();

        const rawRows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        const entries = [];
        // Rows 5..12
        for (let r = 5; r < rawRows.length; r++) {
          const row = rawRows[r] || [];
          const d = String(row[1] || '').trim();
          const desc = String(row[2] || '').trim();
          const w = parseFloat(row[3]) || 0;
          const dep = parseFloat(row[4]) || 0;
          if (desc && !desc.toLowerCase().includes('total')) {
            entries.push({
              ProgramName: progName,
              Date: d || state.data.today,
              Description: desc,
              Withdrawal: w,
              Deposit: dep,
              Balance: dep - w
            });
          }
        }

        if (!entries.length) {
          showToast('No transaction rows found in selected file. Template is ready for entries.');
          _selectedBbProgram = progName;
          renderPainterTrainingView();
          return;
        }

        await gas('importPainterBillBalances', entries, state.user.Name);
        showToast(`Imported ${entries.length} ledger entries!`);
        _selectedBbProgram = progName;
        await refreshData();
        renderPainterTrainingView();
      } catch (err) {
        showToast('Error importing bill balance: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function exportPainterQuotationExcel() {
    const quotations = state.data.painterQuotations || [];
    const activeQ = quotations.find(q => q.QuotationId === _selectedQuotationId) || quotations[0];
    if (!activeQ) { showToast('No quotation to export.'); return; }

    let items = [];
    try { items = JSON.parse(activeQ.ItemsJson || '[]'); } catch (e) {}
    if (!items.length) items = DEFAULT_QUOTATION_ITEMS;
    items = items.filter(it => it && ((it.desc && it.desc.trim() !== '') || it.qty > 0 || it.price > 0));

    const rows = items.map((it, idx) => ({
      'No.': it.no || (idx + 1),
      'Description': it.desc || '',
      'Quantity': it.qty || 0,
      'Price': it.price || 0,
      'Amount': it.amount || ((it.qty || 0) * (it.price || 0))
    }));

    rows.push({ 'No.': '', 'Description': 'Total Amount', 'Quantity': '', 'Price': '', 'Amount': activeQ.TotalAmount || 0 });
    rows.push({ 'No.': '', 'Description': 'Advance Amount', 'Quantity': '', 'Price': '', 'Amount': activeQ.AdvanceAmount || 0 });
    rows.push({ 'No.': '', 'Description': 'Remaining Amount', 'Quantity': '', 'Price': '', 'Amount': activeQ.RemainingAmount || 0 });

    if (typeof XLSX !== 'undefined') {
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Quotation');
      XLSX.writeFile(wb, `Painter_Quotation_${(activeQ.Title || 'export').replace(/[^a-zA-Z0-9]/g, '_')}.xlsx`);
    }
  }

  function exportPainterBillBalanceExcel() {
    const balances = state.data.painterBillBalances || [];
    const activeProg = _selectedBbProgram || '';
    const progBalances = balances.filter(b => !activeProg || b.ProgramName === activeProg);

    let running = 0;
    const rows = progBalances.map(r => {
      const dep = Number(r.Deposit || 0);
      const w = Number(r.Withdrawal || 0);
      running += (dep - w);
      return {
        'Date': r.Date || '',
        'Description': r.Description || '',
        'Withdrawal': w,
        'Deposit': dep,
        'Balance': running
      };
    });

    if (typeof XLSX !== 'undefined') {
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Bill Balance');
      XLSX.writeFile(wb, `Painter_Bill_Balance_${(activeProg || 'All').replace(/[^a-zA-Z0-9]/g, '_')}.xlsx`);

  const _pcState = {

  function renderPettyCashView() {
    const today = state.data.today || new Date().toISOString().slice(0, 10);
    if (!_pcState.date) _pcState.date = today;
    if (!_pcState.month) _pcState.month = today.slice(0, 7);

    const all = state.data.pettyCash || [];
    const isIn = (p) => p.Type === 'In' || p.Type === 'Cash In';
    const isOut = (p) => p.Type === 'Out' || p.Type === 'Cash Out';

    const periodStart = _pcState.mode === 'daily' ? _pcState.date : (_pcState.month + '-01');
    const prevRows = all.filter(p => String(p.Date) < periodStart);
    const prevBalance = prevRows.reduce((s, p) => s + (isIn(p) ? Number(p.Amount || 0) : -Number(p.Amount || 0)), 0);

    const currentRows = all.filter(p =>
      _pcState.mode === 'daily'
        ? String(p.Date) === _pcState.date
        : String(p.Date).startsWith(_pcState.month)
    );

    const inRows = currentRows.filter(isIn);
    const outRows = currentRows.filter(isOut);

    const periodInSum = inRows.reduce((s, p) => s + Number(p.Amount || 0), 0);
    const totalInWithBF = prevBalance + periodInSum;
    const totalOut = outRows.reduce((s, p) => s + Number(p.Amount || 0), 0);
    const balanceCF = totalInWithBF - totalOut;

    const maxLen = Math.max(inRows.length + 1, outRows.length, 5);
    const prevLabel = _pcState.mode === 'daily'
      ? `Balance from previous day`
      : `Balance from previous month`;
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const [yy, mm] = _pcState.month.split('-');
    const monthTitle = `${monthNames[Number(mm) - 1] || mm} ${yy}`;
    const reportTitle = _pcState.mode === 'daily'
      ? `Daily Petty Cash Report - Office - ${_pcState.date.replace(/-/g, '.')}`
      : `Petty Cash Collection Report - Office - ${monthTitle}`;

    let bodyRows = '';
    for (let i = 0; i < maxLen; i++) {
      let inCells = '';
      if (i === 0) {
        inCells = `<td class="pc-balance-prev"></td><td class="pc-balance-prev"><b>${esc(prevLabel)}</b></td><td class="pc-balance-prev pc-divider" style="text-align:right;"><b>${fmtMoney(prevBalance)}</b></td>`;
      } else {
        const inItem = inRows[i - 1];
        inCells = inItem
          ? `<td>${esc(inItem.Date)}</td><td>${esc(inItem.ReceiptNo || inItem.VoucherNo)} <button class="btn btn-sm btn-danger no-print" style="padding:1px 5px;font-size:10px;" onclick="removePettyCash('${esc(inItem.PcId)}')">✕</button></td><td style="text-align:right;">${fmtMoney(inItem.Amount)}</td>`
          : `<td>&nbsp;</td><td></td><td></td>`;
      }

      const outItem = outRows[i];
      const outCells = outItem
        ? `<td>${esc(outItem.Date)}</td><td>${esc(outItem.ReceiptNo || outItem.VoucherNo)}</td><td>${esc(outItem.PaidTo)}</td><td>${esc(outItem.Description)} <button class="btn btn-sm btn-danger no-print" style="padding:1px 5px;font-size:10px;" onclick="removePettyCash('${esc(outItem.PcId)}')">✕</button></td><td style="text-align:right;">${fmtMoney(outItem.Amount)}</td>`
        : `<td>&nbsp;</td><td></td><td></td><td></td><td></td>`;

      bodyRows += `<tr>${inCells}${outCells}</tr>`;
    }

    document.getElementById('mainContent').innerHTML = `
      <div class="tabs no-print">
        <button class="tab-btn ${_pcState.mode === 'daily' ? 'active' : ''}" onclick="_pcState.mode='daily'; renderPettyCashView()">Daily Petty Cash Report</button>
        <button class="tab-btn ${_pcState.mode === 'monthly' ? 'active' : ''}" onclick="_pcState.mode='monthly'; renderPettyCashView()">Monthly Collection Report</button>
      </div>

      <div class="kpi-grid no-print">
        <div class="card"><div class="kpi-label">Balance B/F</div><div class="kpi-val">${fmtMoney(prevBalance)}</div></div>
        <div class="card"><div class="kpi-label">Total In (incl. B/F)</div><div class="kpi-val" style="color:var(--success)">${fmtMoney(totalInWithBF)}</div></div>
        <div class="card"><div class="kpi-label">Total Out</div><div class="kpi-val" style="color:var(--danger)">${fmtMoney(totalOut)}</div></div>
        <div class="card"><div class="kpi-label">Balance Carry Forward</div><div class="kpi-val" style="color:var(--primary)">${fmtMoney(balanceCF)}</div></div>
      </div>

      <div class="section-header no-print">
        <div class="section-actions">
          ${_pcState.mode === 'daily'
            ? `<input type="date" style="width:auto;" value="${esc(_pcState.date)}" onchange="_pcState.date=this.value; renderPettyCashView()">`
            : `<input type="month" style="width:auto;" value="${esc(_pcState.month)}" onchange="_pcState.month=this.value; renderPettyCashView()">`
          }
          <label class="btn btn-sm btn-secondary" style="cursor:pointer; margin:0;">
            📤 Import Excel
            <input type="file" accept=".xlsx,.xls,.csv" style="display:none;" onchange="importPettyCashFormat(this.files[0])">
          </label>
          <button class="btn btn-sm btn-secondary" onclick="exportPettyCashExcel()">⬇ Export Excel</button>

        </div>
        <div class="section-actions">
          <button class="btn btn-success" onclick="openPettyCashModal('In')">+ Add In (Cash/Invoice)</button>
          <button class="btn btn-primary" onclick="openPettyCashModal('Out')">+ Add Out (Expense)</button>
        </div>
      </div>

      <div class="card table-wrap">
        <table id="pcTable" style="border:1px solid #cbd5e1; border-collapse:collapse;">
          <thead>
            <tr>
              <th colspan="8" class="pc-title" style="text-align:center; font-size:16px; font-weight:700; padding:12px; background:#231f20; color:#ffffff; border-bottom:3px solid #00a651;">
                ${esc(reportTitle)}
              </th>
            </tr>
            <tr>
              <th colspan="3" class="pc-group-in pc-divider" style="text-align:center; font-size:13px; font-weight:700; background:#00a651; color:#ffffff; border-right:2px solid #074626;">IN (Receipts)</th>
              <th colspan="5" class="pc-group-out" style="text-align:center; font-size:13px; font-weight:700; background:#dc2626; color:#ffffff;">OUT (Payments)</th>

              <th class="pc-sub" style="background:#ebf8f2; color:#074626;">Invoice no</th>

              <th class="pc-sub" style="background:#fef2f2; color:#991b1b;">Date:</th>
              <th class="pc-sub" style="background:#fef2f2; color:#991b1b;">Bill No:</th>
              <th class="pc-sub" style="background:#fef2f2; color:#991b1b;">Received By</th>
              <th class="pc-sub" style="background:#fef2f2; color:#991b1b;">Description</th>
              <th class="pc-sub" style="text-align:right; background:#fef2f2; color:#991b1b;">Amount:</th>
            </tr>
          </thead>
          <tbody>${bodyRows}</tbody>
          <tfoot>
            <tr class="pc-total" style="background:#f1f5f9; font-weight:700; color:#231f20;">
              <td></td><td>Total</td><td class="pc-divider pc-amt-in" style="text-align:right; color:#00a651; border-right:2px solid #074626;">${fmtMoney(periodInSum)}</td>

  function importPettyCashFormat(file) {
    if (!file || typeof XLSX === 'undefined') return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      const toImport = [];
      rows.forEach(r => {
        // Check In side (Cols B,C,D -> idx 1,2,3) and Out side (Cols E,F,G,H,I -> idx 4,5,6,7,8)
        const inAmt = Number(r[3]);
        if (r[1] && !isNaN(inAmt) && inAmt > 0 && !/date/i.test(String(r[1]))) {
          toImport.push({ Date: String(r[1]).slice(0, 10), Type: 'In', ReceiptNo: String(r[2]), Amount: inAmt, Description: 'Imported In', RecordedBy: state.user.Name });
        }
        const outAmt = Number(r[8]);
        if (r[4] && !isNaN(outAmt) && outAmt > 0 && !/date/i.test(String(r[4]))) {
          toImport.push({ Date: String(r[4]).slice(0, 10), Type: 'Out', ReceiptNo: String(r[5]), PaidTo: String(r[6]), Description: String(r[7]), Amount: outAmt, RecordedBy: state.user.Name });
        }
      });
      if (toImport.length) {
        await gas('importRecords', 'PettyCash', toImport);
        showToast(`Imported ${toImport.length} petty cash entries!`);
        await refreshData();
      } else {
        showToast('No valid In/Out entries found in file.');
      }
    };
    reader.readAsArrayBuffer(file);
  }

        <table id="stockTable">
          <thead><tr><th>SKU</th><th>Item Name</th><th>Category</th><th>Unit Price</th><th>Stock Qty</th><th>Stock Value</th><th>Status</th><th>Quick Adjust</th><th>Actions</th></tr></thead>
          <tbody>
            ${items.map(it => {
              const qty = Number(it.StockQty) || 0;
              const val = qty * (Number(it.UnitPrice) || 0);
              const low = qty <= Number(it.ReorderLevel);
              const badge = qty <= 0 ? 'badge-danger">Out of Stock' : (low ? 'badge-warning">Low Stock' : 'badge-success">In Stock');
              return `
                <tr class="${qty <= 0 ? 'row-overdue' : ''}">
                  <td>${esc(it.SKU)}</td>
                  <td><b>${esc(it.Name)}</b></td>
                  <td>${esc(it.Category)}</td>
                  <td>${fmtMoney(it.UnitPrice)}</td>
                  <td><b>${qty}</b> ${esc(it.Unit)}</td>
                  <td>${fmtMoney(val)}</td>
                  <td><span class="badge ${badge}</span></td>
                  <td>
                    <button class="btn btn-sm btn-secondary" onclick="adjustStockQuick('${esc(it.ItemId)}', 1)">+1</button>
                    <button class="btn btn-sm btn-secondary" onclick="adjustStockQuick('${esc(it.ItemId)}', -1)">-1</button>
                  </td>
                  <td>
                    <button class="btn btn-sm btn-secondary" onclick="openInventoryModal('${esc(it.ItemId)}')">Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="removeInventory('${esc(it.ItemId)}')">Del</button>
                  </td>
                </tr>
              `;
            }).join('') || '<tr><td colspan="9" style="color:var(--muted)">No stock items yet.</td></tr>'}
          </tbody>
        </table>
      </div>
    `;
  }

  async function adjustStockQuick(itemId, delta) {
    const it = state.data.inventory.find(x => x.ItemId === itemId);
    if (!it) return;
    await gas('saveInventoryItem', { ...it, StockQty: Math.max(0, (Number(it.StockQty) || 0) + delta) });
    await refreshData();
  }
