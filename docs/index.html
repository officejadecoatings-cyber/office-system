<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Office System</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
  :root {
    --bg: #f7fbf9;
    --surface: #ffffff;
    --border: #d1fae5;
    --text: #231f20;
    --muted: #4b5563;
    --primary: #00a651;
    --primary-hover: #008f45;
    --primary-light: #ebf8f2;
    --brand-dark: #074626;
    --success: #00a651;
    --success-bg: #ebf8f2;
    --warning: #d97706;
    --warning-bg: #fef3c7;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --sidebar-w: 245px;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }

  .hidden { display: none !important; }

  /* Login Screen */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #ebf8f2 0%, #ffffff 55%, #e6f4ec 100%);
  }
  .login-logo {
    display: block;
    max-width: 180px;
    max-height: 80px;
    object-fit: contain;
    margin: 0 auto 14px auto;
    border-radius: 8px;
  }
  .sidebar-logo {
    width: 34px;
    height: 34px;
    object-fit: cover;
    border-radius: 6px;
    background: #fff;
    flex-shrink: 0;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
  }
  .login-card h1 { font-size: 20px; margin-bottom: 4px; }
  .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  /* App Shell */
  .app-shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w);
    background: #231f20;
    color: #e5e7eb;
    border-right: 2px solid var(--brand-dark);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; bottom: 0; left: 0;
    z-index: 40;
    transition: transform 0.2s ease;
  }
  .sidebar-brand {
    padding: 16px 18px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    border-bottom: 1px solid var(--brand-dark);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border: none;
    background: transparent;
    color: #94a3b8;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    margin-bottom: 4px;
    transition: all 0.15s;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item.active { background: var(--primary); color: #fff; }
  .sidebar-footer {
    padding: 14px 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 12px;
  }

  .main-wrap {
    flex: 1;
    margin-left: var(--sidebar-w);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-title { font-size: 17px; font-weight: 600; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .menu-btn {
    display: none;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }

  .content { padding: 24px; max-width: 1320px; width: 100%; margin: 0 auto; }

  /* Cards & Grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.03);
  }
  .kpi-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .kpi-val { font-size: 24px; font-weight: 700; margin-top: 6px; }
  .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .section-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .section-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab-btn {
    padding: 8px 14px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-weight: 600;
    color: var(--muted);
  }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* Forms & Buttons */
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  input, select, textarea {
    width: 100%;
    padding: 8px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  .search-input { width: 240px; max-width: 100%; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary { background: #fff; border-color: var(--border); color: var(--text); }
  .btn-secondary:hover { background: #f8fafc; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); background: #f8fafc; font-weight: 600; }
  tr:hover td { background: #f8fafc; }

  /* Badges */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-success { background: var(--success-bg); color: var(--success); }
  .badge-warning { background: var(--warning-bg); color: var(--warning); }
  .badge-danger { background: var(--danger-bg); color: var(--danger); }
  .badge-info { background: var(--primary-light); color: var(--primary); }
  .badge-muted { background: #e2e8f0; color: #475569; }
  .row-overdue td { background: #fef2f2 !important; color: #991b1b; }
  .alert-danger {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .nav-divider { border-top: 1px solid rgba(255,255,255,0.08); margin: 10px 8px; }

  /* Kanban / Tasks */
  .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .kanban-col { background: #eef2f6; border-radius: var(--radius); padding: 12px; min-height: 300px; }
  .kanban-col h4 { font-size: 13px; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .task-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .task-title { font-weight: 600; margin-bottom: 4px; }
  .task-meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; margin-top: 8px; }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 60;
  }
  .modal {
    background: #fff;
    border-radius: 12px;
    width: 100%;
    max-width: 620px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  }
  .modal-lg { max-width: 820px; }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-body { padding: 20px; overflow-y: auto; }
  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* Toast & Loader */
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #0f172a;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 80;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
  }
  .loading-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--primary);
    z-index: 90;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  @media (max-width: 860px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main-wrap { margin-left: 0; }
    .menu-btn { display: inline-flex; }
    .two-col, .kanban, .form-row { grid-template-columns: 1fr; }
  }

  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .sidebar, .topbar, .no-print, .modal-footer, .modal-header .close-btn { display: none !important; }
    body, .main-wrap, .content, .card, .modal-backdrop, .modal { position: static; background: #fff; box-shadow: none; border: none; margin: 0; padding: 0; max-width: 100%; max-height: none; }
    #pcTable { border-collapse: collapse; width: 100%; border: 1px solid #000 !important; }
    #pcTable th, #pcTable td { border: 1px solid #000 !important; font-size: 13px; }
    #pcTable .pc-title { background: #b9d2e6 !important; color: #000 !important; border: 1px solid #000 !important; font-weight: 700; }
    #pcTable .pc-group-in, #pcTable .pc-group-out { background: #ffffff !important; color: #000 !important; border: 1px solid #000 !important; font-weight: 700; }
    #pcTable .pc-sub { background: #9bc2e3 !important; color: #000 !important; border: 1px solid #000 !important; font-weight: 700; }
    #pcTable .pc-balance-prev { background: #cfdce4 !important; color: #000 !important; border: 1px solid #000 !important; }
    #pcTable .pc-total, #pcTable .pc-total td { background: #ffffff !important; color: #000 !important; border: 1px solid #000 !important; font-weight: 700; }
    #pcTable .pc-cf-empty { background: transparent !important; border: none !important; }
    #pcTable .pc-cf-label { background: #ffffff !important; color: #000 !important; border-top: none !important; border-left: 1px solid #000 !important; border-right: 1px solid #000 !important; border-bottom: 1px solid #000 !important; font-weight: 700; text-align: right; }
    #pcTable .pc-cf-val { background: #ffffff !important; color: #000 !important; border-top: none !important; border-left: 1px solid #000 !important; border-right: 1px solid #000 !important; border-bottom: 1px solid #000 !important; font-weight: 700; text-align: right; text-decoration: underline; }
    #pcTable .pc-divider { border-right: 1px solid #000 !important; }
    #pcTable .pc-amt-in, #pcTable .pc-amt-out, #pcTable .pc-amt-cf { color: #000 !important; }
  }
</style>

</head>
<body>
  <div id="loadingBar" class="loading-bar hidden"></div>

  <!-- Login Screen -->
  <div id="loginView" class="login-wrap">
    <div class="login-card">
      <img src="logo.jpg" onerror="this.src='https://jade-office-system-app.netlify.app/logo.jpg'" alt="Logo" class="login-logo">
      <h1 style="text-align:center;">System Manager</h1>
      <p style="text-align:center;">Sign in with your team profile and PIN</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginUser">Team Member</label>
          <select id="loginUser" required>
            <option value="">Loading users...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="loginPin">PIN</label>
          <input type="password" id="loginPin" placeholder="Enter 4-digit PIN" required maxlength="10">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
      </form>
      <p style="margin-top:14px; font-size:11px; color:#94a3b8; text-align:center;">
        Default Admin PIN: 1234 (Change in Settings)
      </p>
    </div>
  </div>

  <!-- Main App Shell -->
  <div id="appShell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div style="display:flex; align-items:center; gap:10px; min-width:0;">
          <img src="logo.jpg" onerror="this.src='https://jade-office-system-app.netlify.app/logo.jpg'" alt="Logo" class="sidebar-logo">
          <span id="brandName" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">System Manager</span>
        </div>
        <button class="btn btn-sm btn-secondary hidden" id="closeSidebarBtn" onclick="toggleSidebar(false)">✕</button>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="dashboard" onclick="navigate('dashboard')">📊 Dashboard</button>
        <button class="nav-item" data-view="invoices" onclick="navigate('invoices')">🧾 Invoices</button>
        <button class="nav-item" data-view="outstanding" onclick="navigate('outstanding')">⏳ Outstanding</button>
        <button class="nav-item" data-view="inventory" onclick="navigate('inventory')">📦 Stock</button>
        <button class="nav-item" data-view="callReport" onclick="navigate('callReport')">📞 Call Report</button>
        <button class="nav-item" data-view="projectReport" onclick="navigate('projectReport')">🏗️ Project Report</button>
        <button class="nav-item" data-view="pettyCash" onclick="navigate('pettyCash')">💵 Petty Cash</button>
        <button class="nav-item" data-view="customers" onclick="navigate('customers')">👥 Customers</button>
        <button class="nav-item" data-view="employees" onclick="navigate('employees')">🧑‍💼 Employees</button>
        <div id="customSidebarTabs"></div>
        <div class="nav-divider"></div>
        <button class="nav-item" data-view="reports" onclick="navigate('reports')">📈 Custom Reports</button>
        <button class="nav-item" data-view="import" onclick="navigate('import')">📥 Import Excel / CSV</button>
        <button class="nav-item" data-view="settings" onclick="navigate('settings')">⚙️ Settings &amp; Customize</button>
      </nav>
      <div class="sidebar-footer">
        <div id="sidebarUser" style="font-weight:600; color:#fff;"></div>
        <div id="sidebarRole" style="color:#94a3b8; margin-bottom:8px;"></div>
        <button class="btn btn-sm btn-secondary" style="width:100%;" onclick="logout()">Sign Out</button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-btn" onclick="toggleSidebar(true)">☰</button>
          <div class="topbar-title" id="pageTitle">Dashboard</div>
        </div>
        <div class="topbar-right">
          <span id="autoSyncBadge" class="badge badge-info" title="Auto-syncs with Google Drive every 5 minutes">Auto-Sync: 5m</span>
          <button class="btn btn-sm btn-secondary" onclick="refreshData(true)" title="Sync with Google Sheets & Drive">↻ Sync Now</button>
          <span id="clockActionArea"></span>
        </div>
      </header>

      <main class="content" id="mainContent"></main>
    </div>
  </div>

  <!-- Reusable Modal -->
  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div id="modalBox" class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Modal</h3>
        <button class="btn btn-sm btn-secondary close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
(function() {
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzfn1m3mHHvNp4gRIPzVND721AsWGp0YbJzos2ziJ_jzrLweDGO4oMnJyaghFI_zlNnJQ/exec';
  function makeRunner(ok, err) {
    return new Proxy({}, {
      get(_, prop) {
        if (prop === 'withSuccessHandler') return (fn) => makeRunner(fn, err);
        if (prop === 'withFailureHandler') return (fn) => makeRunner(ok, fn);
        return (...args) => {
          fetch(GAS_URL, {
            method: 'POST',
            redirect: 'follow',
            body: JSON.stringify({ action: prop, args: args })
          })
          .then(r => r.json())
          .then(data => {
            if (data && data.ok) {
              if (ok) ok(data.result);
            } else {
              const e = new Error((data && data.error) || 'API Error');
              if (err) err(e);
            }
          })
          .catch(e => {
            if (err) err(e);
          });
        };
      }
    });
  }
  window.google = { script: { run: makeRunner(null, null) } };
})();
</script>
<script>
  const state = {
    user: null,
    view: 'dashboard',
    invTab: 'invoices',
    outTab: 'debtors',
    empTab: 'directory',
    attTab: 'attendance',
    data: {
      settings: {},
      users: [],
      customers: [],
      inventory: [],
      invoices: [],
      invoiceItems: [],
      creditors: [],
      pettyCash: [],
      callReports: [],
      projectReports: [],
      employees: [],
      customTabs: [],
      customTabRows: [],
      transactions: [],
      attendance: [],
      leaves: [],
      tasks: [],
      savedReports: [],
      today: ''
    }
  };

  /* ==========================================================================
   * Utilities & GAS Bridge
   * ======================================================================== */

  function gas(fnName, ...args) {
    document.getElementById('loadingBar').classList.remove('hidden');
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(res => {
          document.getElementById('loadingBar').classList.add('hidden');
          resolve(res);
        })
        .withFailureHandler(err => {
          document.getElementById('loadingBar').classList.add('hidden');
          const msg = err && err.message ? err.message : String(err);
          showToast('Error: ' + msg);
          reject(err);
        })[fnName](...args);
    });
  }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
  }

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtMoney(num) {
    const cur = state.data.settings.Currency || 'LKR';
    const val = Number(num || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return cur + ' ' + val;
  }

  function toggleSidebar(open) {
    document.getElementById('sidebar').classList.toggle('open', open);
  }

  function openModal(title, bodyHtml, footerHtml, large = false) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modalFooter').innerHTML = footerHtml || '';
    document.getElementById('modalBox').classList.toggle('modal-lg', large);
    document.getElementById('modalBackdrop').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.add('hidden');
  }

  /* ==========================================================================
   * Auth & Init
   * ======================================================================== */

  window.addEventListener('DOMContentLoaded', async () => {
    try {
      const users = await gas('getLoginUsers');
      const sel = document.getElementById('loginUser');
      sel.innerHTML = users.map(u => `<option value="${esc(u.UserId)}">${esc(u.Name)} (${esc(u.Role)})</option>`).join('');
    } catch (e) {}

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const userId = document.getElementById('loginUser').value;
      const pin = document.getElementById('loginPin').value;
      try {
        const user = await gas('authenticateUser', userId, pin);
        state.user = user;
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('appShell').classList.remove('hidden');
        document.getElementById('sidebarUser').textContent = user.Name;
        document.getElementById('sidebarRole').textContent = user.Role;
        await refreshData();
        startAutoSync();
      } catch (err) {}
    });
  });

  function logout() {
    state.user = null;
    document.getElementById('loginPin').value = '';
    document.getElementById('appShell').classList.add('hidden');
    document.getElementById('loginView').classList.remove('hidden');
  }

  async function refreshData(backupToDrive = false) {
    if (backupToDrive) {
      try { await gas('autoSyncDriveBackup'); } catch (e) {}
    }
    const data = await gas('getAppData');
    state.data = data;
    document.getElementById('brandName').textContent = data.settings.CompanyName || 'System Manager';
    renderCustomSidebarTabs();
    renderTopbarClock();
    renderView();
    if (backupToDrive) showToast('Synced with Google Drive!');
  }

  function renderCustomSidebarTabs() {
    const el = document.getElementById('customSidebarTabs');
    if (!el) return;
    el.innerHTML = (state.data.customTabs || []).map(t => `
      <button class="nav-item ${state.view === 'customTab:' + t.TabId ? 'active' : ''}" data-view="customTab:${esc(t.TabId)}" onclick="navigate('customTab:${esc(t.TabId)}')">
        ${esc(t.Icon || '📋')} ${esc(t.Name)}
      </button>
    `).join('');
  }

  let _syncSecondsLeft = 300;
  function startAutoSync() {
    clearInterval(window._autoSyncTimer);
    _syncSecondsLeft = 300;
    window._autoSyncTimer = setInterval(async () => {
      _syncSecondsLeft--;
      if (_syncSecondsLeft <= 0) {
        _syncSecondsLeft = 300;
        if (state.user) {
          await refreshData(true);
        }
      }
      const m = Math.floor(_syncSecondsLeft / 60);
      const s = String(_syncSecondsLeft % 60).padStart(2, '0');
      const badge = document.getElementById('autoSyncBadge');
      if (badge) badge.textContent = `Auto-Sync: ${m}:${s}`;
    }, 1000);
  }

  function navigate(view) {
    state.view = view;
    document.querySelectorAll('.nav-item').forEach(b => {
      b.classList.toggle('active', b.dataset.view === view);
    });
    toggleSidebar(false);
    renderView();
  }

  function renderTopbarClock() {
    const todayAtt = state.data.attendance.find(a => a.UserId === state.user.UserId && a.Date === state.data.today);
    const el = document.getElementById('clockActionArea');
    if (!todayAtt) {
      el.innerHTML = `<button class="btn btn-sm btn-success" onclick="handleClockIn()">Clock In</button>`;
    } else if (!todayAtt.ClockOut) {
      el.innerHTML = `<button class="btn btn-sm btn-danger" onclick="handleClockOut()">Clock Out (${esc(todayAtt.ClockIn)})</button>`;
    } else {
      el.innerHTML = `<span class="badge badge-success">Done ${esc(todayAtt.ClockIn)} - ${esc(todayAtt.ClockOut)}</span>`;
    }
  }

  async function handleClockIn() {
    await gas('clockInUser', state.user.UserId, state.user.Name);
    showToast('Clocked in!');
    await refreshData();

  async function handleClockOut() {
    await gas('clockOutUser', state.user.UserId);
    showToast('Clocked out!');
    await refreshData();

  function daysBetween(dateStr, refDateStr) {
    if (!dateStr) return 0;
    const d1 = new Date(dateStr);
    const d2 = new Date(refDateStr || state.data.today || new Date().toISOString().slice(0, 10));
    if (isNaN(d1) || isNaN(d2)) return 0;
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
  }

  function getCustomerOverdueInfo(customerId) {
    if (!customerId) return { blocked: false, maxDays: 0, balance: 0 };
    const unpaid = state.data.invoices.filter(i =>
      i.CustomerId === customerId &&
      i.Status !== 'Paid' && i.Status !== 'Cancelled' && i.Status !== 'Draft' &&
      (Number(i.Total || 0) - Number(i.PaidAmount || 0)) > 0
    );
    let maxDays = 0;
    let balance = 0;
    unpaid.forEach(i => {
      const bal = Number(i.Total || 0) - Number(i.PaidAmount || 0);
      balance += bal;
      const d = daysBetween(i.DueDate || i.Date, state.data.today);
      if (d > maxDays) maxDays = d;
    });
    return { blocked: maxDays > 120, maxDays, balance };
  }

  function statusBadge(status) {

      Draft: 'badge-muted', 'To Do': 'badge-info', Medium: 'badge-info', Low: 'badge-muted'
    };
    return `<span class="badge ${map[status] || 'badge-muted'}">${esc(status)}</span>`;

  let _invLines = [];

      InvoiceNo: '', CustomerId: '', CustomerName: '', Date: state.data.today, DueDate: state.data.today, Status: 'Pending', Discount: 0, PaidAmount: 0, Notes: ''
    };
    _invLines = invoiceId
      ? state.data.invoiceItems.filter(li => li.InvoiceId === invoiceId).map(x => ({ ...x }))
      : [{ ItemId: '', ItemName: '', Qty: 1, UnitPrice: 0 }];

    const custOpts = state.data.customers.map(c =>
      `<option value="${esc(c.CustomerId)}" ${inv.CustomerId === c.CustomerId ? 'selected' : ''}>${esc(c.Name)}${c.Company ? ' - ' + esc(c.Company) : ''}</option>`

    openModal(
      invoiceId ? 'Edit Invoice ' + inv.InvoiceNo : 'New Standard Invoice',
      `
        <div id="invOverdueAlert" class="alert-danger hidden">
          <b>⛔ BLOCKED (&gt; 120 Days Overdue):</b> <span id="invOverdueMsg"></span>
          <div class="form-group" style="margin-top:8px; margin-bottom:0;">

            </select>

        <div style="margin:12px 0;">

  function checkInvCustomerBlock() {
    const custId = document.getElementById('fInvCust').value;
    const info = getCustomerOverdueInfo(custId);
    const alertEl = document.getElementById('invOverdueAlert');
    if (info.blocked) {
      document.getElementById('invOverdueMsg').textContent =
        `This customer has unpaid invoices overdue by ${info.maxDays} days (Balance: ${fmtMoney(info.balance)}).`;
      alertEl.classList.remove('hidden');
    } else {
      alertEl.classList.add('hidden');
    }
  }

  function renderInvLines() {
    const invOpts = state.data.inventory.map(it => `<option value="${esc(it.ItemId)}">${esc(it.Name)} (${it.StockQty} ${esc(it.Unit)})</option>`).join('');
    document.getElementById('invLinesContainer').innerHTML = _invLines.map((ln, idx) => `
      <div style="display:grid; grid-template-columns:2fr 1.5fr 70px 100px 36px; gap:6px; margin-bottom:6px; align-items:center;">
        <select onchange="pickInvItem(${idx}, this.value)">
          <option value="">-- Custom Item --</option>
          ${invOpts}
        </select>
        <input placeholder="Item name" value="${esc(ln.ItemName)}" oninput="_invLines[${idx}].ItemName=this.value">
        <input type="number" min="1" value="${ln.Qty}" oninput="_invLines[${idx}].Qty=Number(this.value); updateInvTotals()">
        <input type="number" step="0.01" value="${ln.UnitPrice}" oninput="_invLines[${idx}].UnitPrice=Number(this.value); updateInvTotals()">
        <button type="button" class="btn btn-sm btn-danger" onclick="_invLines.splice(${idx},1); renderInvLines()">✕</button>
      </div>
    `).join('');

    // Set selected dropdown values
    const selects = document.querySelectorAll('#invLinesContainer select');
    _invLines.forEach((ln, idx) => { if (selects[idx]) selects[idx].value = ln.ItemId || ''; });
    updateInvTotals();
  }

  function pickInvItem(idx, itemId) {
    const item = state.data.inventory.find(x => x.ItemId === itemId);
    _invLines[idx].ItemId = itemId;
    if (item) {
      _invLines[idx].ItemName = item.Name;
      _invLines[idx].UnitPrice = Number(item.UnitPrice) || 0;
    }
    renderInvLines();
  }

  function addInvLine() {
    _invLines.push({ ItemId: '', ItemName: '', Qty: 1, UnitPrice: 0 });
    renderInvLines();
  }

  function updateInvTotals() {
    const sub = _invLines.reduce((s, l) => s + (Number(l.Qty || 0) * Number(l.UnitPrice || 0)), 0);
    const disc = Number(document.getElementById('fInvDisc')?.value || 0);
    const taxable = Math.max(0, sub - disc);
    const taxRate = Number(state.data.settings.TaxRate || 0);
    const tax = taxable * (taxRate / 100);
    const total = taxable + tax;
    const paid = Number(document.getElementById('fInvPaid')?.value || 0);
    const bal = Math.max(0, total - paid);
    document.getElementById('invTotalsPreview').innerHTML =
      `Subtotal: <b>${fmtMoney(sub)}</b> | Discount: <b>${fmtMoney(disc)}</b> | Tax (${taxRate}%): <b>${fmtMoney(tax)}</b> | Total: <b>${fmtMoney(total)}</b> | Balance: <b style="color:var(--danger)">${fmtMoney(bal)}</b>`;
    return { sub, disc, tax, total, paid };
  }

  async function submitInvoice(invoiceId) {
    const custId = document.getElementById('fInvCust').value;
    const status = document.getElementById('fInvStatus').value;
    const info = getCustomerOverdueInfo(custId);

    // Block >120 day overdue customers unless Login PIN override is verified
    if (info.blocked && status !== 'Draft' && status !== 'Cancelled') {
      const pin = document.getElementById('fInvOverridePin')?.value || '';
      if (!pin) {
        showToast('Blocked: Customer is >120 days overdue. Enter your Login PIN to issue!');
        return;
      }
      try {
        await gas('authenticateUser', state.user.UserId, pin);
      } catch (e) {
        showToast('Invalid Login PIN! Invoice blocked.');
        return;
      }
    }

    const cust = state.data.customers.find(c => c.CustomerId === custId);
    const { sub, disc, tax, total, paid } = updateInvTotals();
    const existing = invoiceId ? state.data.invoices.find(i => i.InvoiceId === invoiceId) : null;
    const finalPaid = status === 'Paid' ? total : paid;

    const payload = {
      invoice: {
        InvoiceId: invoiceId || '',
        InvoiceNo: existing ? existing.InvoiceNo : '',
        CustomerId: custId,
        CustomerName: cust ? cust.Name : 'Walk-in Customer',
        Date: document.getElementById('fInvDate').value,
        DueDate: document.getElementById('fInvDue').value,
        Status: status,
        Subtotal: sub,
        Discount: disc,
        TaxAmount: tax,
        Total: total,
        PaidAmount: finalPaid,
        Notes: document.getElementById('fInvNotes').value,
        CreatedBy: state.user.Name
      },
      items: _invLines.filter(l => l.ItemName.trim() !== '')
    };

    await gas('saveInvoice', payload);
    closeModal();
    showToast('Invoice saved!');
    await refreshData();
  }

  async function removeInvoice(id) {
    if (!confirm('Delete this invoice? Stock will be restored.')) return;
    await gas('deleteInvoice', id);
    showToast('Invoice deleted.');
    await refreshData();
  }

  function uploadTemplateFile(sheetName, file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        let json = [];
        if (typeof XLSX !== 'undefined') {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          json = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
        } else {
          const text = new TextDecoder().decode(e.target.result);
          const lines = text.split(/\r?\n/).filter(l => l.trim());
          const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
          json = lines.slice(1).map(l => {
            const cols = l.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            const obj = {};
            headers.forEach((h, i) => { obj[h] = cols[i] || ''; });
            return obj;
          });
        }
        if (!json.length) { showToast('Uploaded file is empty.'); return; }
        const cols = Object.keys(json[0]);
        const settingKey = sheetName === 'CallReports' ? 'CallReportTemplate' : 'ProjectReportTemplate';
        await gas('saveSettings', { [settingKey]: JSON.stringify(cols) });
        if (confirm(`Detected ${cols.length} columns and ${json.length} rows. Import all ${json.length} rows now?`)) {
          await gas('importReportEntries', sheetName, json, state.user.Name);
        }
        showToast('Template & data updated!');
        await refreshData();
      } catch (err) {
        showToast('Error reading file: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function openTemplateRowModal(sheetName, id) {
    const cols = getTemplateCols(sheetName);
    const idField = sheetName === 'CallReports' ? 'CallId' : 'ProjId';
    const rawList = sheetName === 'CallReports' ? state.data.callReports : state.data.projectReports;
    const existing = id ? rawList.find(x => x[idField] === id) : null;
    let data = {};
    if (existing) {
      try { data = JSON.parse(existing.DataJson || '{}'); } catch (e) {}
    }

    openModal(
      (id ? 'Edit ' : 'New ') + (sheetName === 'CallReports' ? 'Call Report' : 'Project Report'),
      cols.map((c, idx) => `
        <div class="form-group">
          <label>${esc(c)}</label>
          <input id="fTpl_${idx}" value="${esc(data[c] ?? (/date/i.test(c) && !id ? state.data.today : ''))}">
        </div>
      `).join(''),
      `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="submitTemplateRow('${sheetName}', '${esc(id || '')}')">Save</button>`
    );
  }

  async function submitTemplateRow(sheetName, id) {
    const cols = getTemplateCols(sheetName);
    const idField = sheetName === 'CallReports' ? 'CallId' : 'ProjId';
    const obj = {};
    cols.forEach((c, idx) => {
      obj[c] = document.getElementById('fTpl_' + idx).value;
    });
    await gas('saveReportEntry', sheetName, {
      [idField]: id,

      CreatedBy: state.user.Name

    showToast('Saved!');

  }

  async function removeTemplateRow(sheetName, id) {

  function exportTemplateRows(sheetName) {
    const cols = getTemplateCols(sheetName);
    const rawList = sheetName === 'CallReports' ? state.data.callReports : state.data.projectReports;
    const rows = rawList.map(r => {
      try { return JSON.parse(r.DataJson || '{}'); } catch (e) { return {}; }
    });
    if (typeof XLSX !== 'undefined') {
      const ws = XLSX.utils.json_to_sheet(rows, { header: cols });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
      XLSX.writeFile(wb, `${sheetName}_${state.data.today}.xlsx`);
    }
  }

  /* ==========================================================================
   * 2D. Petty Cash Book (Exact Petty cash format.xlsx Layout: In | Out)
   * ======================================================================== */

  const _pcState = {
    mode: 'daily', // 'daily' | 'monthly'
    date: '',
    month: ''
  };

  function renderPettyCashView() {
    const today = state.data.today || new Date().toISOString().slice(0, 10);
    if (!_pcState.date) _pcState.date = today;
    if (!_pcState.month) _pcState.month = today.slice(0, 7);

    const all = state.data.pettyCash || [];
    const isIn = (p) => p.Type === 'In' || p.Type === 'Cash In';
    const isOut = (p) => p.Type === 'Out' || p.Type === 'Cash Out';

    const periodStart = _pcState.mode === 'daily' ? _pcState.date : (_pcState.month + '-01');
    const prevRows = all.filter(p => String(p.Date) < periodStart);
    const prevBalance = prevRows.reduce((s, p) => s + (isIn(p) ? Number(p.Amount || 0) : -Number(p.Amount || 0)), 0);

    const currentRows = all.filter(p =>
      _pcState.mode === 'daily'
        ? String(p.Date) === _pcState.date
        : String(p.Date).startsWith(_pcState.month)
    );

    const inRows = currentRows.filter(isIn);
    const outRows = currentRows.filter(isOut);

    const periodInSum = inRows.reduce((s, p) => s + Number(p.Amount || 0), 0);
    const totalInWithBF = prevBalance + periodInSum;
    const totalOut = outRows.reduce((s, p) => s + Number(p.Amount || 0), 0);
    const balanceCF = totalInWithBF - totalOut;

    const maxLen = Math.max(inRows.length + 1, outRows.length, 5);
    const prevLabel = _pcState.mode === 'daily'
      ? `Balance from previous day`
      : `Balance from previous month`;
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const [yy, mm] = _pcState.month.split('-');
    const monthTitle = `${monthNames[Number(mm) - 1] || mm} ${yy}`;
    const reportTitle = _pcState.mode === 'daily'
      ? `Daily Petty Cash Report - Office - ${_pcState.date.replace(/-/g, '.')}`
      : `Petty Cash Collection Report - Office - ${monthTitle}`;

    let bodyRows = '';
    for (let i = 0; i < maxLen; i++) {
      let inCells = '';
      if (i === 0) {
        inCells = `<td class="pc-balance-prev"></td><td class="pc-balance-prev"><b>${esc(prevLabel)}</b></td><td class="pc-balance-prev pc-divider" style="text-align:right;"><b>${fmtMoney(prevBalance)}</b></td>`;
      } else {
        const inItem = inRows[i - 1];
        inCells = inItem
          ? `<td>${esc(inItem.Date)}</td><td>${esc(inItem.ReceiptNo || inItem.VoucherNo)} <button class="btn btn-sm btn-danger no-print" style="padding:1px 5px;font-size:10px;" onclick="removePettyCash('${esc(inItem.PcId)}')">✕</button></td><td style="text-align:right;">${fmtMoney(inItem.Amount)}</td>`
          : `<td>&nbsp;</td><td></td><td></td>`;
      }

      const outItem = outRows[i];
      const outCells = outItem
        ? `<td>${esc(outItem.Date)}</td><td>${esc(outItem.ReceiptNo || outItem.VoucherNo)}</td><td>${esc(outItem.PaidTo)}</td><td>${esc(outItem.Description)} <button class="btn btn-sm btn-danger no-print" style="padding:1px 5px;font-size:10px;" onclick="removePettyCash('${esc(outItem.PcId)}')">✕</button></td><td style="text-align:right;">${fmtMoney(outItem.Amount)}</td>`
        : `<td>&nbsp;</td><td></td><td></td><td></td><td></td>`;

      bodyRows += `<tr>${inCells}${outCells}</tr>`;
    }

    document.getElementById('mainContent').innerHTML = `
      <div class="tabs no-print">
        <button class="tab-btn ${_pcState.mode === 'daily' ? 'active' : ''}" onclick="_pcState.mode='daily'; renderPettyCashView()">Daily Petty Cash Report</button>
        <button class="tab-btn ${_pcState.mode === 'monthly' ? 'active' : ''}" onclick="_pcState.mode='monthly'; renderPettyCashView()">Monthly Collection Report</button>
      </div>

      <div class="kpi-grid no-print">
        <div class="card"><div class="kpi-label">Balance B/F</div><div class="kpi-val">${fmtMoney(prevBalance)}</div></div>
        <div class="card"><div class="kpi-label">Total In (incl. B/F)</div><div class="kpi-val" style="color:var(--success)">${fmtMoney(totalInWithBF)}</div></div>
        <div class="card"><div class="kpi-label">Total Out</div><div class="kpi-val" style="color:var(--danger)">${fmtMoney(totalOut)}</div></div>
        <div class="card"><div class="kpi-label">Balance Carry Forward</div><div class="kpi-val" style="color:var(--primary)">${fmtMoney(balanceCF)}</div></div>
      </div>

      <div class="section-header no-print">
        <div class="section-actions">
          ${_pcState.mode === 'daily'
            ? `<input type="date" style="width:auto;" value="${esc(_pcState.date)}" onchange="_pcState.date=this.value; renderPettyCashView()">`
            : `<input type="month" style="width:auto;" value="${esc(_pcState.month)}" onchange="_pcState.month=this.value; renderPettyCashView()">`
          }
          <label class="btn btn-sm btn-secondary" style="cursor:pointer; margin:0;">
            📤 Import Excel
            <input type="file" accept=".xlsx,.xls,.csv" style="display:none;" onchange="importPettyCashFormat(this.files[0])">
          </label>
          <button class="btn btn-sm btn-secondary" onclick="exportPettyCashExcel()">⬇ Export Excel</button>
          <button class="btn btn-sm btn-secondary" onclick="window.print()">🖨 Print</button>
        </div>
        <div class="section-actions">
          <button class="btn btn-success" onclick="openPettyCashModal('In')">+ Add In (Cash/Invoice)</button>
          <button class="btn btn-primary" onclick="openPettyCashModal('Out')">+ Add Out (Expense)</button>
        </div>
      </div>

      <div class="card table-wrap">
        <table id="pcTable" style="border:1px solid #cbd5e1; border-collapse:collapse;">
          <thead>
            <tr>
              <th colspan="8" class="pc-title" style="text-align:center; font-size:16px; font-weight:700; padding:12px; background:#231f20; color:#ffffff; border-bottom:3px solid #00a651;">
                ${esc(reportTitle)}
              </th>
            </tr>
            <tr>
              <th colspan="3" class="pc-group-in pc-divider" style="text-align:center; font-size:13px; font-weight:700; background:#00a651; color:#ffffff; border-right:2px solid #074626;">IN (Receipts)</th>

  function importPettyCashFormat(file) {
    if (!file || typeof XLSX === 'undefined') return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      const toImport = [];
      rows.forEach(r => {
        // Check In side (Cols B,C,D -> idx 1,2,3) and Out side (Cols E,F,G,H,I -> idx 4,5,6,7,8)
        const inAmt = Number(r[3]);
        if (r[1] && !isNaN(inAmt) && inAmt > 0 && !/date/i.test(String(r[1]))) {
          toImport.push({ Date: String(r[1]).slice(0, 10), Type: 'In', ReceiptNo: String(r[2]), Amount: inAmt, Description: 'Imported In', RecordedBy: state.user.Name });
        }
        const outAmt = Number(r[8]);
        if (r[4] && !isNaN(outAmt) && outAmt > 0 && !/date/i.test(String(r[4]))) {
          toImport.push({ Date: String(r[4]).slice(0, 10), Type: 'Out', ReceiptNo: String(r[5]), PaidTo: String(r[6]), Description: String(r[7]), Amount: outAmt, RecordedBy: state.user.Name });
        }
      });
      if (toImport.length) {
        await gas('importRecords', 'PettyCash', toImport);
        showToast(`Imported ${toImport.length} petty cash entries!`);
        await refreshData();
      } else {
        showToast('No valid In/Out entries found in file.');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  let _ctPendingRows = [];
  function openCustomTabModal(tabId) {

    let cols = [];

       <button class="btn btn-primary" onclick="submitCustomTab('${esc(tabId || '')}')">Save Custom Tab</button>`

  function readCustomTabTemplate(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        let json = [];
        if (typeof XLSX !== 'undefined') {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          json = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
        }
        if (json.length) {
          const cols = Object.keys(json[0]);
          document.getElementById('fCtCols').value = cols.join(', ');
          if (!document.getElementById('fCtName').value) {
            document.getElementById('fCtName').value = file.name.replace(/\.[^.]+$/, '');
          }
          _ctPendingRows = json;
          showToast(`Detected ${cols.length} columns and ${json.length} rows!`);
        }
      } catch (err) {
        showToast('Error reading file: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  async function submitCustomTab(tabId) {
    const cols = document.getElementById('fCtCols').value.split(',').map(s => s.trim()).filter(Boolean);
    const saved = await gas('saveCustomTab', {
      TabId: tabId,
      Name: document.getElementById('fCtName').value || 'Custom Tab',
      Icon: document.getElementById('fCtIcon').value || '📋',
      ColumnsJson: JSON.stringify(cols),
      CreatedBy: state.user.Name
    });
    if (_ctPendingRows.length && confirm(`Import ${_ctPendingRows.length} rows from the uploaded file into "${saved.Name}"?`)) {
      await gas('importCustomTabRows', saved.TabId, _ctPendingRows, state.user.Name);
    }
    _ctPendingRows = [];
    closeModal();
    showToast('Custom tab saved!');
    await refreshData();
  }

  async function removeCustomTab(tabId) {
    if (!confirm('Delete this custom tab and all its rows?')) return;
    await gas('deleteCustomTab', tabId);
    if (state.view === 'customTab:' + tabId) state.view = 'settings';
    await refreshData();
  }

  function renderCustomTabView(tabId) {
    const tab = (state.data.customTabs || []).find(t => t.TabId === tabId);
    if (!tab) { renderDashboard(); return; }
    let cols = [];
    try { cols = JSON.parse(tab.ColumnsJson || '[]'); } catch (e) {}

    const rows = (state.data.customTabRows || [])
      .filter(r => r.TabId === tabId)
      .map(r => {
        let d = {};
        try { d = JSON.parse(r.DataJson || '{}'); } catch (e) {}
        return { _id: r.RowId, ...d };
      }).reverse();

    // Auto-calculate numeric column totals
    const totals = {};
    cols.forEach((c, idx) => {
      if (idx === 0) { totals[c] = 'TOTAL'; return; }
      const vals = rows.map(r => r[c]).filter(v => v !== '' && v !== null && v !== undefined);
      if (vals.length && vals.every(v => !isNaN(Number(String(v).replace(/,/g, ''))))) {
        const sum = vals.reduce((a, b) => a + Number(String(b).replace(/,/g, '')), 0);
        totals[c] = Number(sum.toFixed(2)).toLocaleString('en-US', { maximumFractionDigits: 2 });
      } else {
        totals[c] = '';
      }
    });

    document.getElementById('mainContent').innerHTML = `
      <div class="section-header no-print">
        <input class="search-input" placeholder="Search ${esc(tab.Name)}..." oninput="filterTable('ctTable', this.value)">
        <div class="section-actions">
          <label class="btn btn-sm btn-secondary" style="cursor:pointer; margin:0;">
            📤 Import Excel / CSV
            <input type="file" accept=".xlsx,.xls,.csv" style="display:none;" onchange="importIntoCustomTab('${esc(tabId)}', this.files[0])">
          </label>
          <button class="btn btn-sm btn-secondary" onclick="exportCustomTabExcel('${esc(tabId)}')">⬇ Export Excel</button>
          <button class="btn btn-sm btn-primary" onclick="openCustomTabRowModal('${esc(tabId)}')">+ New Entry</button>
        </div>
      </div>
      <div class="card table-wrap">
        <table id="ctTable">
          <thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}<th>Actions</th></tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                ${cols.map(c => `<td>${esc(r[c] ?? '')}</td>`).join('')}
                <td>
                  <button class="btn btn-sm btn-secondary" onclick="openCustomTabRowModal('${esc(tabId)}', '${esc(r._id)}')">Edit</button>
                  <button class="btn btn-sm btn-danger" onclick="removeCustomTabRow('${esc(r._id)}')">Del</button>
                </td>
              </tr>
            `).join('') || `<tr><td colspan="${cols.length + 1}" style="color:var(--muted)">No entries yet. Click "+ New Entry" or "Import Excel / CSV".</td></tr>`}
          </tbody>
          ${rows.length ? `<tfoot><tr style="background:var(--primary-light); font-weight:700;">${cols.map(c => `<td>${esc(totals[c])}</td>`).join('')}<td></td></tr></tfoot>` : ''}
        </table>
      </div>
    `;
  }

  function openCustomTabRowModal(tabId, rowId) {

    let cols = [];
    try { cols = JSON.parse(tab.ColumnsJson || '[]'); } catch (e) {}

  async function submitCustomTabRow(tabId, rowId) {
    const tab = (state.data.customTabs || []).find(t => t.TabId === tabId);
    let cols = [];

  async function removeCustomTabRow(rowId) {

  function importIntoCustomTab(tabId, file) {
    if (!file || typeof XLSX === 'undefined') return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
      const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: false });
      if (json.length) {
        await gas('importCustomTabRows', tabId, json, state.user.Name);
        showToast(`Imported ${json.length} rows!`);
        await refreshData();
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function exportCustomTabExcel(tabId) {
    if (typeof XLSX === 'undefined') return;
    const tab = (state.data.customTabs || []).find(t => t.TabId === tabId);

  const _reportState = {
    source: 'Invoices',

  function getReportDataset() {
    if (_reportState.source === 'UploadedFile') {
      return _reportState.uploadedRows || [];
    }
    const map = {
      Invoices: state.data.invoices,
      Transactions: state.data.transactions,
      Inventory: state.data.inventory.map(it => ({
        ...it,
        StockValue: (Number(it.UnitPrice) || 0) * (Number(it.StockQty) || 0)
      })),
      Customers: state.data.customers,
      Attendance: state.data.attendance.map(a => {
        let hrs = '';
        if (a.ClockIn && a.ClockOut) {
          const [h1, m1] = String(a.ClockIn).split(':').map(Number);
          const [h2, m2] = String(a.ClockOut).split(':').map(Number);
          if (!isNaN(h1) && !isNaN(h2)) {
            hrs = (((h2 * 60 + m2) - (h1 * 60 + m1)) / 60).toFixed(2);
          }
        }
        return { ...a, HoursWorked: hrs };
      }),
      Leaves: state.data.leaves,
      Tasks: state.data.tasks
    };
    return map[_reportState.source] || [];
  }

  function renderReportsView() {
    const raw = getReportDataset();
    const allCols = raw.length ? Object.keys(raw[0]) : [];
    if (!_reportState.selectedCols.length || !_reportState.selectedCols.every(c => allCols.includes(c))) {
      _reportState.selectedCols = allCols.slice(0, 8);
    }

    // Filter rows
    const dateCol = allCols.find(c => /date/i.test(c));
    const q = _reportState.search.toLowerCase();
    const filtered = raw.filter(r => {
      if (dateCol && _reportState.dateFrom && String(r[dateCol]) < _reportState.dateFrom) return false;
      if (dateCol && _reportState.dateTo && String(r[dateCol]) > _reportState.dateTo) return false;
      if (q && !Object.values(r).some(v => String(v).toLowerCase().includes(q))) return false;
      return true;
    });

    // Detect numeric columns among selectedCols
    const numCols = _reportState.selectedCols.filter(c => {
      const vals = filtered.map(r => r[c]).filter(v => v !== '' && v !== null && v !== undefined);
      return vals.length > 0 && vals.every(v => !isNaN(Number(String(v).replace(/,/g, ''))));
    });

    // Build output rows (raw or grouped with system calculations)
    let outCols = [..._reportState.selectedCols];
    let outRows = filtered;

    if (_reportState.groupBy && allCols.includes(_reportState.groupBy)) {
      const grpCol = _reportState.groupBy;
      const groups = {};
      filtered.forEach(r => {
        const k = String(r[grpCol] || '(Blank)');
        if (!groups[k]) groups[k] = [];
        groups[k].push(r);
      });

      const calcCols = numCols.filter(c => c !== grpCol);
      outCols = [grpCol, 'Count', ...calcCols.map(c => `${c} (${_reportState.calcType})`)];
      outRows = Object.keys(groups).map(k => {
        const list = groups[k];
        const rowObj = { [grpCol]: k, Count: list.length };
        calcCols.forEach(c => {
          const nums = list.map(x => Number(String(x[c]).replace(/,/g, '')) || 0);
          const sum = nums.reduce((a, b) => a + b, 0);
          let val = sum;
          if (_reportState.calcType === 'AVG') val = nums.length ? sum / nums.length : 0;
          else if (_reportState.calcType === 'MIN') val = nums.length ? Math.min(...nums) : 0;
          else if (_reportState.calcType === 'MAX') val = nums.length ? Math.max(...nums) : 0;
          rowObj[`${c} (${_reportState.calcType})`] = Number(val.toFixed(2));
        });
        return rowObj;
      });
    }

    _reportState.lastOutputCols = outCols;
    _reportState.lastOutputRows = outRows;

    // Grand Totals row
    const totals = {};
    outCols.forEach((c, idx) => {
      if (idx === 0) { totals[c] = 'TOTAL'; return; }
      const vals = outRows.map(r => r[c]).filter(v => v !== '' && v !== null && v !== undefined);
      if (vals.length && vals.every(v => !isNaN(Number(String(v).replace(/,/g, ''))))) {
        const sum = vals.reduce((a, b) => a + Number(String(b).replace(/,/g, '')), 0);
        totals[c] = Number(sum.toFixed(2)).toLocaleString('en-US', { maximumFractionDigits: 2 });
      } else {
        totals[c] = '';
      }
    });

    const savedOpts = state.data.savedReports.map(sr =>
      `<option value="${esc(sr.ReportId)}">${esc(sr.Name)} (${esc(sr.Source)})</option>`
    ).join('');

    document.getElementById('mainContent').innerHTML = `
      <div class="card no-print" style="margin-bottom:16px;">
        <div class="section-header">
          <div>
            <h3>Custom Report Builder</h3>
            <p style="font-size:12px; color:var(--muted);">Create custom reports from Office data or directly from any uploaded Excel / CSV file with automatic calculations.</p>
          </div>
          <div class="section-actions">
            <select id="savedRptSelect" style="width:auto;" onchange="loadSavedReport(this.value)">
              <option value="">-- Load Saved Report --</option>
              ${savedOpts}
            </select>
            <button class="btn btn-sm btn-secondary" onclick="saveCurrentReport()">💾 Save Report</button>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Data Source</label>
            <select onchange="changeReportSource(this.value)">
              ${['Invoices', 'Transactions', 'Inventory', 'Customers', 'Attendance', 'Leaves', 'Tasks'].map(s =>
                `<option value="${s}" ${_reportState.source === s ? 'selected' : ''}>${s}</option>`
              ).join('')}
              <option value="UploadedFile" ${_reportState.source === 'UploadedFile' ? 'selected' : ''}>📄 Uploaded Excel / CSV File ${_reportState.uploadedName ? '(' + esc(_reportState.uploadedName) + ')' : ''}</option>
            </select>
          </div>
          <div class="form-group">
            <label>Or Upload Excel / CSV File for Instant Report</label>
            <input type="file" accept=".xlsx,.xls,.csv" onchange="handleReportFileUpload(this.files[0])">
          </div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; margin-bottom:12px;">
          <div class="form-group" style="margin:0;">
            <label>Date From</label>
            <input type="date" value="${esc(_reportState.dateFrom)}" onchange="_reportState.dateFrom=this.value; renderReportsView()">
          </div>
          <div class="form-group" style="margin:0;">
            <label>Date To</label>
            <input type="date" value="${esc(_reportState.dateTo)}" onchange="_reportState.dateTo=this.value; renderReportsView()">
          </div>
          <div class="form-group" style="margin:0;">
            <label>Search / Filter</label>
            <input placeholder="Keyword..." value="${esc(_reportState.search)}" oninput="_reportState.search=this.value; renderReportsView()">
          </div>
          <div class="form-group" style="margin:0;">
            <label>Group By (Calculations)</label>
            <select onchange="_reportState.groupBy=this.value; renderReportsView()">
              <option value="">-- Detailed Rows (No Grouping) --</option>
              ${allCols.map(c => `<option value="${esc(c)}" ${_reportState.groupBy === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
            </select>
          </div>
          ${_reportState.groupBy ? `
            <div class="form-group" style="margin:0;">
              <label>Calculation</label>
              <select onchange="_reportState.calcType=this.value; renderReportsView()">
                ${['SUM', 'AVG', 'MIN', 'MAX'].map(fn => `<option ${fn === _reportState.calcType ? 'selected' : ''}>${fn}</option>`).join('')}
              </select>
            </div>
          ` : ''}
        </div>

        ${allCols.length ? `
          <div>
            <label style="font-size:12px; font-weight:600; color:var(--muted); display:block; margin-bottom:6px;">Columns to Include:</label>
            <div style="display:flex; flex-wrap:wrap; gap:10px;">
              ${allCols.map(c => `
                <label style="display:inline-flex; align-items:center; gap:5px; font-size:12px; cursor:pointer;">
                  <input type="checkbox" style="width:auto;" ${_reportState.selectedCols.includes(c) ? 'checked' : ''} onchange="toggleReportCol('${esc(c)}', this.checked)">
                  ${esc(c)}
                </label>
              `).join('')}
            </div>
          </div>
        ` : ''}
      </div>

      <div class="card">
        <div class="section-header">
          <div>
            <h3>Report Output (${outRows.length} rows)</h3>
            <div style="font-size:12px; color:var(--muted);">Source: ${esc(_reportState.source === 'UploadedFile' ? _reportState.uploadedName : _reportState.source)}</div>
          </div>
          <div class="section-actions no-print">
            <button class="btn btn-sm btn-secondary" onclick="exportReportCsv()">⬇ Export CSV</button>
            <button class="btn btn-sm btn-secondary" onclick="exportReportExcel()">⬇ Export Excel</button>
            <button class="btn btn-sm btn-secondary" onclick="saveCurrentReportToDrive()">☁ Save to Drive</button>
            <button class="btn btn-sm btn-primary" onclick="window.print()">🖨 Print / PDF</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>${outCols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
            <tbody>
              ${outRows.map(r => `
                <tr>${outCols.map(c => `<td>${esc(r[c])}</td>`).join('')}</tr>
              `).join('') || '<tr><td colspan="' + (outCols.length || 1) + '" style="color:var(--muted)">No matching records.</td></tr>'}
            </tbody>
            ${outRows.length ? `
              <tfoot>
                <tr style="background:#f1f5f9; font-weight:700;">
                  ${outCols.map(c => `<td>${esc(totals[c])}</td>`).join('')}
                </tr>
              </tfoot>
            ` : ''}
          </table>
        </div>
      </div>
    `;
  }

  function changeReportSource(src) {
    _reportState.source = src;
    _reportState.selectedCols = [];
    _reportState.groupBy = '';

  }

  function toggleReportCol(col, checked) {
    if (checked && !_reportState.selectedCols.includes(col)) {
      _reportState.selectedCols.push(col);
    } else if (!checked) {
      _reportState.selectedCols = _reportState.selectedCols.filter(c => c !== col);
    }
    renderReportsView();
  }

  function handleReportFileUpload(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        if (typeof XLSX !== 'undefined') {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          _reportState.uploadedRows = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
        } else {
          const text = new TextDecoder().decode(e.target.result);
          const lines = text.split(/\r?\n/).filter(l => l.trim());
          const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
          _reportState.uploadedRows = lines.slice(1).map(l => {
            const cols = l.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            const obj = {};
            headers.forEach((h, i) => { obj[h] = cols[i] || ''; });
            return obj;
          });
        }
        _reportState.uploadedName = file.name;
        _reportState.source = 'UploadedFile';
        _reportState.selectedCols = [];
        _reportState.groupBy = '';
        showToast('File loaded for reporting: ' + file.name);
        renderReportsView();
      } catch (err) {
        showToast('Error reading file: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function loadSavedReport(reportId) {

    if (!r) return;
    try {
      const cfg = JSON.parse(r.ConfigJson || '{}');
      _reportState.source = r.Source || 'Invoices';
      _reportState.selectedCols = cfg.selectedCols || [];
      _reportState.dateFrom = cfg.dateFrom || '';

  function buildReportCsv() {
    const cols = _reportState.lastOutputCols;
    const rows = _reportState.lastOutputRows;
    const escCsv = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    return [cols.map(escCsv).join(','), ...rows.map(r => cols.map(c => escCsv(r[c])).join(','))].join('\n');
  }

  function exportReportCsv() {

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Report_${_reportState.source}_${state.data.today}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function exportReportExcel() {
    if (typeof XLSX === 'undefined') return exportReportCsv();
    const ws = XLSX.utils.json_to_sheet(_reportState.lastOutputRows, { header: _reportState.lastOutputCols });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Report');
    XLSX.writeFile(wb, `Report_${_reportState.source}_${state.data.today}.xlsx`);
  }

  const IMPORT_SCHEMAS = {

  };

    table: 'Inventory',

  function renderImportView() {

          <div>
            <h3>Import Manual Excel / CSV Files</h3>

            </select>

        ` : ''}
      </div>

      ${hasRows ? `

          <div class="section-header">
            <h3>3. Match Columns (${_importState.rawRows.length} rows detected)</h3>
            <button class="btn btn-primary" onclick="executeImport()">📥 Import ${_importState.rawRows.length} Rows to ${esc(_importState.table)}</button>
          </div>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px;">

                <select onchange="_importState.mapping['${esc(f)}']=this.value">
                  <option value="">-- Skip / Leave Blank --</option>
                  ${_importState.headers.map(h => `<option value="${esc(h)}" ${_importState.mapping[f] === h ? 'selected' : ''}>${esc(h)}</option>`).join('')}
                </select>
              </div>
            `).join('')}

              <tbody>

                  <tr>${_importState.headers.map(h => `<td>${esc(r[h])}</td>`).join('')}</tr>

  function changeImportTable(tbl) {
    _importState.table = tbl;
    autoMapColumns();
    renderImportView();
  }

  function handleImportFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        if (typeof XLSX !== 'undefined') {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
          _importState.workbook = wb;
          _importState.sheetNames = wb.SheetNames;
          loadExcelSheet(wb.SheetNames[0]);
        } else {
          // Offline fallback for CSV only
          const text = new TextDecoder().decode(e.target.result);
          const lines = text.split(/\r?\n/).filter(l => l.trim());
          const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
          const rows = lines.slice(1).map(l => {
            const cols = l.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            const obj = {};
            headers.forEach((h, i) => { obj[h] = cols[i] || ''; });
            return obj;
          });
          _importState.workbook = null;
          _importState.sheetNames = [];
          _importState.headers = headers;
          _importState.rawRows = rows;
          autoMapColumns();
          renderImportView();
        }
      } catch (err) {
        showToast('Could not read file: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function loadExcelSheet(sheetName) {
    _importState.selectedSheet = sheetName;
    const sheet = _importState.workbook.Sheets[sheetName];
    const json = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
    _importState.rawRows = json;
    _importState.headers = json.length ? Object.keys(json[0]) : [];
    autoMapColumns();
    renderImportView();
  }

  function autoMapColumns() {
    const fields = IMPORT_SCHEMAS[_importState.table];
    const map = {};
    fields.forEach(f => {
      const fl = f.toLowerCase();
      const match = _importState.headers.find(h => {
        const hl = h.toLowerCase().replace(/[^a-z0-9]/g, '');
        return hl === fl || hl.includes(fl) || fl.includes(hl);
      });
      map[f] = match || '';
    });
    _importState.mapping = map;
  }

  async function executeImport() {
    const fields = IMPORT_SCHEMAS[_importState.table];
    const mapped = _importState.rawRows.map(r => {
      const obj = {};
      fields.forEach(f => {
        const src = _importState.mapping[f];
        obj[f] = src ? r[src] : '';
      });
      return obj;
    });

    const res = await gas('importRecords', _importState.table, mapped);
    showToast(`Successfully imported ${res.imported} rows into ${_importState.table}!`);
    _importState.rawRows = [];
    _importState.headers = [];
    _importState.sheetNames = [];
    await refreshData();
  }

  function downloadImportTemplate() {
    const fields = IMPORT_SCHEMAS[_importState.table];
    const csv = fields.join(',') + '\n';
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = _importState.table + '_Template.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  /* ==========================================================================
   * Table Search Helper
   * ======================================================================== */

  function filterTable(tableId, query) {
    const q = query.toLowerCase();
    const rows = document.querySelectorAll('#' + tableId + ' tbody tr');
    rows.forEach(tr => {
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  }
</script>
